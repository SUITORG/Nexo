workflow:
  name: kit-ciclo
  display_name: "KITCiclo — Maintenance Cycle (auto-wrapper)"
  description: >
    Mandatory pre/post-flight for any code modification. Orchestrates the
    8-phase maintenance cycle: Contrato → Encuadre → Implementación →
    Validación → Iteración → Plan Sync → Sync → Push. Runs automatically
    when maintenance keywords are detected or when code changes are made.
  risk: medium
  domain: governance

  entry:
    requires_planning: false
    requires_confirmation: false
    required_context:
      - AGENTS.md
      - contexto.md
      - INDEX_FUNCIONES.md
    required_skills:
      - contrato-subproyecto
      - iteration-loop
      - multi-tenant
    forbidden_if:
      - "No code changes detected"

  steps:
    # ── F0: Contrato ───────────────────────────────────────────────────
    - id: f0-contrato
      description: "Resolve scope, find or create CONTRATO.md"
      action: read+write
      skills:
        - contrato-subproyecto
      condition: always
      produces: CONTRATO.md
      validation:
        - "CONTRATO.md exists in scope"
        - "POR CONFIRMAR items listed for unverified rules"
        - "Scope boundaries documented"
      commit: true
      commit_phase: 0
      commit_name: "contrato"

    # ── F1: Encuadre 20/80 ────────────────────────────────────────────
    - id: f1-encuadre
      description: "Prioritize: impact vs effort, discard explicitly"
      action: plan
      condition: always
      validation:
        - "Scope defined within contract boundaries"
        - "Items prioritized by impact/effort"
        - "Discarded items documented with rationale"
      commit: true
      commit_phase: 1
      commit_name: "encuadre"

    # ── F2: Implementación ────────────────────────────────────────────
    - id: f2-implementacion
      description: "Execute code changes within scope"
      action: write
      condition: always
      validation:
        - "Changes match scope defined in F0"
        - "No modifications outside scope without permission"
        - "Syntax valid (node --check for .js files)"
        - "Multi-tenant isolation preserved"
        - "No hardcoded secrets"
      commit: true
      commit_phase: 2
      commit_name: "implementacion"

    # ── F3: Validación ────────────────────────────────────────────────
    - id: f3-validacion
      description: "Run verification commands, record results in VALIDACION.md"
      action: test
      skills:
        - iteration-loop
      condition: always
      produces: VALIDACION.md
      validation:
        - "All checks recorded in VALIDACION.md table"
        - "Each check has verdict: PASA or FALLA"
        - "GAPs documented (non-verifiable now)"
      commit: true
      commit_phase: 3
      commit_name: "validacion"

    # ── F4: Iteración (solo si F3 falló) ─────────────────────────────
    - id: f4-iteracion
      description: "Fix failing checks — max 3 rounds"
      action: fix
      skills:
        - iteration-loop
      condition: "if F3 verdict is FALLA"
      produces: CORRECCIONES.md
      validation:
        - "All checks PASA after iterations"
        - "CORRECCIONES.md updated with root cause + fix"
        - "No refactoring during iteration (minimum fix)"
        - "If round = 3 and still FAIL → stop and ask user"
      commit: true
      commit_phase: 4
      commit_name: "iteracion"

    # ── F5: Plan de Sync (solo si hay delta de esquema) ───────────────
    - id: f5-plan-sync
      description: "Detect schema delta, fill PLAN-SYNC.md per company"
      action: plan
      skills:
        - data-sync
        - multi-tenant
      condition: "if schema delta detected (new columns, type changes, renames)"
      produces: PLAN-SYNC.md
      validation:
        - "Delta documented per column: NUEVA/ELIMINADA/RENOMBRADA/TIPO"
        - "Per-company actions with db_engine classification"
        - "Destructive changes flagged"
        - "User approval obtained (PENDIENTE → APROBADO)"
      commit: true
      commit_phase: 5
      commit_name: "plan-sync"

    # ── F6: Sync ejecutado (solo si F5 aprobado) ─────────────────────
    - id: f6-sync
      description: "Execute sync per company with approval"
      action: write
      skills:
        - data-sync
        - data-cleanup
        - multi-tenant
      condition: "if F5 approval is APROBADO (TOTAL or PARCIAL)"
      validation:
        - "Each company synced independently"
        - "Idempotent re-run verified"
        - "Post-sync schema matches PLAN-SYNC.md"
        - "If one company fails → stop, report, don't continue"
      commit: true
      commit_phase: 6
      commit_name: "sync"

    # ── F7: Push (solo si usuario confirma) ──────────────────────────
    - id: f7-push
      description: "Push to GitHub"
      action: git
      condition: "if user explicitly confirms"
      command: "git push origin main"
      validation:
        - "All phase commits are on branch"
        - "No uncommitted changes remain"

  exit:
    validation:
      - "CONTRATO.md exists in scope"
      - "VALIDACION.md has all PASA (or user approved exceptions)"
      - "CORRECCIONES.md updated if iterations occurred"
      - "PLAN-SYNC.md completed if schema delta existed"
      - "All phase commits follow format: ciclo(f{N}/{FASE})[{REL}]"
    requires_commit: false
    notifies:
      - telemetry

  config:
    allowed_models:
      - claude-sonnet
      - deepseek-flash
    max_iterations: 3
    auto_commit_per_phase: true
