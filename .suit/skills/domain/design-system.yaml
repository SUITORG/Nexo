skill:
  name: design-system
  display_name: "Design System - Theme & Typography"
  version: 1.0.0
  type: domain
  domain: design
  description: >
    Manages visual identity for landings: colors, typography, palettes and templates.
    Uses pipe-delimited format in color_tema field (#hex|candado:0|pal:pal-teal|tp:tp-01|tpl:lp-local-service).
    Resolves presets from KitPlantillaDinamicaLandigPage/presets.json and applies CSS variables.
  dependencies: []
  triggers:
    - keyword: "color"
    - keyword: "tema"
    - keyword: "theme"
    - keyword: "tipografía"
    - keyword: "typography"
    - keyword: "diseño visual"
    - keyword: "paleta"
    - keyword: "palette"
    - keyword: "landing"
    - keyword: "font"
    - keyword: "fuente"
    - file_pattern: "**/presets.json"
    - file_pattern: "**/theme*"
  context_hint:
    - "KitPlantillaDinamicaLandigPage/presets.json"
    - "KitPlantillaDinamicaLandigPage/theme.schema.json"
    - "scripts/parse-theme.js"
    - "js/modules/ui.js"
    - "backend/theme-sidebar.js"
  rules:
    - id: ds-001
      description: "color_tema format is pipe-delimited, never plain hex"
      severity: error
    - id: ds-002
      description: "Presets are the source of truth - don't invent new palette IDs"
      severity: error
    - id: ds-003
      description: "candado:1 means user wants suggested template - respect it"
      severity: warning
    - id: ds-004
      description: "candado:0 (default) means don't touch site structure"
      severity: error
    - id: ds-005
      description: "All fields except hex are optional - system must never break on missing data"
      severity: error
  presets:
    palettes:
      - id: "pal-teal"
        name: "Nexus teal"
        tone: "Moderno, confianza"
      - id: "pal-navy"
        name: "Navy fintech"
        tone: "Corporativo, autoridad"
      - id: "pal-terra"
        name: "Terracota cálida"
        tone: "Cálido, cercano"
      - id: "pal-forest"
        name: "Verde sostenible"
        tone: "Natural, ecológico"
      - id: "pal-violet"
        name: "Violeta producto"
        tone: "Creativo, SaaS"
      - id: "pal-mono"
        name: "Mono alto contraste"
        tone: "Minimal, editorial"
    fontPairs:
      - id: "tp-01"
        tone: "SaaS moderno"
        heading: "Satoshi 700"
        body: "Satoshi 400"
      - id: "tp-02"
        tone: "Editorial premium"
        heading: "Instrument Serif 400"
        body: "DM Sans 400"
      - id: "tp-03"
        tone: "Corporativo sobrio"
        heading: "General Sans 600"
        body: "Inter 400"
      - id: "tp-04"
        tone: "Tech / dev"
        heading: "Space Grotesk 600"
        body: "IBM Plex Sans 400"
      - id: "tp-05"
        tone: "Lujo / boutique"
        heading: "Fraunces 600"
        body: "Work Sans 400"
      - id: "tp-06"
        tone: "Salud / confianza"
        heading: "Bricolage Grotesque 600"
        body: "Source Sans 3 400"
      - id: "tp-07"
        tone: "Infoproducto directo"
        heading: "Archivo 700"
        body: "Public Sans 400"
      - id: "tp-08"
        tone: "Servicio local"
        heading: "Outfit 600"
        body: "Manrope 400"
      - id: "tp-09"
        tone: "Fintech autoridad"
        heading: "Source Serif 4 600"
        body: "Source Sans 3 400"
      - id: "tp-10"
        tone: "Creativo expresivo"
        heading: "Bespoke Serif 500"
        body: "Switzer 400"
    templates:
      - id: "lp-squeeze-minimal"
        type: "squeeze"
        goal: "lead"
        useCase: "Captura de email con lead magnet"
      - id: "lp-saas-trial"
        type: "saas-trial"
        goal: "registro"
        useCase: "Prueba gratis B2B"
      - id: "lp-sales-longform"
        type: "sales-long-form"
        goal: "venta"
        useCase: "Carta de ventas larga"
      - id: "lp-local-service"
        type: "local-service"
        goal: "llamada"
        useCase: "Negocio local"
      - id: "lp-webinar"
        type: "webinar"
        goal: "registro"
        useCase: "Registro a webinar"
      - id: "lp-product-ecom"
        type: "product-detail"
        goal: "venta"
        useCase: "Producto físico"
      - id: "lp-booking"
        type: "booking"
        goal: "cita"
        useCase: "Agenda consultoría"
      - id: "lp-waitlist"
        type: "waitlist-coming-soon"
        goal: "waitlist"
        useCase: "Prelanzamiento"
      - id: "lp-vsl"
        type: "vsl"
        goal: "venta"
        useCase: "Video de ventas largo"
      - id: "lp-link-in-bio"
        type: "link-in-bio"
        goal: "tráfico"
        useCase: "Link in bio para redes"
  process:
    - "Read color_tema from Config_Empresas (pipe-delimited format)"
    - "Parse with scripts/parse-theme.js or inline parser"
    - "Resolve palette by Euclidean RGB distance if not specified"
    - "Resolve font pair from presets"
    - "Resolve template from presets"
    - "Apply CSS variables to landing template"
    - "Generate font import URL (Google Fonts or Fontshare)"
