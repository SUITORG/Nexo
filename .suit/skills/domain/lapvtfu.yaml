skill:
  name: lapvtfu
  display_name: "LAPVTFU - Activos del Brief (7 slots: verificar · generar · escribir)"
  version: 1.2.0
  type: domain
  domain: marketing
  description: >
    Gestiona el segmento LAPVTFU (posición 10 del vector Brief en Config_Empresas.logo_url):
    manifiesto POSICIONAL de 7 slots de assets en Drive. Estándar 2026-09-29: archivos PLANOS
    en la raíz de cte<id>/ con nombre <base>NN.<ext> (logo01, avatar01, fotoprs01, videos01,
    testimonios01, fotos01, contenido01; NN=01 y 02+ solo V·T·F; multi con separador ';')
    y share ANYONE. v1.2 agrega el MODO GENERACIÓN: con el eslabón `activos` en auto|preguntar
    (o comando explícito) genera Fotos (hasta 6) y Videos cortos (1-3, 9:16, 15-30 s) con
    motores locales en cascada, y SOLO en negocios DEMO genera Testimonios marcados DEMO.
    Idempotencia total (jamás regenera ni sobreescribe), nunca toca la foto personal (slot 3)
    ni los 20 segmentos de contenido; en modo manual (subida del usuario) no inventa nada:
    shareCteFile + setLapvtfuSlot sin cambios. Ver SUBCONTRATO-ACTIVOS.md.
  dependencies:
    - javascript
    - gas
  triggers:
    - "LAPVTFU"
    - "activos del brief"
    - "genera activos"
    - "activos auto"
    - "asegurar logo"
    - "asegurar avatar"
    - "ensure logo"
    - "ensure avatar"
    - "fotopersonal"
    - "fotoprs01"
    - "logo01"
    - "contenido01"
    - "shareCteFile"
    - "setLapvtfuSlot"
    - "7 slots"
    - file_pattern: "backend/core.js"
    - file_pattern: "backend/brief-sidebar.js"
    - file_pattern: "scripts/brief-generate.js"
  context_hint:
    - "SUBCONTRATO-ACTIVOS.md"
    - "backend/core.js"
    - "backend/brief-sidebar.js"
    - "scripts/brief-generate.js"
    - ".suit/memory/decisions/ADR-025-brief-vector-logo-url-contrato.md"
    - ".suit/memory/decisions/ADR-026-consolidacion-logo-url-brief-vector.md"
    - ".suit/memory/decisions/ADR-028-raiz-mydrive-logo-en-cte.md"
  rules:
    - id: lf-001
      description: "7 posiciones siempre - jamás compactar ni filtrar posiciones vacías (desalineación = bug de ADR-026)"
      severity: error
    - id: lf-002
      description: "Escritor único del segmento: _setLapvtfuSlot_ (backend/core.js) - preserva los 20 segmentos de contenido byte a byte"
      severity: error
    - id: lf-003
      description: "Idempotencia: asset ya generado → reutilizar (existing), jamás regenerar"
      severity: error
    - id: lf-004
      description: "Slot 2: no_foto = skip total; jamás placeholder; jamás fallback AvatarLogo dentro del manifiesto"
      severity: error
    - id: lf-005
      description: "Share ANYONE en Drive antes de publicar URL (patrón _finalizeAvatar_) - antes del 180000 ms del flujo completo"
      severity: error
    - id: lf-006
      description: "Raíz de escritura: RAIZ de cte<id>/ con nombre estándar <base>NN.<ext> (ADR-028 + estándar 2026-09-29) - _activos/ y _brief/ solo fallback de LECTURA (sin migrar)"
      severity: error
    - id: lf-007
      description: "[PENDIENTE - Activo] es convención de DISPLAY (parseBriefLocal) - en storage las posiciones vacías son ''"
      severity: warning
    - id: lf-008
      description: "Timeouts GAS de 180 s en los 5 calls del flujo avatar (gotcha verificado en vivo)"
      severity: warning
    - id: lf-009
      description: "Estándar de nombres (2026-09-29): <base>NN.<ext> plano en cte<id>/ (logo01, avatar01, fotoprs01, videos01, testimonios01, fotos01, contenido01) - extensión natural; NN=01 y 02+ SOLO V·T·F; multi con separador ';' dentro del slot; nunca crear _brief/_activos nuevos"
      severity: error
    - id: lf-010
      description: "V·T·F y contenido: subida MANUAL del usuario a la raíz → agente comparte con shareCteFile (ANYONE antes de publicar) y escribe slot con setLapvtfuSlot (wrapper del escritor único) - jamás inventar URLs"
      severity: error
    - id: lf-011
      description: "MODO GENERACIÓN solo con switch `activos` en auto|preguntar (o comando explícito); en skip no se genera nada"
      severity: error
    - id: lf-012
      description: "El flujo manual no cambia; la generación es aditiva - jamás sustituye ni sobreescribe recursos reales"
      severity: error
    - id: lf-013
      description: "Idempotencia total: segundo pase = existing; cero regeneración"
      severity: error
    - id: lf-014
      description: "Testimonios sintéticos SOLO en negocio DEMO y marcados 'DEMO'; sin cifras/certificaciones inventadas; cliente real → [PENDIENTE]"
      severity: error
    - id: lf-015
      description: "Preferencia local (ComfyUI/FFmpeg/Remotion, costo $0); nube solo fallback; registrar motor usado por asset"
      severity: warning
    - id: lf-016
      description: "Los generados se marcan en metadata (origen: ai en prompts_imagenes.json/brief.json); los nombres de archivo no cambian (estándar <base>NN)"
      severity: warning
    - id: lf-017
      description: "Toda URL publicada se verifica sin sesión; si no verifica → [PENDIENTE - enlace sin verificar]"
      severity: error
  slots:
    - { num: 1, name: "logo",        flow: "ensureLogoUrl",  estado: "operativo" }
    - { num: 2, name: "avatar",      flow: "ensureAvatarUrl", estado: "operativo" }
    - { num: 3, name: "fotoprs",     flow: "subida manual + lectura gate avatar", estado: "manual - JAMÁS se genera" }
    - { num: 4, name: "videos",      flow: "manual (shareCteFile/setLapvtfuSlot) + GENERA v1.2", estado: "generable - default 1-3 clips 9:16 de 15-30 s" }
    - { num: 5, name: "testimonios", flow: "manual + GENERA SOLO DEMO v1.2", estado: "generable solo en DEMO (marcados DEMO)" }
    - { num: 6, name: "fotos",       flow: "manual + GENERA v1.2", estado: "generable - default hasta 6 imágenes del nicho" }
    - { num: 7, name: "contenido",   flow: "manual (shareCteFile/setLapvtfuSlot)", estado: "manual (contenido01)" }
  generacion:
    gate: "switch activos: auto=directo | preguntar=preview [s/n] | skip=no toca; o comando explícito"
    idempotencia: "slot con asset → existing → skip; jamás regenerar ni sobreescribir"
    cascada_fotos: ["google-flow-mcp (generate-asset.cjs, clone local, ADR-050 — preferente)", "comfyui-local (127.0.0.1:8188 SuitComfy)", "muapi-opencode-skills (si instaladas)", "gemini"]
    cascada_videos: ["google-flow-mcp (video via chat, ADR-050)", "suitcomfy+ffmpeg (127.0.0.1:3012 /api/video)", "remotion-vire (3004)", "kling (solo key activa + aprobación)"]
    topes_por_corrida: { fotos: 6, videos: 2, testimonios_demo: 2 }
    registro: "cte<id>/_brief/prompts_imagenes.json (prompt, motor, seed, fecha) + origen: ai"
    nunca: ["foto personal (slot 3)", "sobreescribir existentes", "inventar testimonios en cliente real"]
  process:
    - "1. Leer el vector y localizar el segmento LAPVTFU (posición 10) - parseBrief"
    - "2. Gate: switch activos (auto/preguntar/skip) o comando explícito"
    - "3. Slots 1-2: ensure vía POST /api/brief/ensure-* (o botón sidebar). Estados: existing | no_foto | needs_generate"
    - "4. Slots vacíos (modo GENERACIÓN): cascada de motores → subir a raíz con nombre estándar → share ANYONE → setLapvtfuSlot → verificar URL sin sesión"
    - "5. Slots manuales: archivo en raíz → shareCteFile → setLapvtfuSlot (multi V·T·F unido con ';'); si falta → [PENDIENTE], no inventar"
    - "6. Backup del vector antes de escribir; 7 posiciones siempre; preservar los 20 segmentos byte a byte"
