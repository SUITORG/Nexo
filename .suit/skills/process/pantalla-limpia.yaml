skill:
  name: pantalla-limpia
  display_name: "Pantalla Limpia — Auditoría de Claridad de UI"
  version: 1.0.0
  type: process
  domain: quality

  description: >
    Auditoría genérica de claridad por pantalla (solo lectura): inventario de pantallas,
    ficha por pantalla, clasificación QUITAR/MOVER/COLAPSAR/RENOMBRAR/SEPARAR, Pareto
    efecto×esfuerzo y veredicto con estructura fija. Menos es más, 1% / 20-80.
    Invocable por otras skills (contrato de invocación con entradas/salidas).

  dependencies: []

  triggers:
    - keyword: "revisa las pantallas"
    - keyword: "audita las pantallas"
    - keyword: "revisión de claridad"
    - keyword: "limpia la UI"
    - keyword: "está amontonado"
    - keyword: "no se entiende"
    - keyword: "confuso"
    - keyword: "menos es más"
    - keyword: "prueba de los 5 segundos"

  context_hint:
    - ".agents/skills/pantalla-limpia/SKILL.md"

  rules:
    - id: pl-001
      description: "Solo lectura — el único escrito es el veredicto y la nota de pendientes"
      severity: error
    - id: pl-002
      description: "Evidencia archivo:línea en cada hallazgo; lo no verificable se marca, no se inventa"
      severity: error
    - id: pl-003
      description: "Alcance cerrado al proyecto indicado; máximo 3 preguntas o supuestos explícitos"
      severity: error

  validation:
    - "Veredicto con estructura fija §CONTRATO C (8 secciones)"
    - "Pantallas cubiertas = inventario completo (n/total)"
    - "Hallazgos de severidad alta re-verificados antes de cerrar"
