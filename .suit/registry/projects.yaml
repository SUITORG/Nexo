projects:
  root:
    path: ./
    agents: .suit/registry/agents.yaml
    skills: .suit/registry/skills.yaml
    context:
      - AGENTS.md
      - contexto.md
      - INDEX_FUNCIONES.md
      - opencode.json
    servers:
      - name: main
        path: server.js
        port: 3001
        type: express

  campanas-ai:
    path: SuitCampanas/
    agents: SuitCampanas/CLAUDE.md
    skills:
      - trend-analysis
      - content-generation
      - javascript
      - comfy-ui
    context:
      - SuitCampanas/CLAUDE.md
      - SuitCampanas/script.js
      - SuitCampanas/config/prompts.json
      - SuitCampanas/config/formatos.json
      - SuitCampanas/local-server-node.js
      - SuitCampanas/backend.gs
      - SuitCampanas/CODE_INDEX.md
    environment:
      PORT: 8000
      TYPE: cms
    servers:
      - name: cms
        path: SuitCampanas/local-server-node.js
        port: 8000
        type: http

  citas:
    path: citas/
    agents: citas/AGENTS.md
    skills:
      - reservations-engine
    context:
      - citas/index.js
      - citas/services/ai.js
      - citas/handlers/actions.js
      - citas/db/schema.sql
    environment:
      PORT: 3002
      TYPE: service
    status: deprecated
    migration: SuitReservaciones/
    servers:
      - name: appointments
        path: citas/index.js
        port: 3002
        type: express

  suitreservaciones:
    path: SuitReservaciones/
    description: "Módulo de Reservaciones con WhatsApp + Google Calendar. Reemplaza citas/. Niveles: 1 (WhatsApp), 2 (+ Calendar)."
    skills:
      - reservations-engine
      - javascript
      - multi-tenant
    context:
      - SuitReservaciones/index.js
      - SuitReservaciones/services/ai.js
      - SuitReservaciones/handlers/actions.js
      - SuitReservaciones/handlers/webhook.js
      - SuitReservaciones/db/schema.sql
      - SuitReservaciones/package.json
    frontend:
      public: true
      public_route: "#home (botón en hero)"
      public_gate: "usa_reservaciones >= 1"
      staff: true
      staff_route: "#reservations"
      staff_gate: "usa_reservaciones >= 1 AND modulos_visibles CONTAINS 'reservations'"
      staff_rbac: "STAFF >= 5, ADMIN >= 10"
      api_endpoints:
        - "POST /api/reservaciones (público)"
        - "PATCH /api/reservaciones/:id (staff)"
        - "GET /api/reservaciones (staff)"
        - "GET /api/clientes (staff)"
    environment:
      PORT: 3002
      TYPE: service
    servers:
      - name: appointments
        path: SuitReservaciones/index.js
        port: 3002
        type: express
    tables:
      - Reservaciones
      - clientes
      - lista_espera
      - Logs_Chat_IA
      - Config_Empresas
    validation:
      field: "usa_reservaciones"
      values:
        0: "desactivado"
        1: "WhatsApp básico"
        2: "WhatsApp + Calendar"

  vire:
    name: "ViRe — Video con Remotion"
    path: SuitVidGenRemotion/
    description: "Módulo de generación de video profesional con Remotion. Crea composiciones animadas, presentaciones dinámicas y contenido multimedia programático desde React. Servido en puerto 3004."
    skills:
      - remotion-video
      - javascript
    context:
      - SuitVidGenRemotion/src/Root.tsx
      - SuitVidGenRemotion/src/Composition.tsx
      - SuitVidGenRemotion/package.json
    environment:
      PORT: 3004
      TYPE: remotion
    servers:
      - name: studio
        path: SuitVidGenRemotion/
        port: 3004
        type: remotion

  suit-pedido-express:
    name: "Pedido Express — Menú Digital + Órdenes"
    path: SuitPedidoExpress/
    description: "Módulo de Pedido Express: menú digital, carrito, checkout. Scaffold inicial — puerto 3005."
    skills:
      - javascript
      - multi-tenant
    context:
      - SuitPedidoExpress/index.js
      - SuitPedidoExpress/package.json
    frontend:
      public: true
      public_route: "#food-app-area"
      public_gate: "modo EXPRESS=1 AND tipo_negocio IN (ALIMENTOS,COMIDA,RESTAURANTE,FOOD)"
      staff: false
    environment:
      PORT: 3005
      TYPE: service
    servers:
      - name: pedido-express
        path: SuitPedidoExpress/index.js
        port: 3005
        type: express

  suit-pos:
    name: "POS — Punto de Venta + Monitoreo"
    path: SuitPos/
    description: "Módulo de POS: venta en mostrador, monitoreo de órdenes, Stripe. Scaffold inicial — puerto 3006."
    skills:
      - javascript
      - multi-tenant
    context:
      - SuitPos/index.js
      - SuitPos/package.json
    frontend:
      public: false
      staff: true
      staff_route: "#staff-pos, #pos"
      staff_gate: "modo POS=1 AND modulos_visibles CONTAINS 'pos' OR 'staff-pos'"
      staff_rbac: "STAFF >= 2"
    environment:
      PORT: 3006
      TYPE: service
    servers:
      - name: pos
        path: SuitPos/index.js
        port: 3006
        type: express

  suit-productos:
    name: "Productos — Catálogo + Precios"
    path: SuitProductos/
    description: "Módulo de Productos: catálogo multi-categoría, precios, gestión de variantes. Supabase exclusivo — puerto 3007."
    skills:
      - javascript
      - multi-tenant
    context:
      - SuitProductos/index.js
      - SuitProductos/package.json
    frontend:
      public: false
      staff: true
      staff_route: "#productos"
      staff_gate: "modo PRODUCTOS=1"
      staff_rbac: "ADMIN >= 10"
    environment:
      PORT: 3007
      TYPE: service
    servers:
      - name: productos
        path: SuitProductos/index.js
        port: 3007
        type: express
    tables:
      - Catalogo

  suit-inventarios:
    name: "Inventarios — Stock + Movimientos"
    path: SuitInventarios/
    description: "Módulo de Inventarios: control de stock, movimientos (entrada/salida/ajuste), historial. Supabase exclusivo — puerto 3008."
    skills:
      - javascript
      - multi-tenant
    context:
      - SuitInventarios/index.js
      - SuitInventarios/package.json
    frontend:
      public: false
      staff: true
      staff_route: "#inventarios"
      staff_gate: "modo INVENTARIOS=1"
      staff_rbac: "ADMIN >= 10"
    environment:
      PORT: 3008
      TYPE: service
    servers:
      - name: inventarios
        path: SuitInventarios/index.js
        port: 3008
        type: express
    tables:
      - Inventario
      - Movimientos_Inventario

  suit-bodega:
    name: "Bodega — Ubicaciones + Transferencias"
    path: SuitBodega/
    description: "Módulo de Bodega: gestión de ubicaciones físicas, transferencias entre bodegas. Supabase exclusivo — puerto 3009."
    skills:
      - javascript
      - multi-tenant
    context:
      - SuitBodega/index.js
      - SuitBodega/package.json
    frontend:
      public: false
      staff: true
      staff_route: "#bodega"
      staff_gate: "modo BODEGA=1"
      staff_rbac: "ADMIN >= 10"
    environment:
      PORT: 3009
      TYPE: service
    servers:
      - name: bodega
        path: SuitBodega/index.js
        port: 3009
        type: express
    tables:
      - Bodegas
      - Transferencias

  suit-ai:
    name: "SuitAI — Model Discovery + Auto-Routing + Circuit Breaker"
    path: SuitAI/
    description: "Módulo de IA: auto-descubre modelos gratis de OpenRouter y OpenCode Zen, prueba conectividad, rutea mensajes al mejor disponible con circuit breaker. Puerto 3010."
    skills:
      - javascript
      - multi-tenant
      - system-analysis
    context:
      - SuitAI/index.js
      - SuitAI/handlers/api.js
      - SuitAI/services/modelScanner.js
      - SuitAI/services/modelRouter.js
      - SuitAI/services/circuitBreaker.js
    frontend:
      public: true
      public_route: "POST /api/ai/chat (público)"
      public_gate: "ninguno — disponible para todas las empresas"
      staff: true
      staff_route: "#ai-models (futuro)"
      staff_rbac: "ADMIN >= 10"
    environment:
      PORT: 3010
      TYPE: service
    servers:
      - name: ai
        path: SuitAI/index.js
        port: 3010
        type: express
    tables: []

  suit-cotizador:
    name: "Portal de Cotización en Línea"
    path: SuitCotizador/
    description: "Calculadoras configurables por proceso/producto/servicio. Cotización autónoma → Lead/Proyecto/Orden. Habilitado solo si Config_Empresas.giro_especifico contiene ',1' al final (ej: 'Energía Solar,1'). Validación robusta contra nulos/vacíos."
    db_engine: SUPABASE
    dependencies:
      - js/modules/public.js
      - js/modules/admin.js
      - backend/core.js
      - backend/utils.js
      - backend/ai_engine.js
      - backend/DriveManager.js
    skills:
      - multi-tenant
      - javascript
      - cotizaciones-engine
      - pdf-generation
    context:
      - AGENTS.md
      - contexto.md
      - INDEX_FUNCIONES.md
      - js/modules/public.js
      - js/modules/admin.js
      - backend/core.js
      - backend/utils.js
      - backend/ai_engine.js
      - backend/DriveManager.js
      - server.js
    tables:
      - Cotizaciones
      - Cotizacion_Detalle
      - Procesos_Cotizacion
      - Variables_Cotizacion
      - Reglas_Precios
      - Leads
      - Proyectos
      - Catalogo
      - Clientes
      - Config_Empresas
    environment:
      PORT: 3001
      DB_ENGINE: SUPABASE
      TYPE: feature
    validation:
      giro_field: "giro_especifico"
      enable_pattern: ",1$"
      fallback: false
      error_message: "El giro de la empresa no tiene habilitado el módulo de cotizaciones"

  suit-ffmpeg:
    name: "SuitFFmpeg — Wrapper FFmpeg"
    path: SuitFFmpeg/
    description: "Wrapper local para FFmpeg. Auto-detecta ruta del sistema. Usado por SuitCampanas (animate, slideshow, video-imaginacion, video-produce)."
    skills:
      - javascript
    context:
      - SuitFFmpeg/README.md
      - SuitFFmpeg/scripts/verify.js
    environment:
      TYPE: tool
    notes: "FFmpeg v8.1.1 via WinGet. Ruta auto-detectada o configurable via FFMPEG_PATH en .env"

  suit-comfy:
    name: "SuitComfy — Imagen + Video con ComfyUI (local, gratis)"
    path: SuitComfy/
    description: "Módulo de generación de imagen con ComfyUI (SD1.5 + LoRA LCM, corre en CPU) y ensamblaje de video profesional con FFmpeg (Ken Burns + crossfade). 100% local, sin GPU NVIDIA. Aislado de SuitCampanas y ViRe. ComfyUI en puerto 8188."
    skills:
      - comfy-ui
      - javascript
    context:
      - SuitComfy/README.md
      - SuitComfy/AGENTS.md
      - SuitComfy/index.js
      - SuitComfy/workflows/txt2img-lcm.json
    environment:
      PORT: 3012
      TYPE: service
      COMFYUI_URL: http://127.0.0.1:8188
    servers:
      - name: suitcomfy
        path: SuitComfy/index.js
        port: 3012
        type: express
    api_endpoints:
      - "GET /api/health"
      - "POST /api/image (genera 1 imagen con parámetros)"
      - "POST /api/video (genera N escenas + ensambla MP4 con FFmpeg)"
    hardware:
      gpu: none
      notes: "CPU-only. Imagen LCM 512² ≈ 1-2 min; video 4 escenas ≈ 5-15 min."
    dependencies:
      - ComfyUI Desktop (http://127.0.0.1:8188, --cpu)
      - FFmpeg v8.1.1 (WinGet)

  suit-chat-tg:
    name: "SuitChatTG — Chatbot Telegram multi-inquilino"
    path: SuitChatTG/
    description: "Chatbot con IA para Telegram. Recoge Leads, mantiene memoria persistente (Memoria_IA_Snapshots), y usa prompts desde Prompts_IA vía GAS backend. id_empresa=ROOMATENL por defecto."
    skills:
      - javascript
      - multi-tenant
    context:
      - SuitChatTG/index.js
      - SuitChatTG/handlers/telegram.js
      - SuitChatTG/handlers/ai.js
      - SuitChatTG/handlers/leads.js
      - SuitChatTG/handlers/memory.js
      - SuitChatTG/db/gas-client.js
      - backend/core.js
      - backend/utils.js
    frontend:
      public: true
      public_route: "#chat-tg (enlace tipo t.me/tu_bot?start=ROOMATENL)"
      public_gate: "usa_agente_ai = TRUE AND agent_enabled = TRUE"
      staff: true
      staff_route: "#admin-chat-tg"
      staff_gate: "usa_soporte_ia activo"
      staff_rbac: "ADMIN >= 10"
      api_endpoints:
        - "GET /api/health"
        - "GET /api/sessions"
        - "GET /api/link"
    environment:
      PORT: 3011
      TYPE: service
    servers:
      - name: telegram-bot
        path: SuitChatTG/index.js
        port: 3011
        type: express
    tables:
      - Leads
      - Memoria_IA_Snapshots
      - Logs_Chat_IA
      - Prompts_IA
      - Config_Empresas

  suitpoke:
    name: "SuitPoke — Duelo de Cartas (PvP online PWA)"
    path: SuitPoke/
    description: "Juego de cartas estilo battler (emula mecánicas TCG, no copia Pokémon): 2-4 jugadores, salas online por código con SSE, oponentes IA, sonido WebAudio, PWA instalable. Cero dependencias npm; motor compartido servidor/cliente."
    type: game
    skills:
      - javascript
    context:
      - SuitPoke/docs/CONTRATO.md
      - SuitPoke/README.md
      - SuitPoke/docs/GUIA_JUEGO.md
      - SuitPoke/js/motor.js
      - SuitPoke/server.js
    frontend:
      public: true
      public_route: "http://localhost:3014 (servidor propio, fuera del SPA raíz)"
      public_gate: "sin gate — no usa Config_Empresas (exención multi-tenant, ADR-036)"
      staff: false
      api_endpoints:
        - POST /api/crear
        - POST /api/unirse
        - POST /api/accion
        - GET /api/stream (SSE)
        - GET /health
    environment:
      PORT: 3014
      TYPE: game
      DEPENDENCIES: "ninguna (Node stdlib)"
    servers:
      - name: suitpoke
        path: SuitPoke/server.js
        port: 3014
        type: http-stdlib
    notes: "Estado de partida en memoria (sin DB). Exención multi-tenant y sin persistencia: ADR-036. Reglas de negocio del juego: SuitPoke/docs/GUIA_JUEGO.md"

  suit-diccionario:
    name: "SuitDiccionario — Diccionario EN-ES Interactivo"
    path: SuitMiDBdic/
    description: "Diccionario completo de inglés-español con IPA, tiempos verbales, frasales, vocabulario temático, quizzes y IA para buscar palabras. Incluye 150 preguntas de ciudadanía de EE.UU."
    skills:
      - javascript
    context:
      - SuitMiDBdic/index.js
      - SuitMiDBdic/dictionary.html
    frontend:
      public: true
      public_route: "#diccionario"
      public_gate: "disponible para todas las empresas"
      staff: false
    environment:
      PORT: 3013
      TYPE: service
    servers:
      - name: diccionario
        path: SuitMiDBdic/index.js
        port: 3013
        type: express

  suit-board:
    name: "SuitBoard — Dashboard Crypto + US Market"
    path: SuitBoard/
    description: "Dashboard de mercado en un solo archivo HTML estático (sin build, sin servidor). Pestaña Crypto con datos en vivo vía API pública de CoinGecko (BTC/SOL/JUP/RAY/JTO/BONK). Pestaña US Market con datos estáticos/demo (sin API real todavía). Rescatado desde Downloads el 31/08/2026."
    type: static
    skills:
      - javascript
    context:
      - SuitBoard/CLAUDE.md
      - SuitBoard/index.html
    frontend:
      public: false
      staff: false
    environment:
      TYPE: static
    notes: "No pasa por el pipeline de deploy de GitHub Pages del repo raíz (igual que SuitCampanas). No trackeado en git todavía — pendiente decisión del usuario."

  suit-landings:
    name: "SuitLandings — Plantilla de Landing Pages multi-tenant"
    path: SuitLandings/
    description: "Plantilla estática de landing de conversión (hero, propuesta de valor, oferta/CTA, contacto). Consumida en build-time por scripts/ssg-engine.mjs. Sin servidor propio ni puerto — no es un servicio, es un template. Activación por flag landing en la posición 8 de Config_Empresas.modo (0/ausente = solo sitio, 1 = landing-only, 2 = sitio + landing). Toda landing es noindex."
    type: template
    skills:
      - javascript
      - multi-tenant
      - landing-pages
    context:
      - SuitLandings/landing-template.html
      - scripts/ssg-engine.mjs
      - js/modules/core.js
    frontend:
      public: true
      public_route: "{slug}.html (modo pos8=1) / {slug}-landing.html (modo pos8=2)"
      public_gate: "modo pos 8 (índice 7) = 1 o 2"
      staff: false
    environment:
      TYPE: template
      BUILD_TIME: "scripts/ssg-engine.mjs"
    columns: []
    notes: "Sin columnas nuevas en Config_Empresas (diseño final, ronda 3). Todo el contenido de landing vive en logo_url: \"{logo}|{hero}|{oferta}|{cta}\" (4 segmentos, ninguno requerido). Requiere fixDriveUrl() en js/modules/core.js con split('|')[0] al inicio para que el resto del SPA (10+ call sites) ignore los segmentos extra — ver ADR-023."

  suit-servihogar:
    name: "SuitServiHogar — Marketplace bilateral de servicios del hogar"
    path: SuitServiHogar/
    description: "Marketplace bilateral de servicios del hogar para Reynosa, Tamaulipas. React 19 + Vite + TS + Tailwind v4 | Supabase | Google OAuth | Stripe Connect. Proyecto aislado (micro-frontend) — no integra al SPA principal SuitOrg. Ver ADR-029."
    type: standalone
    architecture_exception: "React 19 permitido (excepción Regla #7 SuitOrg) — ver ADR-029"
    skills:
      - javascript
      - multi-tenant
    context:
      - SuitServiHogar/AGENTS.md
      - SuitServiHogar/Contrato.md
      - SuitServiHogar/schema.sql
      - SuitServiHogar/server.js
      - SuitServiHogar/src/App.tsx
    frontend:
      public: true
      public_route: "standalone (React SPA en puerto 3000 via Vite)"
      public_gate: "none (proyecto independiente)"
      staff: true
      staff_route: "/admin (AdminScreen.tsx)"
      staff_gate: "RLS admin (level >= 10)"
      api_endpoints:
        - POST /api/create-connect-account
        - POST /api/create-payment-intent
        - POST /api/validate-coupon
        - POST /api/webhook
        - GET /api/config
        - GET /api/config/:key
        - PUT /api/config/:key
        - GET /api/config/category/:cat
    environment:
      PORT: 3010
      TYPE: marketplace
    servers:
      - name: servihogar-api
        path: SuitServiHogar/server.js
        port: 3010
        type: express
    notes: "Proyecto aislado con React 19. No se integra al SPA principal SuitOrg. Comunicación vía URLs externas o APIs compartidas (Supabase, Stripe). Mantenido independientemente."

  suitcvlo-open:
    name: "SuitCVLO-open — Auditoría OOH con switch de IA multi-proveedor"
    path: SuitCVLO-open/
    description: "Fork open de \\cvlo-auditor (fuente de solo lectura): procesa lotes de fotos de publicidad exterior, las cruza con PINs por GPS y genera <AAMMPQ>\\auditoria\\<Grupo>\\<PIN>\\ + info.txt + idxfotos.xlsx. Motor de lectura desacoplado en ia/switch.py: OpenCode (suscripcion, unico con vision de sus 86 modelos) -> Ollama local -> HuggingFace (desactivado) -> DeepSeek -> OpenRouter (desactivado) -> Gemini, con circuit breaker. Sin base de datos, sin borrados, sin secretos en el codigo. Ver ADR-037, ADR-038, ADR-039 y ADR-041."
    type: standalone
    skills:
      - javascript
    context:
      - SuitCVLO-open/docs/CONTRATO.md
      - SuitCVLO-open/readme.md
      - SuitCVLO-open/ia/switch.py
      - SuitCVLO-open/motor.py
      - SuitCVLO-open/proceso.py
    frontend:
      public: true
      public_route: "http://127.0.0.1:3015/ (herramienta local, usuario único)"
      public_gate: "none (sin multi-inquilino)"
      staff: false
      staff_route: "none"
      staff_gate: "none"
      api_endpoints:
        - GET /
        - GET /api/estado
        - GET /api/ia/modelos
        - GET /api/ia/estado
        - POST /api/corridas
        - GET /api/corridas
        - GET /api/corridas/<id>
    environment:
      PORT: 3015
      TYPE: auditoria-ooh
      DB: archivos-locales
    servers:
      - name: cvlo-open
        path: SuitCVLO-open/app.py
        port: 3015
        type: flask
    notes: "Python/Flask a propósito: openpyxl + Pillow + EXIF/HEIC ya son Python (escalera ponytail). No consume Config_Empresas ni Supabase. \\cvlo-auditor es SOLO LECTURA."

  suitcvlo-gcpy:
    name: "SuitCVLOGCPy — Auditoría OOH en Google Colab (GPU gratis)"
    path: SuitCVLOGCPy/
    description: "Copia autocontenida del pipeline de SuitCVLO-open pensada para Google Colab: fotos, pines, salida e idxfotos.xlsx viven en Google Drive; procesa lotes de 40 fotos pendientes con la misma secuencia (GPS EXIF -> cruce por PIN -> estructura + info.txt + xlsx con columna FechaCarga). El modelo de visión (Qwen2.5-VL) corre DENTRO del notebook en la GPU gratis como primer eslabon de la cadena. Sin servidor, sin puerto. Ver ADR-040."
    type: standalone
    context:
      - SuitCVLOGCPy/docs/CONTRATO.md
      - SuitCVLOGCPy/INSTRUCCIONES.md
      - SuitCVLOGCPy/CVLO_Colab.ipynb
      - SuitCVLOGCPy/ia/switch.py
      - SuitCVLOGCPy/proceso.py
    frontend:
      public: false
      public_route: "none (notebook en Google Colab, no hay web)"
      public_gate: "none"
      staff: true
      staff_route: "Google Colab → SuitCVLOGCPy/CVLO_Colab.ipynb (celdas 1-7)"
      staff_gate: "cuenta Google con acceso a Drive + runtime con GPU"
      api_endpoints:
        - none (sin servidor; se ejecuta celda por celda)
    environment:
      TYPE: auditoria-ooh-colab
      RUNTIME: google-colab-gpu
      DB: archivos-en-drive
    servers: []
    notes: "Copia del pipeline desde SuitCVLO-open@7c612d3. NO se toca SuitCVLO-open (limite explicito del usuario 2026-10-02). Si la app local y Colab escriben el mismo idxfotos.xlsx a la vez, riesgo de pisarse: elegir uno por tanda."
  suit-review-pulse:
    name: "SuitReviewPulse � Monitor de rese�as Google"
    path: SuitReviewPulse/
    description: "Idea ganadora pipeline ideas-saas (juez 7.8, 2026-10-10): alerta de rese�as nuevas, ca�da de rating y borradores de respuesta. Wrapper Express 3016 sobre n�cleo Python asyncio + SQLite WAL. Ver ADR-047 (pipeline) y ADR-048 (promoci�n)."
    skills:
      - javascript
    context:
      - SuitReviewPulse/index.js
      - SuitReviewPulse/package.json
      - SuitReviewPulse/docs/MANUAL_TECNICO.md
      - SuitReviewPulse/docs/MANUAL_VENTAS.md
    frontend:
      public: false
      public_route: "none (API only)"
      public_gate: "none"
      staff: true
      staff_route: "none (API + CLI)"
      staff_gate: "proveedor SuitOrg"
      api_endpoints:
        - "GET /api/health"
        - "POST /api/import"
        - "GET /api/report/:empresa"
    environment:
      PORT: 3016
      TYPE: service
      DB: sqlite-local
    servers:
      - name: reviewpulse
        path: SuitReviewPulse/index.js
