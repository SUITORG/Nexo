routing:
  intents:
    - patterns:
        - "implement"
        - "add feature"
        - "create module"
        - "new functionality"
      workflow: feature
      priority: 10

    - patterns:
        - "fix"
        - "bug"
        - "error"
        - "crash"
        - "not working"
      workflow: bugfix
      priority: 20

    - patterns:
        - "audit"
        - "analyze"
        - "review architecture"
        - "diagnose"
      workflow: audit
      priority: 5

    - patterns:
        - "generate video"
        - "render video"
        - "remotion"
        - "vire"
        - "crear video"
        - "composición animada"
      workflow: video-generation
      priority: 50

    - patterns:
        - "deploy"
        - "release"
        - "publish"
      workflow: deploy
      priority: 30

    - patterns:
        - "document"
        - "docs"
        - "readme"
      workflow: docs
      priority: 5

    - patterns:
        - "migrate"
        - "migration"
        - "schema change"
      workflow: migration
      priority: 30

    - patterns:
        - "research"
        - "search"
        - "investigate"
        - "find"
      workflow: research
      priority: 5

    - patterns:
        - "review"
        - "validate"
        - "check"
        - "verify"
      workflow: review
      priority: 5

    - patterns:
        - "revisa"
        - "analiza seguridad"
        - "audita codigo"
        - "que opinas de"
        - "encuentra problemas en"
        - "reportero"
      workflow: review
      priority: 15
      agent: reportero
      skills_override:
        - code-review
        - security-audit

    - patterns:
        - "prueba"
        - "test"
        - "smoke test"
        - "verifica servidor"
        - "probador"
        - "ejecuta pruebas"
        - "corre tests"
      workflow: test
      priority: 15
      agent: probador
      skills_override:
        - system-analysis

    - patterns:
        - "cotizador"
        - "cotización"
        - "calculadora"
        - "proceso"
      workflow: cotizador
      priority: 15

    - patterns:
        - "reservacion"
        - "cita"
        - "agendar"
        - "appointment"
        - "schedule"
        - "whatsapp booking"
        - "lista de espera"
      workflow: reservacion
      priority: 15

    - patterns:
        - "evaluar proyecto"
        - "juzgar"
        - "panel de evaluación"
        - "aprobar modulo"
        - "aprobar módulo"
        - "viabilidad"
        - "nuevo proyecto"
        - "panel juzgador"
      workflow: panel-juzgador
      priority: 10

    - patterns:
        - "prospeccion"
        - "prospectos"
        - "oportunidades comerciales"
        - "empresas potenciales"
        - "buscar clientes"
        - "leads comerciales"
        - "monterrey empresas"
        - "negocios monterrey"
      workflow: prospeccion
      priority: 10
      agent: developer
      skills_override:
        - prospeccion-ia-monterrey
        - google-places-business-finder

    - patterns:
        - "sync"
        - "sincronizar"
        - "schema"
        - "esquema"
        - "migrar datos"
      workflow: data-sync
      priority: 25

    - patterns:
        - "depura"
        - "depurar"
        - "limpiar datos"
        - "basura"
        - "filas huérfanas"
        - "duplicados"
      workflow: data-cleanup
      priority: 25

    - patterns:
        - "mejoras"
        - "cambios"
        - "mantenimiento"
        - "modificaciones"
        - "compactar"
        - "compactacion"
        - "depuracion"
        - "ciclo"
        - "ciclo de mantenimiento"
        - "fase"
        - "actualizar codigo"
        - "refactorizar"
        - "optimizar"
        - "limpiar codigo"
      workflow: kit-ciclo
      priority: 25
      entry_phase: full  # F0→F1→F2→F3→(F4)→(F5→F6)→(F7)

    # ── KITCiclo phase-specific routing ──────────────────────────────
    - patterns:
        - "verifica contrato"
        - "revisa contrato"
        - "actualiza contrato"
        - "contrato de"
        - "contrato del proyecto"
        - "crea contrato"
      workflow: kit-ciclo
      priority: 28
      entry_phase: f0  # Solo F0

    - patterns:
        - "prioriza"
        - "encuadre"
        - "que hago primero"
        - "orden de cambios"
        - "priorizar"
      workflow: kit-ciclo
      priority: 28
      entry_phase: f1  # Solo F1

    - patterns:
        - "valida"
        - "validar"
        - "verifica cambios"
        - "verificar"
        - "checa"
        - "revisa codigo"
      workflow: kit-ciclo
      priority: 28
      entry_phase: f3  # Solo F3

    - patterns:
        - "sincroniza"
        - "sincronizar"
        - "sync schema"
        - "migrar esquema"
        - "delta de esquema"
      workflow: kit-ciclo
      priority: 28
      entry_phase: f5  # Solo F5→F6

    - patterns:
        - "depura datos"
        - "depuracion"
        - "limpiar datos"
        - "compactar datos"
        - "datos huérfanos"
      workflow: kit-ciclo
      priority: 28
      entry_phase: f6  # Solo F6 (data cleanup)

    - patterns:
        - "color"
        - "color_tema"
        - "tema"
        - "theme"
        - "tipografía"
        - "typography"
        - "diseño visual"
        - "paleta"
        - "font"
        - "fuente"
        - "candado"
        - "pipe-delimited"
        - "hexColor"
        - "parse-theme"
        - "template ID"
        - "presets"
      workflow: feature
      priority: 15
      skills_override:
        - design-system

    - patterns:
        - "brief"
        - "brief de marketing"
        - "generar brief"
        - "crear brief"
        - "LAPVTFU"
        - "logo_url vector"
        - "20 campos"
        - "20 fields"
      workflow: brief-generation
      priority: 20

    - patterns:
        - "investigar"
        - "research"
        - "investigar mercado"
        - "investigar audiencia"
        - "competidores"
        - "tendencias"
        - "dolores del cliente"
        - "objeciones"
        - "avatar ideal"
        - "RLP"
      workflow: research
      priority: 15
      agent: copywriter
      skills_override:
        - brief-engine
        - web-research
        - multi-tenant

  overrides:
    - if:
        project: campanas-ai
        keyword: "trend"
      workflow: research
      priority: 100

    - if:
        workflow: feature
        project: campanas-ai
      agent: developer
      skills_override:
        - content-generation

    - if:
        project: suit-cotizador
      agent: cotizador
      skills_override:
        - cotizaciones-engine
        - pdf-generation

    - if:
        project: vire
      agent: developer
      skills_override:
        - remotion-video

    - if:
        project: suitreservaciones
      agent: developer
      skills_override:
        - reservations-engine
        - javascript

    - if:
        keyword: "vire"
        workflow: feature
      skills_override:
        - remotion-video

    - if:
        keyword: "video"
        project: campanas-ai
      workflow: video-generation
      priority: 80