routing:
  intents:
    - patterns:
        - "implement"
        - "add feature"
        - "create module"
        - "new functionality"
      workflow: feature
      priority: 10

    - patterns:
        - "fix"
        - "bug"
        - "error"
        - "crash"
        - "not working"
      workflow: bugfix
      priority: 20

    - patterns:
        - "audit"
        - "analyze"
        - "review architecture"
        - "diagnose"
      workflow: audit
      priority: 5

    - patterns:
        - "generate video"
        - "render video"
        - "remotion"
        - "vire"
        - "crear video"
        - "composición animada"
      workflow: video-generation
      priority: 50

    - patterns:
        - "deploy"
        - "release"
        - "publish"
      workflow: deploy
      priority: 30

    - patterns:
        - "document"
        - "docs"
        - "readme"
      workflow: docs
      priority: 5

    - patterns:
        - "migrate"
        - "migration"
        - "schema change"
      workflow: migration
      priority: 30

    - patterns:
        - "research"
        - "search"
        - "investigate"
        - "find"
      workflow: research
      priority: 5

    - patterns:
        - "review"
        - "validate"
        - "check"
        - "verify"
      workflow: review
      priority: 5

    - patterns:
        - "revisa"
        - "analiza seguridad"
        - "audita codigo"
        - "que opinas de"
        - "encuentra problemas en"
        - "reportero"
      workflow: review
      priority: 15
      agent: reportero
      skills_override:
        - code-review
        - security-audit

    - patterns:
        - "prueba"
        - "test"
        - "smoke test"
        - "verifica servidor"
        - "probador"
        - "ejecuta pruebas"
        - "corre tests"
      workflow: test
      priority: 15
      agent: probador
      skills_override:
        - system-analysis

    - patterns:
        - "cotizador"
        - "cotización"
        - "calculadora"
        - "proceso"
      workflow: cotizador
      priority: 15

    - patterns:
        - "reservacion"
        - "cita"
        - "agendar"
        - "appointment"
        - "schedule"
        - "whatsapp booking"
        - "lista de espera"
      workflow: reservacion
      priority: 15

    - patterns:
        - "evaluar proyecto"
        - "juzgar"
        - "panel de evaluación"
        - "aprobar modulo"
        - "aprobar módulo"
        - "viabilidad"
        - "nuevo proyecto"
        - "panel juzgador"
      workflow: panel-juzgador
      priority: 10

    - patterns:
        - "guia total"
        - "guia-total"
        - "tengo una idea"
        - "proyecto nuevo"
        - "vale la pena este proyecto"
        - "validar idea"
        - "crea los manuales"
        - "manual del cliente"
        - "manual del proveedor"
        - "manual técnico"
        - "manual de pruebas"
        - "actualiza manuales"
        - "identidad corporativa"
        - "misión y visión"
        - "valores e impacto"
        - "políticas de la empresa"
        - "taxonomía"
        - "industrias y nichos"
        - "prompt origen"
        - "manual de operación"
        - "manual operacion"
        - "cómo configuro empresas"
        - "como configuro empresas"
        - "operar empresas"
        - "brief incompleto"
        - "taxonomía del brief"
      workflow: guia-total
      skill: .agents/skills/guia-total/SKILL.md
      priority: 22

    - patterns:
        - "auditoría"
        - "auditoria"
        - "audita arquitectura"
        - "audita el sistema"
        - "documenta el sistema"
        - "diagrama c4"
        - "crea el c4"
        - "inventario del sistema"
        - "brechas de arquitectura"
        - "qué le falta al proyecto"
      workflow: auditoria
      skill: .agents/skills/auditoria/SKILL.md
      priority: 26

    - patterns:
        - "empresa-registro"
        - "alta de empresa"
        - "modifica empresa"
        - "actualiza empresa"
        - "edita empresa"
        - "registro id_empresa"
        - "crea estructura drive"
        - "llena config empresas"
        - "registro semiautomatico"
        - "nueva empresa en sheets"
        - "onboardear empresa"
      workflow: empresa-registro
      skill: .agents/skills/empresa-registro/SKILL.md
      priority: 24

    - patterns:
        - "clústeres seo"
        - "clusters seo"
        - "genera clústeres"
        - "9 clústeres"
        - "seo geo"
        - "aeo"
        - "páginas temáticas seo"
      workflow: clusters-seo
      skill: .agents/skills/clusters-seo/SKILL.md
      priority: 25

    - patterns:
        - "páginas seo"
        - "paginas seo"
        - "genera las páginas"
        - "config paginas"
        - "contenido de páginas"
        - "páginas del clúster"
        - "alimenta las páginas"
      workflow: paginas-seo
      skill: .agents/skills/paginas-seo/SKILL.md
      priority: 25

    - patterns:
        - "máscara"
        - "mascara"
        - "máscara empresa"
        - "mascara empresa"
        - "llenar máscara"
        - "llenar mascara"
        - "form empresa"
        - "nueva máscara"
        - "máscara auto"
        - "auto total"
      workflow: empresa-mascara
      skill: .agents/skills/empresa-mascara/SKILL.md
      priority: 26

    - patterns:
        - "prospeccion"
        - "prospectos"
        - "oportunidades comerciales"
        - "empresas potenciales"
        - "buscar clientes"
        - "leads comerciales"
        - "monterrey empresas"
        - "negocios monterrey"
      workflow: prospeccion
      priority: 10
      agent: developer
      skills_override:
        - prospeccion-ia-monterrey
        - google-places-business-finder

    - patterns:
        - "sync"
        - "sincronizar"
        - "schema"
        - "esquema"
        - "migrar datos"
      workflow: data-sync
      priority: 25

    - patterns:
        - "depura"
        - "depurar"
        - "limpiar datos"
        - "basura"
        - "filas huérfanas"
        - "duplicados"
      workflow: data-cleanup
      priority: 25

    - patterns:
        - "mejoras"
        - "cambios"
        - "mantenimiento"
        - "modificaciones"
        - "compactar"
        - "compactacion"
        - "depuracion"
        - "ciclo"
        - "ciclo de mantenimiento"
        - "fase"
        - "actualizar codigo"
        - "refactorizar"
        - "optimizar"
        - "limpiar codigo"
      workflow: ciclo
      skill: .agents/skills/ciclo/SKILL.md
      priority: 25
      entry_phase: full  # F0→F1→F2→F3→(F4)→(F5→F6)→(F7)

    # ── ciclo: phase-specific routing (skill única, ver .agents/skills/ciclo/) ──
    - patterns:
        - "verifica contrato"
        - "revisa contrato"
        - "actualiza contrato"
        - "contrato de"
        - "contrato del proyecto"
        - "crea contrato"
      workflow: ciclo
      skill: .agents/skills/ciclo/SKILL.md
      priority: 28
      entry_phase: f0  # Solo F0 (modo `contrato`)

    - patterns:
        - "prioriza"
        - "encuadre"
        - "que hago primero"
        - "orden de cambios"
        - "priorizar"
      workflow: ciclo
      skill: .agents/skills/ciclo/SKILL.md
      priority: 28
      entry_phase: f1  # Solo F1

    - patterns:
        - "valida"
        - "validar"
        - "verifica cambios"
        - "verificar"
        - "checa"
        - "revisa codigo"
      workflow: ciclo
      skill: .agents/skills/ciclo/SKILL.md
      priority: 28
      entry_phase: f3  # Solo F3

    - patterns:
        - "sincroniza"
        - "sincronizar"
        - "sync schema"
        - "migrar esquema"
        - "delta de esquema"
      workflow: ciclo
      skill: .agents/skills/ciclo/SKILL.md
      priority: 28
      entry_phase: f5  # Solo F5→F6

    - patterns:
        - "depura datos"
        - "depuracion"
        - "limpiar datos"
        - "compactar datos"
        - "datos huérfanos"
      workflow: ciclo
      skill: .agents/skills/ciclo/SKILL.md
      priority: 28
      entry_phase: f6  # Solo F6 (modo `depura`)

    - patterns:
        - "color"
        - "color_tema"
        - "tema"
        - "theme"
        - "tipografía"
        - "typography"
        - "diseño visual"
        - "paleta"
        - "font"
        - "fuente"
        - "candado"
        - "pipe-delimited"
        - "hexColor"
        - "parse-theme"
        - "template ID"
        - "presets"
      workflow: feature
      priority: 15
      skills_override:
        - design-system

    - patterns:
        - "brief"
        - "brief de marketing"
        - "generar brief"
        - "crear brief"
        - "LAPVTFU"
        - "logo_url vector"
        - "20 campos"
        - "20 fields"
      workflow: brief-generation
      priority: 20

    - patterns:
        - "investigar"
        - "research"
        - "investigar mercado"
        - "investigar audiencia"
        - "competidores"
        - "tendencias"
        - "dolores del cliente"
        - "objeciones"
        - "avatar ideal"
        - "RLP"
      workflow: research
      priority: 15
      agent: copywriter
      skills_override:
        - brief-engine
        - web-research
        - multi-tenant

  # ── Prompt pre-flight (siempre activo vía AGENTS.md overlay; gatillo explícito) ──
    - patterns:
        - "revisa mi prompt"
        - "optimiza este pedido"
        - "revisa mi contexto"
        - "sesgos"
        - "ingeniero de prompts"
        - "antes de ejecutar"
      workflow: review
      priority: 40
      agent: reviewer
      skills_override:
        - prompt-reviewer

  overrides:
    - if:
        project: campanas-ai
        keyword: "trend"
      workflow: research
      priority: 100

    - if:
        workflow: feature
        project: campanas-ai
      agent: developer
      skills_override:
        - content-generation

    - if:
        project: suit-cotizador
      agent: cotizador
      skills_override:
        - cotizaciones-engine
        - pdf-generation

    - if:
        project: vire
      agent: developer
      skills_override:
        - remotion-video

    - if:
        project: suitreservaciones
      agent: developer
      skills_override:
        - reservations-engine
        - javascript

    - if:
        keyword: "vire"
        workflow: feature
      skills_override:
        - remotion-video

    - if:
        keyword: "video"
        project: campanas-ai
      workflow: video-generation
      priority: 80

    - patterns:
        - "deploy gas"
        - "subir gas"
        - "push gas"
        - "clasp push"
        - "subir a gas"
        - "actualizar gas"
      workflow: deploy-gas
      priority: 30
      agent: deployer