      - "animated composition"
      - "programmatic video"
      - file_pattern: "SuitVidGenRemotion/**/*.tsx"
      - file_pattern: "SuitVidGenRemotion/**/*.ts"
    inputs:
      - "composition parameters"
      - "React components"
    outputs:
