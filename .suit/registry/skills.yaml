skills:
  system-analysis:
    description: "Analyze system architecture, identify patterns, detect issues"
    version: 1.0.0
    type: domain
    domain: system
    dependencies: []
    triggers:
      - "architecture review"
      - "system audit"
      - "technical debt analysis"
    inputs:
      - "source code files"
      - "architecture docs"
    outputs:
      - "architecture report"
      - "recommendations"
    discoverable: true
    context_hint:
      - "contexto.md"
      - "docs/contexto/arquitectura.md"

  multi-tenant:
    description: "Multi-tenant isolation rules and patterns"
    version: 1.0.0
    type: domain
    domain: security
    dependencies:
      - system-analysis
    triggers:
      - "data isolation"
      - "id_empresa"
      - "RBAC"
      - "giro_especifico"
    inputs: []
    outputs:
      - "isolation validation"
    discoverable: true
    context_hint:
      - "AGENTS.md"
      - "backend/core.js"
      - "backend/utils.js"

  javascript:
    description: "JavaScript/Node.js development"
    version: 1.0.0
    type: language
    domain: code
    dependencies: []
    triggers:
      - "js file"
      - "node"
      - "express"
    inputs:
      - "source files"
    outputs:
      - "modified files"
    discoverable: true
    context_hint:
