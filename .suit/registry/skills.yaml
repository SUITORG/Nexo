      - "clasp"
      - "google apps script"
    inputs:
      - "source files"
    outputs:
      - "modified files"
    discoverable: true
    context_hint:
      - "backend/"
      - "appsscript.json"

  code-review:
    description: "Code review according to project standards"
    version: 1.0.0
    type: process
    domain: quality
    dependencies:
      - javascript
    triggers:
      - "pull request"
      - "review request"
    inputs:
      - "diff"
      - "changed files"
    outputs:
      - "review comments"
    discoverable: true
    context_hint:
      - "AGENTS.md"
      - "contexto.md"

  security-audit:
    description: "Security audit for hardcoded keys, CSP, RBAC"
    version: 1.0.0
    type: process
    domain: security
    dependencies: []
    triggers:
      - "security review"
      - "vulnerability scan"
    inputs:
      - "source code"
      - "config files"
    outputs:
      - "security report"
    discoverable: true
    context_hint:
      - "server.js"
      - "backend/*.js"
      - ".env.example"

  sql:
    description: "SQL migrations and schema management"
    version: 1.0.0
    type: language
    domain: database
    dependencies: []
    triggers:
      - "migration"
      - "schema"
      - "supabase"
    inputs:
      - "migration files"
    outputs:
      - "SQL scripts"
    discoverable: true
    context_hint:
      - "Documentacion/migracion_datos.js"
      - "Documentacion/03-solucion-migracion.md"

  deployment:
    description: "Deployment procedures for GAS and GH Pages"
    version: 1.0.0
    type: process
    domain: operations
    dependencies:
      - javascript
    triggers:
      - "deploy"
      - "clasp"
      - "release"
    inputs: []
    outputs:
      - "deployment log"
    discoverable: true
    context_hint:
      - ".github/workflows/deploy.yml"

  preparar-produccion:
    description: "Clasifica archivos modificados/nuevos (git status) en Producción-Público, Producción-Módulos (js/modules/), Fuera del sitio y Riesgo (secretos), antes de un push a main. Escribe revision-produccion/REPORTE.md (local, gitignored). No hace git add/commit/push por sí sola — es un paso previo al workflow deploy, pensado para un usuario no-técnico."
    version: 1.0.0
    type: process
    domain: operations
    dependencies:
      - deployment
    triggers:
      - "subir a producción"
      - "preparar deploy"
      - "qué subo a producción"
      - "revisar antes de subir"
    inputs:
      - "git status --porcelain"
    outputs:
      - "revision-produccion/REPORTE.md"
    discoverable: true
    context_hint:
      - ".claude/skills/preparar-produccion/SKILL.md"
      - ".github/workflows/deploy.yml"

  cotizaciones-engine:
    description: "Motor de cálculo para cotizaciones configurables por proceso, producto o servicio. Evalúa reglas de precio, variables dinámicas, y produce una cotización con folio que puede convertirse en Lead, Proyecto u Orden."
    version: 1.0.0
    type: domain
    domain: sales
    dependencies:
      - javascript
      - multi-tenant
    triggers:
      - "cotizacion"
      - "cotización"
      - "quote"
      - "calcular"
      - "precio"
      - "proceso"
      - "regla_precio"
      - file_pattern: "SuitCotizador/**/*.js"
      - file_pattern: "js/modules/cotizador.js"
    inputs:
      - "proceso_id"
      - "variables_json"
      - "id_empresa"
    outputs:
      - "cotizacion_calculada"
      - "folio_cotizacion"
    discoverable: true
    context_hint:
      - "backend/core.js"
      - "backend/utils.js"
      - "backend/ai_engine.js"
      - "server.js"
      - "js/modules/cotizador.js"

  reservations-engine:
    description: "Motor de reservaciones vía WhatsApp + Google Calendar. Detecta intención con IA, agenda/reprograma/cancela citas, maneja lista de espera, y sincroniza con Google Calendar. Nivel 1 = solo WhatsApp, Nivel 2 = + Calendar."
    version: 1.0.0
    type: domain
    domain: service
    dependencies:
      - javascript
      - multi-tenant
    triggers:
      - "reservacion"
      - "cita"
      - "agendar"
      - "appointment"
      - "schedule"
      - "calendar"
      - "whatsapp booking"
      - file_pattern: "SuitReservaciones/**/*.js"
      - file_pattern: "citas/**/*.js"
    inputs:
      - "incoming WhatsApp message"
      - "empresa config"
    outputs:
      - "confirmed appointment"
      - "calendar event"
      - "waitlist entry"
    discoverable: true
    context_hint:
      - "SuitReservaciones/index.js"
      - "SuitReservaciones/handlers/webhook.js"
      - "SuitReservaciones/handlers/actions.js"
      - "SuitReservaciones/services/ai.js"
      - "SuitReservaciones/services/calendar.js"
      - "SuitReservaciones/db/schema.sql"

  remotion-video:
    description: "Generación de video profesional con Remotion. Crea composiciones animadas con React, renderiza MP4, integra audio, imágenes y transiciones."
    version: 1.0.0
    type: domain
    domain: media
    dependencies:
      - javascript
    triggers:
      - "video generation"
      - "remotion"
      - "animated composition"
      - "programmatic video"
      - file_pattern: "SuitVidGenRemotion/**/*.tsx"
      - file_pattern: "SuitVidGenRemotion/**/*.ts"
    inputs:
      - "composition parameters"
      - "React components"
    outputs:
      - "rendered video (MP4)"
      - "animated compositions"
    discoverable: true
    context_hint:
      - "SuitVidGenRemotion/src/"
      - "SuitVidGenRemotion/package.json"
      - "https://www.remotion.dev/docs"

  ponytail-ladder:
    description: "Forces the simplest, shortest solution that works. YAGNI ladder: skip → reuse → stdlib → native → dependency → one line → minimum viable."
    version: 1.0.0
    type: process
    domain: code
    dependencies:
      - javascript
    triggers:
      - "implement"
      - "add"
      - "create"
      - "write"
      - "refactor"
      - "fix"
      - "feature"
      - file_pattern: "**/*.js"
      - file_pattern: "**/*.html"
      - file_pattern: "**/*.css"
      - file_pattern: "**/*.ts"
    inputs:
      - "source files"
    outputs:
      - "minimal code"
    discoverable: true
    context_hint:
      - "AGENTS.md"

  comfy-ui:
    description: "Generación de imagen con ComfyUI y video profesional con FFmpeg, 100% local y gratis (SuitComfy, puerto 3012). Hardware: CPU-only (sin GPU NVIDIA), SD1.5 + LoRA LCM (steps 4-8, cfg 1.0-2.0, sampler lcm, sgm_uniform, máx 1024²). Video = Ken Burns (zoom in/out) + crossfade sobre stills → MP4 H.264 vertical u horizontal. NO soporta ControlNet/AnimateDiff/video-IA/audio (requieren GPU/VRAM no disponible). Imagen LCM 512² ≈ 1-2 min; 576×1024 ≈ 6 min; 5 escenas ≈ 30 min total."
    version: 1.2.0
    type: tool
    domain: media
    dependencies:
      - javascript
    triggers:
      - "image generation"
      - "stable diffusion"
      - "comfyui"
      - "ken burns"
      - "crossfade"
      - "reel"
      - "imagen a video"
      - file_pattern: "SuitComfy/services/*.js"
      - file_pattern: "SuitComfy/workflows/*.json"
    inputs:
      - "prompt"
      - "workflow JSON (ComfyUI API format)"
      - "escenas (prompt por escena, seed secuencial)"
      - "width/height/duration/transition/count"
    outputs:
      - "generated image (PNG)"
      - "generated video (MP4 H.264)"
    discoverable: true
    context_hint:
      - "SuitComfy/README.md"
      - "SuitComfy/AGENTS.md"
      - "http://127.0.0.1:8188"
    hardware:
      host: "HP Laptop 15-fc0xxx (AMD Ryzen 7 7730U 8C/16T, 2.0GHz; Radeon 680M integrada RDNA2 12CU — 0 GB VRAM dedicada, comparte RAM; 64 GB RAM; disco ~5.6 TB total: C: 1.9TB + D: 3.7TB)"
      gpu: "Ninguna con CUDA. ComfyUI corre con --cpu (PyTorch 2.11.0+cpu). La iGPU AMD no tiene VRAM propia ni CUDA — no sirve para modelos IA."
      verified_capabilities:
        - "Imagen SD1.5 + LoRA LCM (máx 1024²): 512² ≈ 1-2 min; 576×1024 ≈ 6 min"
        - "Video Ken Burns + crossfade (FFmpeg → MP4 H.264, 1080×1920): 5 escenas ≈ 30-32 min total"
        - "ControlNet: NO (necesita GPU NVIDIA 6-8GB VRAM)"
        - "AnimateDiff: NO (necesita GPU NVIDIA 8-12GB VRAM)"
        - "Video-IA real (WAN 2.x/LTX): NO (necesita 12-24GB VRAM + CUDA; cuantizado ≈ 12-16GB)"
        - "Audio IA (Stable Audio/audio-diffusion): NO (necesita ~8GB VRAM)"
      upgrade_path:
        - "GPU NVIDIA ≥12GB VRAM (RTX 3060 12GB o superior) — desbloquea ControlNet, AnimateDiff, audio; vía eGPU o desktop"
        - "Video-IA real: RTX 4080/4090 (24GB) o cloud por hora (RunPod/Vast, ~$0.30-0.50/h)"
      current_route: "Stills SD1.5+LCM + cinemática FFmpeg = ~80% del resultado visual por 0€. Reservar IA-movimiento solo cuando un proyecto lo justifique (coste/tiempo)."

  pdf-generation:
    description: "Genera PDFs de cotizaciones usando backend/DriveManager.js. Almacena en Google Drive por tenant, enlace guardado en la cotización."
    version: 1.0.0
    type: process
    domain: document
    dependencies:
      - javascript
      - multi-tenant
    triggers:
      - "pdf"
      - "imprimir"
      - "descargar cotizacion"
      - file_pattern: "backend/DriveManager.js"
    inputs:
      - "cotizacion_data"
      - "id_empresa"
    outputs:
      - "pdf_url"
      - "drive_file_id"
    discoverable: true
    context_hint:
      - "backend/DriveManager.js"

  landing-pages:
    description: "Generación estática de landing pages de conversión multi-tenant vía scripts/ssg-engine.mjs. Consume SuitLandings/landing-template.html (hero, propuesta de valor, oferta/CTA, contacto) y la activación por flag landing en la posición 8 de Config_Empresas.modo (0/ausente = solo sitio, 1 = landing-only, 2 = sitio + landing). Sin columnas nuevas: todo el contenido vive empacado en logo_url, etiquetas logo:/hero:/oferta:/cta: (ADR-023) + vector de Brief opcional (ADR-025/026: industria:/vendes:/audiencia:/PBP:/PM:/...), aislado del resto del SPA por un fix en js/modules/core.js:fixDriveUrl(). Regla de negocio (ADR-026): la landing debe contestar qué hace (vendes/PBP) y para quién sirve (audiencia) antes de que el visitante pregunte; el precio (PM) solo se muestra si el Brief lo trae explícito, nunca inventado — y el margen de PM jamás se expone en la landing. Toda landing es noindex/noarchive para no canibalizar el sitio principal."
    version: 1.0.0
    type: domain
    domain: marketing
    dependencies:
      - javascript
      - multi-tenant
    triggers:
      - "landing page"
      - "landing"
      - "modo landing"
      - "logo_url pipe"
      - "fixDriveUrl"
      - file_pattern: "SuitLandings/**/*.html"
      - file_pattern: "scripts/ssg-engine.mjs"
    inputs:
      - "empresa config (Config_Empresas)"
      - "flag landing en modo (pos 8)"
    outputs:
      - "{slug}.html (landing-only) / {slug}-landing.html (sitio + landing)"
    discoverable: true
    context_hint:
      - "scripts/ssg-engine.mjs"
      - "SuitLandings/landing-template.html"

  marketing-psicologia-progreso:
    description: "Efecto del progreso otorgado (endowed progress effect, Nunes & Drèze 2006): dar al usuario un adelanto de avance hacia una meta real (barra pre-llenada, \"ya llevas X de Y\", framing \"solo falta Z\") aumenta la motivación de completar mucho más que pedir el mismo esfuerzo restante desde cero. Aplicable siempre que haya una secuencia genuina hacia una meta (compra, cotización, plan de medios aprobado, suscripción): copy de CTA/oferta en piezas de BriefMarker, guiones de video (VIDE/ViRe/CreatorEngine), resúmenes de MediaPlanner, landing pages. Regla dura: nunca inventar pasos o progreso ficticio sin base real — es un principio de motivación, no un dark pattern; el progreso mostrado debe corresponder a avance real del usuario/lead."
    version: 1.0.0
    type: domain
    domain: marketing
    dependencies: []
    triggers:
      - "efecto del progreso"
      - "endowed progress"
      - "progreso otorgado"
      - "psicologia de marketing"
      - "copy de cta"
      - "mediaplanner"
      - "creatorengine"
      - file_pattern: "SuitCampanas/local-server-node.js"
    inputs:
      - "meta real del funnel (compra, cotización, suscripción, plan aprobado)"
      - "pasos ya completados por el usuario/lead, si existen"
    outputs:
      - "copy de CTA/oferta/guion con framing de progreso otorgado"
    discoverable: true
    context_hint:
      - "SuitCampanas/local-server-node.js (generateMediaPlan, approveMediaPlan, parseBrief)"
      - "Prompts_IA: CAMP-MEDIAPLANNER, CAMP-BRIEFMARKER"
      - ".suit/registry/skills.yaml: landing-pages"