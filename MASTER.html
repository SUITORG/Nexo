<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuitOS · Master</title>
<link rel="icon" href="data:,">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0e17;--bg2:#111827;--bg3:#1a2332;--text:#e2e8f0;--text2:#94a3b8;--accent:#6366f1;--accent2:#818cf8;--line:#243044}
html,body{height:100%}
body{display:flex;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
nav{width:210px;min-width:210px;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;gap:6px}
nav .brand{font-weight:800;font-size:15px;letter-spacing:.3px;padding:6px 10px 14px;color:var(--text)}
nav .brand span{color:var(--accent2)}
nav button{display:flex;align-items:center;gap:9px;width:100%;padding:10px 12px;border:0;border-radius:8px;background:transparent;color:var(--text2);font-size:13.5px;font-weight:600;cursor:pointer;text-align:left;font-family:inherit}
nav button:hover{background:var(--bg3);color:var(--text)}
nav button.active{background:var(--accent);color:#fff}
nav .foot{margin-top:auto;padding:8px 10px;font-size:11px;color:var(--text2);line-height:1.5}
main{flex:1;display:flex;flex-direction:column;min-width:0}
.bar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--bg2);border-bottom:1px solid var(--line);font-size:13px;color:var(--text2)}
.bar .title{font-weight:700;color:var(--text)}
.bar a{color:var(--accent2);text-decoration:none;font-weight:600}
.bar a:hover{text-decoration:underline}
.frame-wrap{flex:1;position:relative;background:#fff}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
</style>
</head>
<body>
<nav>
  <div class="brand">Suit<span>OS</span> · Master</div>
  <button data-src="SuitDashboard/index.html" data-name="SuitDashboard" class="active">📊 SuitDashboard</button>
  <button data-src="http://localhost:3001/SuitMarket/index.html" data-name="SuitMarket">📈 SuitMarket</button>
  <button data-src="SuitBoard/index.html" data-name="SuitBoard">💰 SuitBoard</button>
  <button data-src="GuiaTotal/MAPA_VISUAL.html" data-name="Mapa Visual">🗺️ Mapa Visual</button>
  <button data-src="SuitMiDBdic/dictionary.html" data-name="Diccionario EN↔ES">📖 Diccionario</button>
  <div class="foot">SuitMarket necesita el server raíz (<code>node server.js</code>, :3001) para mostrar datos. Si algo no se ve bien en el iframe, usa «↗ pestaña aparte».</div>
</nav>
<main>
  <div class="bar">
    <span class="title" id="title">SuitDashboard</span>
    <a id="ext" href="SuitDashboard/index.html" target="_blank" rel="noopener">↗ pestaña aparte</a>
  </div>
  <div class="frame-wrap"><iframe id="frame" src="SuitDashboard/index.html" title="herramienta"></iframe></div>
</main>
<script>
const frame=document.getElementById('frame'),title=document.getElementById('title'),ext=document.getElementById('ext');
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  title.textContent=b.dataset.name;
  ext.href=b.dataset.src;
  frame.src=b.dataset.src;
}));
</script>
</body>
</html>
