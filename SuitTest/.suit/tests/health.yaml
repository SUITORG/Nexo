suite:
  name: Health Checks
  description: "Verifica que el servidor de contactos responde"
  config:
    timeout: 10000
  servers:
    - name: contactos
      url: http://localhost:3020
  tests:
    - id: health-main
      description: "Servidor principal responde ok"
      request:
        path: /api/health
      expect:
        status: 200
        body_contains: "ok"

    - id: health-db
      description: "Archivo JSON accesible"
      request:
        path: /api/health/db
      expect:
        status: 200
        body_has_key: "status"
