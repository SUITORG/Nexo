<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Léxico · Diccionario EN→ES por temas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAFAF7; --ink:#1A1D29; --muted:#6B6E7B; --line:#E4E2DA;
  --hl:#FFE33D; --hl-soft:#FFF6BF; --teal:#0E7C7B; --teal-soft:#E4F1F0;
  --red:#C0392B; --card:#FFFFFF;
  --sans:'IBM Plex Sans',system-ui,sans-serif; --serif:'Gentium Book Plus',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
.ipa{font-family:var(--serif);color:var(--teal);font-size:.95em;white-space:nowrap}
.ipa.wrap{white-space:normal}
.spk{border:none;background:none;padding:1px 4px;cursor:pointer;font-size:13px;vertical-align:middle;line-height:1;border-radius:4px}
.spk:hover{background:var(--hl-soft)}
.spk:active{transform:scale(.9)}
.es{color:var(--muted);font-style:italic}
mark{background:linear-gradient(104deg,transparent .5%,var(--hl) 3%,var(--hl-soft) 96%,transparent 99%);padding:0 .25em;border-radius:2px}
/* ---------- layout ---------- */
header{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:2px solid var(--ink);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;font-weight:700;letter-spacing:-.02em}
header h1 span{font-family:var(--serif);font-weight:400;color:var(--teal)}
.search{display:flex;gap:6px;flex:1;min-width:220px;max-width:520px}
.search input{flex:1;border:1.5px solid var(--ink);background:var(--card);padding:7px 10px;border-radius:6px;font:inherit}
.search input:focus{outline:2px solid var(--hl);outline-offset:1px}
button{font:inherit;font-weight:600;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:6px;cursor:pointer}
button:hover{background:var(--hl-soft)}
button.primary{background:var(--ink);color:#fff}
button.primary:hover{background:#000}
button:disabled{opacity:.45;cursor:wait}
button:focus-visible,.chip:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
nav{position:sticky;top:var(--headerH,57px);z-index:25;background:var(--paper);border-bottom:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);padding:5px 11px;border-radius:99px;font-size:12.5px;font-weight:500;cursor:pointer}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
main{max-width:1080px;margin:0 auto;padding:18px 16px 120px}
section.topic{display:none}
section.topic.visible{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
h2{font-size:22px;margin:6px 0 4px;letter-spacing:-.02em}
h2 .n{font-family:var(--serif);color:var(--teal);font-weight:400;margin-right:6px}
h3{font-size:15px;margin:18px 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px}
/* mini clase fija */
.lesson{background:var(--teal-soft);border-left:4px solid var(--teal);border-radius:0 8px 8px 0;padding:10px 14px;margin:10px 0 16px;font-size:13.5px}
.lesson b{color:var(--teal)}
.rule{background:var(--hl-soft);border:1px dashed #d9c545;border-radius:8px;padding:8px 12px;margin:8px 0;font-size:13px}
.rule b{background:var(--hl);padding:0 4px;border-radius:3px}
.formula{font-family:var(--serif);background:var(--card);border:1.5px solid var(--ink);border-radius:6px;padding:2px 8px;display:inline-block;margin:2px 0;font-size:13.5px}
/* tablas */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--card);margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:var(--paper);text-align:left;padding:7px 10px;border-bottom:2px solid var(--ink);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
tr.freq td{background:var(--hl-soft)}
tr.freq td:first-child{box-shadow:inset 4px 0 0 var(--hl)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:1px 6px;border-radius:4px;background:var(--paper);border:1px solid var(--line);margin-right:3px}
.tag.v{background:#EAF3E6;border-color:#9CC08B}.tag.n{background:#EAF0FA;border-color:#9DB6E0}
.tag.adj{background:#FBEDE6;border-color:#E0AA8D}.tag.adv{background:#F5EAFA;border-color:#C99DE0}
.tag.prep{background:#FAF2E1;border-color:#DEC787}.tag.sep{background:var(--hl-soft);border-color:#d9c545}
/* tarjetas y grids */
.grid{display:grid;gap:10px;margin:10px 0}
.g2{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.card h4{font-size:14px;margin-bottom:4px}
/* widget de ejemplos 4 columnas */
.exwidget{background:var(--card);border:1.5px solid var(--ink);border-radius:10px;padding:12px;margin:14px 0}
.exhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.exhead select{font:inherit;padding:6px 8px;border:1.5px solid var(--ink);border-radius:6px;background:var(--paper)}
.excols{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.excol{padding:9px 11px;border-right:1px solid var(--line);background:var(--card)}
.excol:nth-child(4){background:var(--teal-soft)}
.excol:last-child{border-right:none;background:var(--hl-soft)}
.excol .lvl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:5px}
.excol:last-child .lvl{color:#8a7a00}
.excol .en{font-weight:600;font-size:13.5px}
.excol .ipa{display:block;white-space:normal;margin:3px 0;font-size:12.5px}
.excol .es{display:block;font-size:12.5px}
@media(max-width:820px){.excols{grid-template-columns:1fr 1fr}.excol{border-bottom:1px solid var(--line)}}
@media(max-width:520px){.excols{grid-template-columns:1fr}}
.status{font-size:12px;color:var(--muted);margin-left:auto}
/* IPA chart */
.ipagrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0}
.ipacell{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;text-align:center}
.ipacell .sym{font-family:var(--serif);font-size:22px;color:var(--teal)}
.ipacell .w{font-weight:600;font-size:13px}
.ipacell .hint{font-size:11.5px;color:var(--muted)}
/* quiz */
.quiz{background:var(--card);border:1.5px solid var(--ink);border-radius:10px;padding:12px;margin:12px 0}
.qopts{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.qopts button{font-family:var(--serif);font-size:16px}
.qfeed{font-size:13px;min-height:20px}
.qfeed.ok{color:#1e7d32;font-weight:600}.qfeed.bad{color:var(--red);font-weight:600}
/* noticias */
.newscat{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.newsitem{border-left:3px solid var(--teal);padding:8px 12px;background:var(--card);border-radius:0 8px 8px 0;margin:8px 0}
.newsitem .en{font-weight:600}
.newsitem .gloss{font-size:12px;margin-top:4px}
.newsitem .gloss b{background:var(--teal-soft);padding:0 4px;border-radius:3px;color:var(--teal)}
/* ticker inferior */
#ticker{position:fixed;bottom:0;left:0;right:0;background:var(--ink);color:#fff;z-index:40;border-top:3px solid var(--hl)}
#ticker .row{display:flex;align-items:center;gap:10px;padding:8px 14px;max-width:1080px;margin:0 auto}
#ticker .label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:var(--hl);color:var(--ink);padding:2px 6px;border-radius:3px;flex-shrink:0}
#tickbody{flex:1;overflow:hidden;min-height:38px}
.tick{animation:fade .4s ease}
.tick .en{font-weight:600}
.tick .ipa{color:#7ad0cf}
.tick .es{color:#b9bcc9}
#ticker button{border-color:#555;background:transparent;color:#fff;padding:4px 9px;font-size:12px;flex-shrink:0}
#ticker button:hover{background:#333}
/* lookup modal */
#lookup{position:fixed;inset:0;background:rgba(26,29,41,.5);display:none;z-index:50;padding:20px}
#lookup.open{display:flex;align-items:flex-start;justify-content:center}
#lookup .box{background:var(--paper);border-radius:12px;max-width:640px;width:100%;max-height:85vh;overflow-y:auto;padding:18px;border:2px solid var(--ink);margin-top:4vh}
.loading{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
footer.note{max-width:1080px;margin:30px auto 0;padding:0 16px;font-size:11.5px;color:var(--muted)}

/* ================= RESPONSIVE ================= */
@media(max-width:780px){
  header{padding:8px 12px;gap:8px}
  header h1{font-size:16px;flex-basis:100%}
  .search{min-width:0;max-width:none;flex-basis:100%}
  nav{top:0}
  main{padding:14px 12px 130px}
  h2{font-size:19px}
  .lesson,.rule{font-size:12.5px;padding:9px 11px}
  .card h4{font-size:13px}
  .ipagrid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
  .ipacell{padding:6px 8px}
  .ipacell .sym{font-size:19px}
  #ticker .row{padding:7px 10px;gap:7px}
  #ticker .label{display:none}
  .excol .en{font-size:13px}
  table{font-size:12px}
  th,td{padding:6px 8px}
}
@media(max-width:480px){
  header{position:static}
  nav{position:sticky;top:0}
  .search input,button,.chip{font-size:13px}
  button{padding:8px 11px}
  .chip{padding:7px 12px}
  h2{font-size:17px}
  h2 .n{display:block;font-size:13px;margin-bottom:2px}
  .qopts button{font-size:15px;padding:9px 14px;flex:1;min-width:100px}
  #lookup{padding:0}
  #lookup .box{max-width:100%;max-height:100vh;height:100%;border-radius:0;margin-top:0;border-width:0}
  .exhead{flex-direction:column;align-items:stretch}
  .exhead select,.exhead button{width:100%}
  .status{margin-left:0}
  .grid.g2,.grid.g3{grid-template-columns:1fr}
}
/* área táctil mínima en dispositivos táctiles */
@media(hover:none){
  button,.chip{min-height:38px}
  #tickbody{min-height:44px}
}
</style>
</head>
<body>

<header>
  <h1>Léxico <span>/ˈlɛk.sɪ.koʊ/</span></h1>
  <div class="search">
    <input id="lkin" type="text" placeholder="Busca cualquier palabra en inglés… (diccionario IA)" aria-label="Buscar palabra">
    <button class="primary" onclick="lookupWord()">Buscar</button>
  </div>
</header>

<nav id="nav" aria-label="Temas"></nav>
<main id="main"></main>

<div id="lookup" onclick="if(event.target===this)this.classList.remove('open')">
  <div class="box" id="lkbox"></div>
</div>

<div id="ticker">
  <div class="row">
    <span class="label">Frase al azar</span>
    <div id="tickbody"><span class="es">Cargando…</span></div>
    <button onclick="nextTick()" title="Siguiente">▶</button>
    <button onclick="regenTicks(this)" title="Generar nuevas frases con IA">↻ IA</button>
  </div>
</div>

<footer class="note">Los datos base son locales. Los botones «Reformar», «↻ IA», búsqueda y noticias usan el modelo Claude como diccionario externo dinámico (requiere conexión). El IPA mostrado es inglés americano general.</footer>

<script>
/* ================= API (diccionario externo dinámico) ================= */
async function callClaude(prompt, useSearch=false){

   a:{en:"I have example.",ipa:"/aɪ hæv ɪɡˈzæmpəl/",es:"Tengo un ejemplo."},
   b:{en:"She has been working with example since 2020.",ipa:"/ʃi hæz bɪn ˈwɜrkɪŋ/",es:"Ha trabajado con ejemplo desde 2020."},
   c:{en:"Had I known about example, I would have acted differently.",ipa:"/hæd aɪ noʊn/",es:"Si hubiera sabido sobre ejemplo, habría actuado diferente."},
   p:{en:"We need to figure out the example.",ipa:"/fɪɡjər aʊt/",es:"Necesitamos averiguar el ejemplo.",note:"figure out = averiguar"},
   n:{en:"I kinda love this example, gotta say.",ipa:"/ˈkaɪndə/",es:"Como que me encanta este ejemplo.",note:"kinda = coloquial"}
  }));
}
function parseJSON(t){try{return JSON.parse(t.replace(/```json|```/g,"").trim())}catch(e){const m=t.match(/[\[{][\s\S]*[\]}]/);if(m){try{return JSON.parse(m[0])}catch(_){}}return null}}
const JSONRULES='Responde SOLO con JSON válido, sin markdown, sin texto extra. IPA en inglés americano.';

<script>
/* ================= DATOS BASE ================= */
const D={};

D.tenses=[
 {t:"Present Simple",f:"S + V(base) / V+s",ex:"She works here.",ipa:"/ʃi wɜrks hɪr/",es:"Ella trabaja aquí.",use:"Hábitos, hechos, rutinas",freq:1},
 {t:"Present Continuous",f:"S + am/is/are + V-ing",ex:"I am reading now.",ipa:"/aɪ æm ˈriːdɪŋ naʊ/",es:"Estoy leyendo ahora.",use:"Acción en progreso; planes cercanos",freq:1},
 {t:"Present Perfect",f:"S + have/has + V3",ex:"We have finished.",ipa:"/wi hæv ˈfɪnɪʃt/",es:"Hemos terminado.",use:"Pasado con relevancia presente",freq:1},

 {t:"Past Simple",f:"S + V2 (V-ed)",ex:"They arrived late.",ipa:"/ðeɪ əˈraɪvd leɪt/",es:"Llegaron tarde.",use:"Acción terminada en el pasado",freq:1},

 {t:"Past Perfect",f:"S + had + V3",ex:"She had left before noon.",ipa:"/ʃi hæd lɛft bɪˈfɔr nun/",es:"Ella se había ido antes del mediodía.",use:"Pasado anterior a otro pasado",freq:0},
 {t:"Past Perfect Continuous",f:"S + had been + V-ing",ex:"I had been studying for hours.",ipa:"/aɪ hæd bɪn ˈstʌdiɪŋ fɔr ˈaʊərz/",es:"Había estado estudiando por horas.",use:"Duración antes de un punto pasado",freq:0},
 {t:"Future Simple",f:"S + will + V(base)",ex:"I will call you.",ipa:"/aɪ wɪl kɔl ju/",es:"Te llamaré.",use:"Decisiones, promesas, predicciones",freq:1},
 {t:"Future Continuous",f:"S + will be + V-ing",ex:"We will be flying at 8.",ipa:"/wi wɪl bi ˈflaɪɪŋ æt eɪt/",es:"Estaremos volando a las 8.",use:"Acción en progreso en el futuro",freq:0},
 {t:"Future Perfect",f:"S + will have + V3",ex:"By May, I will have graduated.",ipa:"/baɪ meɪ aɪ wɪl hæv ˈɡrædʒueɪtəd/",es:"Para mayo, me habré graduado.",use:"Acción completada antes de un punto futuro",freq:0},
 {t:"Future Perfect Continuous",f:"S + will have been + V-ing",ex:"She will have been teaching 10 years.",ipa:"/ʃi wɪl hæv bɪn ˈtiːtʃɪŋ tɛn jɪrz/",es:"Habrá estado enseñando 10 años.",use:"Duración hasta un punto futuro",freq:0},
 {t:"Future: BE going to",f:"S + am/is/are + going to + V(base)",ex:"I'm going to call her.",ipa:"/aɪm ˈɡoʊɪŋ tə kɔl hɜr/",es:"Voy a llamarla.",use:"Planes ya decididos; predicciones con evidencia visible ahora",freq:1}
];
D.goingToNote="'Going to' NO es un verbo auxiliar por sí solo — el auxiliar real es <b>be</b> (am/is/are); 'going to' es la estructura fija que sigue. Se usa para planes ya decididos ('I'm going to study medicine') o predicciones con evidencia presente ('Look at those clouds, it's going to rain'), a diferencia de 'will', que es más para decisiones espontáneas o promesas.";

D.verbTypes=[
 {t:"Regulares",r:"Pasado y participio con <b>-ed</b>",f:"work → worked → worked",ex:"play, want, live, ask, need, help, watch, clean, cook, finish"},

 {t:"De acción (dynamic)",r:"Admiten todas las formas",f:"run → running",ex:"run, build, write, cook, play, drive, sing, dance, travel"},
 {t:"Transitivos",r:"Requieren objeto directo",f:"S + V + objeto",ex:"She bought <u>a car</u>. · He loves <u>her</u>. · They ate <u>the cake</u>."},
 {t:"Intransitivos",r:"No llevan objeto",f:"S + V",ex:"He sleeps. · The baby cried. · She arrived. · Birds fly."},
 {t:"Copulativos (linking)",r:"Unen sujeto con atributo",f:"S + V + adjetivo/sustantivo",ex:"seem, become, feel, look, taste, smell, sound, appear, turn"}
];
D.stativeSub=[
 ["Emoción / deseo","love, hate, want, prefer, need, wish, hope","She loves classical music.","Ella ama la música clásica."],
 ["Cognición / entendimiento","know, believe, understand, think, remember, forget, mean, suppose","I understand the problem.","Entiendo el problema."],
 ["Percepción","see, hear, smell, taste, feel (percepción, no emoción)","I see a bird in the tree.","Veo un pájaro en el árbol."],
 ["Posesión","have, own, belong, possess","This car belongs to my father.","Este carro le pertenece a mi padre."]
];
D.stativeNote="Los verbos de estado (stative) casi nunca van en tiempo continuo porque describen algo constante, no una acción en progreso: ✗ 'I am knowing the answer' → ✓ 'I know the answer'. Se dividen en 4 grupos según qué tipo de estado describen.";
D.verbRules=[

 "Pronunciación de <b>-ed</b>: /t/ tras sonido sordo (worked /wɜrkt/) · /d/ tras sonoro (played /pleɪd/) · /ɪd/ tras t,d (wanted /ˈwɑntɪd/).",
 "Tercera persona <b>-s</b>: +es tras s,sh,ch,x,o (watches, goes) · consonante+y → -ies (studies) · /s/, /z/ o /ɪz/ según el sonido final."
];

D.phrasal=[
 /* Movimiento y viajes */
 {v:"take off",ipa:"/teɪk ɔf/",es:"despegar; quitarse (ropa)",sep:1,ex:"The plane took off late.",cat:"Movimiento y viajes"},
 {v:"show up",ipa:"/ʃoʊ ʌp/",es:"aparecer, presentarse",sep:0,ex:"He never showed up.",cat:"Movimiento y viajes"},

 {v:"head back",ipa:"/hɛd bæk/",es:"regresar, volver",sep:0,ex:"It's getting late, let's head back.",cat:"Movimiento y viajes"},
 /* Comunicación e información */
 {v:"find out",ipa:"/faɪnd aʊt/",es:"descubrir, averiguar",sep:1,ex:"I found out the truth.",cat:"Comunicación e información"},
 {v:"point out",ipa:"/pɔɪnt aʊt/",es:"señalar, hacer notar",sep:1,ex:"He pointed out an error.",cat:"Comunicación e información"},

D.phrasalParticles=[{"particle": "OUT", "ipa": "/aʊt/", "nuclear": "Movimiento desde dentro hacia fuera. Es la partícula de exteriorización.", "meanings": [{"title": "1. Salida física", "idea": "Mover algo o alguien hacia el exterior de un lugar cerrado.", "frequency": "muy frecuente", "pattern": "OUT = salir del contenedor. Si ves GO/GET/COME + OUT, casi siempre es salir físicamente. Útil para deducir: si no conoces el verbo, piensa 'hacia fuera'.", "warning": "Get out puede ser imperativo rudo: 'Get out!' = ¡Fuera! / ¡Lárgate! Depende del tono.", "verbs": ["go out - salir (persona)", "walk out - salir caminando", "get out - salir (a veces con esfuerzo)", "come out - salir (hacia donde estoy)", "run out - salir corriendo", "move out - mudarse fuera", "check out - dejar hotel / revisar y salir", "eat out - comer fuera", "hang out - pasar el rato fuera", "stay out - quedarse fuera / no volver"], "examples": [{"en": "I'm going out tonight with friends.", "es": "Voy a salir esta noche con amigos.", "ctx": "vida diaria"}, {"en": "She walked out of the meeting angrily.", "es": "Salió de la reunión enojada, caminando.", "ctx": "trabajo"}, {"en": "Get out of the car, please.", "es": "Sal del coche, por favor.", "ctx": "viajes"}, {"en": "Come out here, I need to show you something.", "es": "Sal aquí, necesito mostrarte algo.", "ctx": "familia"}, {"en": "We need to move out by the end of the month.", "es": "Tenemos que mudarnos antes de fin de mes.", "ctx": "vivienda"}, {"en": "Let's eat out this weekend.", "es": "Comamos fuera este finde.", "ctx": "compras / vida"}, {"en": "They usually hang out at the mall.", "es": "Normalmente pasan el rato en el centro comercial.", "ctx": "estudios / jóvenes"}, {"en": "Don't stay out too late.", "es": "No te quedes fuera hasta tarde.", "ctx": "familia"}, {"en": "We checked out at 11 AM.", "es": "Hicimos check-out a las 11.", "ctx": "viajes / hotel"}, {"en": "The kids ran out to the garden.", "es": "Los niños salieron corriendo al jardín.", "ctx": "familia"}]}, {"title": "2. Descubrimiento / Hacer visible", "idea": "Algo oculto se vuelve visible, conocido o audible.", "frequency": "muy frecuente", "pattern": "OUT = de oculto a visible. FIND OUT, FIGURE OUT, POINT OUT comparten idea de 'sacar a la luz'.", "warning": "Find out vs figure out: find out = te enteras (información nueva), figure out = logras entender/resolver.", "verbs": ["find out - enterarse / descubrir", "figure out - entender / resolver", "point out - señalar", "work out - entender (UK) / resultar", "make out - distinguir / entender con dificultad", "come out - revelarse / publicarse / salir del clóset", "turn out - resultar", "check out - revisar / investigar", "watch out - tener cuidado (mirar hacia fuera)"], "examples": [{"en": "I found out the truth yesterday.", "es": "Me enteré de la verdad ayer.", "ctx": "conversación"}, {"en": "Can you figure out how this app works?", "es": "¿Puedes averiguar cómo funciona esta app?", "ctx": "tecnología"}, {"en": "She pointed out my mistake politely.", "es": "Señaló mi error con educación.", "ctx": "trabajo"}, {"en": "I couldn't make out what he was saying.", "es": "No podía distinguir qué decía.", "ctx": "conversación"}, {"en": "It turned out to be a great idea.", "es": "Resultó ser una gran idea.", "ctx": "trabajo"}, {"en": "The new iPhone came out last week.", "es": "El nuevo iPhone salió la semana pasada.", "ctx": "tecnología / compras"}, {"en": "Everything will work out in the end.", "es": "Todo saldrá bien al final.", "ctx": "vida diaria"}, {"en": "You should check out that new restaurant.", "es": "Deberías probar ese restaurante nuevo.", "ctx": "compras / vida"}, {"en": "Watch out! The floor is wet.", "es": "¡Cuidado! El suelo está mojado.", "ctx": "familia / seguridad"}, {"en": "He came out as gay to his family.", "es": "Salió del clóset con su familia.", "ctx": "conversación / vida"}]}, {"title": "3. Agotamiento / Consumo total", "idea": "Algo se consume completamente hasta que no queda dos.", "verbs": ["fill out - rellenar (formulario)", "carry out - llevar a cabo", "sort out - resolver / organizar", "work out - resolver / calcular", "figure out - resolver", "check out - pagar y salir / completar compra", "write out - escribir completo"], "examples": [{"en": "Please fill out this form.", "es": "Por favor rellena este formulario.", "ctx": "trabajo / viajes"}, {"en": "The company carried out a survey.", "es": "La empresa llevó a cabo una encuesta.", "ctx": "trabajo"}, {"en": "We need to sort out the Wi-Fi problem.", "es": "Necesitamos resolver el problema del Wi-Fi.", "ctx": "tecnología / familia"}, {"en": "I worked out the total cost.", "es": "Calculé el coste total.", "ctx": "compras / trabajo"}, {"en": "Did you check out already?", "es": "¿Ya hiciste el check-out / pagaste?", "ctx": "viajes / compras"}, {"en": "She wrote out the instructions clearly.", "es": "Escribió las instrucciones completas y claras.", "ctx": "estudios / trabajo"}, {"en": "The team carried out the plan perfectly.", "es": "El equipo ejecutó el plan perfecto.", "ctx": "trabajo"}, {"en": "Let's sort out who does what.", "es": "Organicemos quién hace qué.", "ctx": "trabajo / familia"}, {"en": "I need to fill out my tax return.", "es": "Necesito rellenar mi declaración de impuestos.", "ctx": "trabajo / vida"}, {"en": "We finally sorted out the visa issues.", "es": "Finalmente resolvimos lo de la visa.", "ctx": "viajes"}]}]}, {"particle": "UP", "ipa": "/ʌp/", "nuclear": "Movimiento hacia arriba, aumento, y completitud. Es la partícula más productiva.", "meanings": [{"title": "1. Movimiento hacia arriba / Levantar", "idea": "Subir físicamente o levantar algo.", "frequency": "muy frecuente", "pattern": "UP = hacia arriba. Casi literal. Si no sabes el verbo, piensa en subir.", "warning": "Stand up vs get up: stand up = ponerse de pie desde sentado, get up = levantarse de la cama.", "verbs": ["get up - levantarse", "stand up - ponerse de pie", "wake up - despertarse", "pick up - recoger / levantar", "lift up - levantar", "climb up - subir escalando", "go up - subir (precio, etc)", "come up - acercarse subiendo"], "examples": [{"en": "I get up at 6 AM every day.", "es": "Me levanto a las 6 cada día.", "ctx": "vida diaria"}, {"en": "Please stand up when the teacher enters.", "es": "Pónganse de pie cuando entre el profe.", "ctx": "estudios"}, {"en": "Pick up that trash.", "es": "Recoge esa basura.", "ctx": "familia"}, {"en": "House prices are going up.", "es": "Los precios de casas están subiendo.", "ctx": "compras / vida"}, {"en": "He climbed up the ladder.", "es": "Subió por la escalera de mano.", "ctx": "trabajo"}, {"en": "Can you lift this box up?", "es": "¿Puedes levantar esta caja?", "ctx": "familia"}, {"en": "She came up to me and said hi.", "es": "Se me acercó y me saludó.", "ctx": "conversación"}, {"en": "Wake up! We're late.", "es": "¡Despierta! Vamos tarde.", "ctx": "familia"}, {"en": "The sun came up at 6:30.", "es": "El sol salió a las 6:30.", "ctx": "vida diaria"}, {"en": "Pull up a chair.", "es": "Acércate una silla.", "ctx": "conversación / familia"}]}, {"title": "2. Aumento / Intensificación", "idea": "Incrementar en cantidad, volumen, intensidad o calidad.", "frequency": "muy frecuente", "pattern": "UP = más. SPEED UP, TURN UP, BRING UP = aumentar.", "warning": "Turn up puede ser subir volumen o aparecer (he didn't turn up = no apareció). Contexto clave.", "verbs": ["speed up - acelerar", "turn up - subir volumen / aparecer", "bring up - sacar tema / criar", "go up - subir", "heat up - calentar", "grow up - crecer (persona)", "dress up - arreglarse elegante", "make up - inventar / maquillarse"], "examples": [{"en": "Can you turn up the music?", "es": "¿Puedes subir la música?", "ctx": "vida diaria / tecnología"}, {"en": "The company is speeding up production.", "es": "La empresa está acelerando producción.", "ctx": "trabajo"}, {"en": "She brought up an interesting point.", "es": "Sacó a colación un punto interesante.", "ctx": "tra D.consVoice="Sonoras (las cuerdas vocales vibran): b, d, ɡ, v, ð, z, ʒ, dʒ, m, n, ŋ, l, r, j, w — todas las nasales/líquidas/glides son sonoras. Sordas (sin vibración): p, t, k, f, θ, s, ʃ, tʃ, h. Truco para sentirlo: toca tu garganta al decir 'z' (vibra) vs 's' (no vibra) — son el mismo punto y modo, solo cambia la sonoridad.";

D.schwaPrefixNote="Regla: cuando un prefijo o primera sílaba de una palabra NO lleva el acento tónico, su vocal casi siempre se reduce a <b>schwa /ə/</b> — sin importar qué letra esté escrita. Por eso 'con-' en 'confuse' se oye como /kən/ y no como 'con' en español. Esta es la razón #1 por la que leer inglés 'como se escribe' suena forzado.";

D.clusters=[
 ["/nθ/","month, tenth, ninth, synth","La N y la TH se pronuncian casi simultáneas — la lengua no se mueve mucho entre ambas."],
 ["/mʌnθs/ (plural con -s)","months, tenths","Al plural se le suma otra fricativa: /nθs/, tres consonantes seguidas — muy difícil de replicar viniendo del español."],
 ["/str/","street, strong, straight","La 'tr' inicial ya suena como 'ch' (sección 19), y se le agrega la 's' antes."],
 ["/skr/","script, scream, scratch","Tres consonantes antes de la vocal; en español no existe este inicio."],
 ["/spl/","splash, split, splendid","Igual que arriba, pero con 'l'."],
 ["/kst/","next, text, context","Aparece en medio o al final de palabra; se suele simplificar en habla rápida."],
 ["/mpt/","attempt, prompt, empty","La 'p' casi no se oye, es una consonante de transición."],
 ["/ŋks/","thanks, banks, drinks","La 'n' se convierte en el sonido de 'ng' antes de 'k'."]
];
D.clustersNote="Estas combinaciones se llaman <b>consonant clusters</b> (racimos consonánticos). El español casi no permite tantas consonantes seguidas sin vocal entre ellas, por eso la tendencia natural es meter una vocal donde no va (✗ 'esprint' en vez de 'sprint') o suavizar el final de la palabra. Practicarlas sueltas, sin prisa, ayuda más que repetir la palabra completa muchas veces.";

D.glottalTNote="Cuando una <b>t</b> queda entre una vocal acentuada y una sílaba que se reduce a una <b>n silábica</b> (sin vocal propia, la n sola hace de vocal), el inglés americano no pronuncia la t con la lengua — la reemplaza por un <b>golpe de glotis</b> (glottal stop /ʔ/): un corte breve del aire en la garganta, como el sonido que haces entre las dos sílabas de 'oh-oh'. Esto es DISTINTO de la flat T de la sección 19 (water, better), que sí es un golpecito con la lengua — aquí la lengua ni se mueve.";

/* 19 · Habla conectada (Connected Speech) */
D.connected=[
 {n:"Content words vs. Function words (por qué unas palabras se reducen y otras no)",ipa:"—",r:"Esta es la regla MADRE de toda la sección: las <b>content words</b> (sustantivos, verbos principales, adjetivos, adverbios — las que cargan el significado) casi nunca se reducen ni pierden sonidos. Las <b>function words</b> (artículos, preposiciones, pronombres, auxiliares: a, the, to, of, him, have, does, is...) sí se reducen, casi siempre a schwa o desaparecen — son 'pegamento' gramatical, no información nueva. Todas las reglas de abajo (flapping, h-dropping, elisión...) le pasan casi siempre a function words, casi nunca a content words.",ex:[["I WANT the BOOK","/aɪ wɑnt ðə bʊk/","quiero el libro — 'want' y 'book' (content) suenan completas y claras; 'the' (function) se reduce a schwa apenas audible"]]},
 {n:"Flapping / Alveolar Tap (la \"flat T\" — y también la D)",ipa:"/ɾ/",r:"En inglés americano, tanto la <b>T</b> como la <b>D</b> entre dos vocales (o entre vocal y R) suenan igual: como una D rápida, casi como la 'r' suave del español (pero, cara). Por eso 'did I' y 'city' usan el MISMO sonido aunque una tenga D y la otra T en la ortografía.",ex:[["water","/ˈwɔɾər/","agua (T suena como 'd/r' rápida)"],["better","/ˈbɛɾər/","mejor"],["city","/ˈsɪɾi/","ciudad"],["a lot of","/ə ˈlɑɾ əv/","mucho de"],["did I","/ˈdɪɾaɪ/","(la D de 'did' flapea igual que una T) — suena 'ríai'"],["already did it","/ɔlˈrɛɾi ˈɾɪɾ ɪt/","ya lo hice — dos flaps seguidos, suena 'ardy ríri' o 'ardy did it' según velocidad"]]},
 {n:"Yod-coalescence (D + Y → /dʒ/)",ipa:"/dʒ/",r:"Cuando una palabra termina en <b>d</b> y la siguiente empieza con <b>you/your</b>, se fusionan en el sonido 'y' de 'llegar' fuerte, igual que el de 'jump'.",ex:[["Would you","/wʊdʒə/","¿Podrías...?"],["Did you","/dɪdʒə/","¿Hiciste...?"],["Could you","/kʊdʒə/","¿Podrías...?"]]},
 {n:"Yod-coalescence (T + Y → /tʃ/)",ipa:"/tʃ/",r:"Mismo fenómeno que arriba pero con <b>t</b>: t + you = sonido 'ch' de 'chair'.",ex:[["Don't you","/doʊntʃə/","¿No... verdad?"],["Won't you","/woʊntʃə/","¿No querrás...?"],["Can't you","/kæntʃə/","¿No puedes...?"]]},
 {n:"Affrication de TR/DR (TR≈CH, DR≈J)",ipa:"/tʃr/ /dʒr/",r:"El grupo <b>tr</b> al inicio de palabra suena parecido a 'ch' + r, y <b>dr</b> suena parecido a 'j' (inglesa) + r. Es automático, no un error.",ex:[["train","/tʃreɪn/","tren (suena 'chrein')"],["truck","/tʃrʌk/","camión"],["dragon","/dʒræɡən/","dragón (suena 'jragon')"],["drive","/dʒraɪv/","conducir"]]},
 {n:"Linking (enlace consonante+vocal)",ipa:"‿",r:"Si una palabra termina en consonante y la siguiente empieza en vocal, se pronuncian como una sola palabra.",ex:[["turn it off","/ˈtɜr nɪ ˈɾɔf/","apagarlo (fluye como una palabra)"],["an apple","/ə ˈnæpəl/","una manzana"]]},
 {n:"Elision (caída de /t/ /d/ /k/ en racimos)",ipa:"∅",r:"Cualquier consonante oclusiva (t, d, k, p...) que quede EN MEDIO de tres o más consonantes seguidas tiende a desaparecer al hablar rápido — no solo t/d, también <b>k</b>.",ex:[["next day","/ˈnɛks deɪ/","al día siguiente (la 't' de next casi no suena)"],["most people","/ˈmoʊs ˈpipəl/","la mayoría de la gente"],["asked","/æst/","preguntó/pregunté — la 'k' entre s y t desaparece: /æskt/ → /æst/"]]},
 {n:"Cadena completa: elisión + yod-coalescence juntas",ipa:"/tʃ/",r:"Las reglas de esta sección se combinan entre sí. 'Asked you' pasa por DOS pasos: primero la <b>k</b> desaparece (elision, arriba: askt→ast), y luego la t+y restante se funde en /tʃ/ (yod-coalescence, ya visto arriba). El resultado final no se parece nada a la ortografía.",ex:[["asked you","/æstʃu/","te pregunté — 'asked' /æskt/ → 'ast' /æst/ → fusión con 'you' → /æstʃu/ (informalmente 'aschu')"]]},
 {n:"TH-deletion en palabras átonas (that, them, there)",ipa:"∅",r:"Cuando 'that/them/there' NO llevan el acento de la frase (van 'de paso', no son la palabra importante), la <b>/ð/</b> inicial puede desaparecer por completo en habla muy rápida — sobre todo pegada a otra consonante.",ex:[["does that","/dʌz æt/","¿eso...? — 'that' pierde su 'th' y suena 'at'"],["how does that work","/haʊ dəz æt wɜrk/","¿cómo funciona eso? — suena como 'how dz at work'"],["get them","/ɡɛt əm/","consíguelos — 'them' se reduce a 'em', sin th"]]},
 {n:"Elisión de D antes de T (supposed to → supposta)",ipa:"∅",r:"Cuando una palabra termina en <b>-sed/-zed</b> y la siguiente empieza en <b>t</b>, la D intermedia desaparece y las dos palabras casi se funden en una.",ex:[["supposed to","/səˈpoʊstə/","se supone que debo — suena 'supposta', muy común en habla rápida"],["used to","/ˈjustə/","solía — mismo patrón (ver también sección 30, trío 'used to')"]]},
 {n:"H-dropping (caída de la H átona)",ipa:"∅",r:"Los pronombres y auxiliares átonos <b>her, him, his, have, has, had, he</b> pierden la <b>/h/</b> en habla rápida cuando van DESPUÉS de otra palabra (no al inicio de la oración). No es una contracción escrita, es solo pronunciación relajada. 'Who' es un caso aparte: NUNCA pronuncia su H, en cualquier registro — no es h-dropping casual, es regla fija (ver también letras mudas, sección 18).",ex:[["let her know","/lɛt ər noʊ/","avísale (a ella) — suena 'let 'er know'"],["tell him","/tɛl ɪm/","dile (a él) — suena 'tell 'im'"],["ask her","/æsk ər/","pregúntale (a ella)"],["I should have gone","/aɪ ʃʊd əv ɡɔn/","debí haber ido — 'have' pierde la H y suena como 'of'"],["what has he done","/wʌt əz i dʌn/","qué ha hecho — 'has' y 'he' pierden la H: suena 'wədəzi dʌn'"],["what happened","/ˈwʌʔn̩t/","qué pasó — en habla muy rápida hasta 'happened' puede perder rastro de H tras la W"]]},
 {n:"G-dropping (-ing → -in', /ŋ/ → /n/)",ipa:"/n/",r:"La terminación <b>-ing</b> en habla informal cambia su sonido final de /ŋ/ (nasal velar, 'ng') a /n/ (nasal alveolar, como en español). Se escribe a veces 'waitin', doin', goin'' para representarlo. Es una de las señales más claras de habla casual/informal en inglés americano.",ex:[["waiting","/ˈweɪtɪn/","esperando — suena 'waitin''"],["doing","/ˈduɪn/","haciendo — suena 'doin''"],["snapping","/ˈsnæpɪn/","tronando — suena 'snappin''"]]},
 {n:"I'm gonna → I'ma (doble reducción)",ipa:"/aɪmə/",r:"'Gonna' (ya visto arriba) a veces se reduce TODAVÍA MÁS en habla muy casual/canciones/rap: 'I'm gonna' completo se funde en 'I'ma', perdiendo casi toda huella de 'going to'.",ex:[["I'm gonna start","/aɪmə stɑrt/","voy a empezar — 'I'm gonna' → 'I'ma', muy común en letras de canciones"]]},
 {n:"Cadena larga: varias reglas encimadas en una frase real",ipa:"—",r:"Así se ve cuando 4-5 reglas de esta sección actúan JUNTAS en una sola frase — esto es lo que hace que el inglés hablado real suene tan distinto del escrito.",ex:[["what does it have to do with...","/wə dəz ɪɾ æv tə du wɪð/","¿qué tiene que ver eso con...? — 'does' se reduce (function word), 'it' flapea con lo siguiente, 'have' pierde la H (h-dropping)"],["gives it away","/ˈɡɪvz ɪɾ əˈweɪ/","lo delata — 'it' flapea entre 'gives' y 'away' (flapping + linking)"]]},
 {n:"Glide de enlace /w/ o /j/ (entre dos vocales)",ipa:"/w/ /j/",r:"Cuando una palabra termina en vocal y la siguiente empieza en vocal, el inglés inserta un sonido de transición casi imperceptible: <b>/w/</b> si la primera vocal es redondeada (u, o), <b>/j/</b> (como 'y') si es i/e.",ex:[["go on","/ɡoʊ w ɑn/","seguir — suena 'go-w-on'"],["see it","/si j ɪt/","verlo — suena 'see-y-it'"],["I asked","/aɪ j æskt/","pregunté — suena 'I-y-asked'"]]},
 {n:"Yod-coalescence DENTRO de una palabra (DU → /dʒu/)",ipa:"/dʒu/",r:"Mismo fenómeno que 'would you' pero ya fusionado dentro de una sola palabra: la combinación <b>-du-</b> se pronuncia con el sonido de 'j' inglesa (como en jump), no como 'du' suelto.",ex:[["education","/ˌɛdʒʊˈkeɪʃən/","educación"],["individual","/ˌɪndɪˈvɪdʒuəl/","individual"],["graduate","/ˈɡrædʒueɪt/","graduarse / graduado"],["procedure","/prəˈsidʒər/","procedimiento"],["module","/ˈmɑdʒul/","módulo"]]},
 {n:"Syncope (una sílaba átona desaparece)",ipa:"∅",r:"Una sílaba completa sin acento, en medio de la palabra, se come al hablar rápido — la palabra que 'debería' tener 3 sílabas suena como 2. Se llama <b>syncope</b>. No es error del hablante nativo, es la norma.",ex:[["different","/ˈdɪfrənt/","diferente — suena 'diffrent', no 'di-fe-rent'"],["every","/ˈɛvri/","cada — suena 'evry', no 'e-ve-ry'"],["chocolate","/ˈtʃɑklət/","chocolate — suena 'choc-lit', no 'cho-co-late'"],["camera","/ˈkæmrə/","cámara — suena 'cam-ra'"],["family","/ˈfæmli/","familia — suena 'fam-ly'"],["comfortable","/ˈkʌmftərbəl/","cómodo — suena 'comf-ta-ble', no 4 sílabas"],["already","/ɔlˈrɛdi/ → /ˈɑrdi/","ya — en habla muy rápida pierde su segunda sílaba y suena 'ardy'"]]}
];

D.stressNote="El nombre lingüístico de este fenómeno es <b>noun–verb stress shift</b> (también llamado <i>initial-stress-derived noun</i>): son palabras heterónimas — se escriben igual, cambian solo el acento tónico. La regla se cumple en la gran mayoría de estos pares (no es absoluta, pero es muy confiable): <b>acento en la 1ª sílaba → sustantivo o adjetivo · acento en la 2ª sílaba → verbo.</b>";

 ["wish + pasado perfecto","deseo sobre el pasado, ya no se puede cambiar (como el 3º condicional)","I wish I had studied harder.","Ojalá hubiera estudiado más (ya es tarde)."],

D.wishHopeNote="'Wish' y 'hope' NO son intercambiables aunque ambos se traduzcan como 'esperar/desear'. <b>Hope</b> se usa para algo que todavía es posible (igual de 'real' que el 1er condicional, sección arriba). <b>Wish</b> se usa para algo hipotético, contrario a la realidad actual o pasada (misma lógica que el 2º y 3er condicional: pasado simple = presente irreal, pasado perfecto = pasado irreal). Por eso 'wish' vive en esta sección y no en collocations o chunks.";

D.mitigatorsNote="Los <b>mitigadores</b> (hedges / downtoners) suavizan un adjetivo: no es 'very good' (muy bueno) sino 'a bit good' (algo bueno). Van <b>antes del adjetivo</b>: 'a bit tired', 'fairly difficult'. Muy útiles para sonar menos directo, más educado.";
D.intensifiersNote="Los <b>intensificadores</b> (boosters / maximizers) hacen el adjetivo más fuerte. Van <b>antes del adjetivo</b>: 'very tired', 'absolutely exhausted'. No confundas: 'very' no va con adjetivos extremos (*very excellent → absolutely excellent).";

D.gerundNote="El <b>-ing</b> tiene 3 trabajos distintos y NO son intercambiables: (1) <b>Gerundio</b> — el verbo actúa como sustantivo; (2) parte del <b>tiempo continuo</b> (ya visto en la sección 1: is/are/was/were + V-ing); (3) <b>adjetivo</b> (participio presente) que describe qué causa una sensación. Esta sección cubre el (1) y el (3), que son los que se confunden con sustantivos y adjetivos normales.";

D.usedToRule="¿Por qué 2 de los 3 llevan gerundio y el primero no? Porque el 'to' cambia de función: en 'used to + V(base)' es parte de un verbo modal-like (no es preposición). En 'be/get used to', <b>'to' SÍ es preposición</b> — y como ya viste en la sección 28 (gerundios), después de preposición SIEMPRE va gerundio, nunca infinitivo. Es la misma regla de oro, aplicada aquí.";
D.confusNote="Estas parejas/tríos no son homófonas (sección 5) porque casi nunca suenan exactamente igual, ni son falsos amigos (sección 23) porque no chocan con el español — se confunden entre sí en inglés por su parecido visual o porque comparten la misma raíz con función gramatical distinta. La categoría en inglés se llama <b>confusable words</b>.";

 {t:"I'll (forma débil) ≈ all",r:"En su forma acentuada, 'I'll' es /aɪl/ y 'all' es /ɔl/ — claramente distintos. Pero en habla rápida y SIN ACENTO (forma débil), 'I'll' se relaja a algo cercano a /əl/, y para algunos hablantes eso se acerca perceptiblemente a un 'all' relajado. No son la misma palabra, pero de oído casual, en una frase corrida, pueden confundirse.",ex:"I'll go = /əl ɡoʊ/ (rápido, átono) — más cercano a 'all go' de lo que sugiere la ortografía."},

const $=id=>document.getElementById(id);

/* Pronunciación con la voz nativa del navegador (Web Speech API) — sin API, sin key, sin conexión */
let voicesReady=[];
function loadVoices(){voicesReady=window.speechSynthesis?window.speechSynthesis.getVoices():[]}
if(window.speechSynthesis){loadVoices();window.speechSynthesis.onvoiceschanged=loadVoices;}
function speak(text){
 if(!window.speechSynthesis){alert("Tu navegador no soporta síntesis de voz.");return;}
 window.speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);
 u.lang="en-US";u.rate=0.9;
 const v=voicesReady.find(v=>v.lang==="en-US")||voicesReady.find(v=>v.lang&&v.lang.startsWith("en"));
 if(v)u.voice=v;
 window.speechSynthesis.speak(u);
}
function spkBtn(text){return `<button class="spk" data-text="${escAttr(text)}" onclick="speak(this.dataset.text)" title="Escuchar pronunciación (inglés americano)">🔊</button>`;}

 </div>`;
}

 return col("A1 / A2",e.a)+col("B1 / B2",e.b)+col("C1 / C2",e.c)+col("+ Verbo frasal",e.p)+col("Nativo / coloquial",e.n);
}
async function regenEx(id,topic,btn){
 var selEl = document.getElementById("sel-"+id);
 var sel = selEl ? selEl.value : "example";
 var st = document.getElementById("st-"+id);
 var cols = document.getElementById("cols-"+id);
 if(btn) btn.disabled=true;
 if(st) st.innerHTML='<span class="loading"></span> mezclando offline…';
 setTimeout(function(){
  try{
   var base = (sel||"example").split(" - ")[0].split(" (")[0].replace(/"/g,"").trim();
   if(base.length>30) base = base.split(" ")[0];
   var safeBase = base || "example";
   var bank = {};
   var found = null;
   try{
    var el = document.getElementById("richbank");
    if(el) bank = JSON.parse(el.textContent);
    found = bank[safeBase];
   }catch(e){}
   var variants = [
    {en: "I have "+safeBase+".", es: "Tengo "+safeBase+".", ipa: "/aɪ hæv "+safeBase+"/"},
    {en: "She uses "+safeBase+" every day.", es: "Ella usa "+safeBase+" todos los días.", ipa: "/ʃi juzɪz "+safeBase+"/"},
    {en: "We need more "+safeBase+" for work.", es: "Necesitamos más "+safeBase+" para el trabajo.", ipa: "/wi nid mɔr "+safeBase+"/"},
    {en: "Have you seen my "+safeBase+"?", es: "¿Has visto mi "+safeBase+"?", ipa: "/hæv ju sin maɪ "+safeBase+"/"}
   ];
   var pick = function(){return variants[Math.floor(Math.random()*variants.length)];};
   var r1 = pick(); var r2 = pick();
   var j;
   if(found && found.length>=1){
    j = {a: found[0], b: found[0], c: found[0], p: found[0], n: found[0]};
    if(found.length>1) j.b = found[1];
    if(found.length>2) j.c = found[2];
    if(found.length>3) j.p = found[3];
    if(found.length>4) j.n = found[4];
   } else {
    j = {
    a: r1,
    b: {en: "She has been working with "+safeBase+" since 2020.", ipa: "/ʃi hæz bɪn ˈwɜrkɪŋ wɪð "+safeBase+" sɪns 2020/", es: "Ha estado trabajando con "+safeBase+" desde 2020."},
    c: {en: "Had I known about "+safeBase+", I would have made a better decision.", ipa: "/hæd aɪ noʊn əˈbaʊt "+safeBase+"/", es: "Si hubiera sabido sobre "+safeBase+", habría tomado mejor decisión."},
    p: {en: "We need to figure out the "+safeBase+".", ipa: "/wi nid tə ˈfɪɡjər aʊt ðə "+safeBase+"/", es: "Necesitamos averiguar el "+safeBase+".", note: "figure out = averiguar"},
    n: {en: "I kinda love this "+safeBase+", gotta be honest.", ipa: "/aɪ ˈkaɪndə lʌv ðɪs "+safeBase+"/", es: "Como que me encanta este "+safeBase+", la verdad.", note: "kinda = coloquial, gotta = tengo que"}
   };
   }
   if(cols) cols.innerHTML = exCols(j);
   if(st) st.textContent = "✓ ejemplos mezclados offline - "+safeBase;
  }catch(e){
   if(st) st.textContent = "Error: "+e.message;
  }
  if(btn) btn.disabled=false;
 }, 250);
}

 h+=`<section class="topic" id="quest"><h2><span class="n">13</span>Inglés interrogativo</h2>
 <div class="lesson"><b>Mini-clase.</b> Fórmula de oro: <span class="formula">(Wh-) + auxiliar + sujeto + verbo base</span>. Si no hay auxiliar visible, aparece <b>do/does/did</b> y el verbo vuelve a su base: She works → <u>Does</u> she <u>work</u>? Excepción: preguntas al sujeto no llevan do: "Who called?" (no "Who did call?").</div>
 <div class="tblwrap"><table><tr><th>Wh-word</th><th>Español</th><th>Ejemplo</th></tr>
 ${D.wh.map(w=>`<tr><td><b>${w[0]}</b></td><td class="es">${w[1]}</td><td>${w[2]}</td></tr>`).join("")}</table></div>
 <h3>Do / Does / Did — ¿cuál usar?</h3>
 <div class="rule"><b>DO</b> → con I / you / we / they, y presente simple: "Do they live here?"<br><b>DOES</b> → con he / she / it, presente simple (el verbo pierde la -s: does she work?, no ✗ does she works?)<br><b>DID</b> → cualquier sujeto, pasado simple (el verbo vuelve a la base: Did you go?, no ✗ Did you went?)</div>
 <div class="rule">Estos tres son solo <b>auxiliares vacíos de significado</b>: existen porque el inglés exige un auxiliar antes del sujeto en la pregunta, y el verbo principal no puede moverse solo. Por eso "aparece de la nada" comparado con el español.</div>
 <h3>Entonación según el tipo de pregunta</h3>
 <div class="rule"><b>Preguntas Sí/No</b> (con do/does/did, o be/have como auxiliar) → entonación <b>ascendente ↗</b> al final: "Do you like it?↗". Sube porque el hablante pide una confirmación abierta (sí o no), dejando la voz "en el aire".</div>
 <div class="rule"><b>Preguntas Wh-</b> (what, where, who…) → entonación <b>descendente ↘</b> al final: "Where do you live?↘". Baja porque la pregunta ya asume que existe una respuesta concreta y específica; suena más segura/cerrada.</div>
 <div class="rule"><b>Question tags</b>: si el hablante realmente no sabe la respuesta, la entonación del tag <b>sube ↗</b> (pregunta genuina); si ya sabe la respuesta y solo busca confirmación o acuerdo, el tag <b>baja ↘</b>. "You're coming, aren't you?↘" (asume que sí) vs "↗" (duda real).<br>"You're coming, <b>aren't you?</b>" · "She didn't call, <b>did she?</b>"</div>
 <div class="rule"><b>Preguntas de elección</b> (A or B): sube en la primera opción y baja en la última → "Tea↗ or coffee↘?" — la caída final marca que ahí terminan las opciones.</div>
 <h3>Preguntas que terminan en preposición — uso diario</h3>
 <div class="rule">En inglés es totalmente normal y natural que una pregunta termine en preposición — se llama <b>preposition stranding</b> (preposición "varada"). Mover la preposición al inicio suena forzado o excesivamente formal: "Who are you talking to?" (natural) vs "To whom are you talking?" (muy formal/legal). En Wh-questions con preposición, la preposición casi siempre queda al final en el habla cotidiana.</div>
 <div class="tblwrap"><table><tr><th>Pregunta natural (preposición al final)</th><th>Español</th></tr>
 <tr><td><b>Who are you talking to?</b> ${spkBtn("Who are you talking to?")}</td><td class="es">¿Con quién estás hablando?</td></tr>
 <tr><td><b>What are you looking for?</b> ${spkBtn("What are you looking for?")}</td><td class="es">¿Qué estás buscando?</td></tr>
 <tr><td><b>Where are you from?</b> ${spkBtn("Where are you from?")}</td><td class="es">¿De dónde eres?</td></tr>
 <tr><td><b>Who did you go with?</b> ${spkBtn("Who did you go with?")}</td><td class="es">¿Con quién fuiste?</td></tr>
 <tr><td><b>What is this used for?</b> ${spkBtn("What is this used for?")}</td><td class="es">¿Para qué se usa esto?</td></tr>
 <tr><td><b>Who do you work for?</b> ${spkBtn("Who do you work for?")}</td><td class="es">¿Para quién trabajas?</td></tr>
 <tr><td><b>What are you thinking about?</b> ${spkBtn("What are you thinking about?")}</td><td class="es">¿En qué estás pensando?</td></tr>
 <tr><td><b>Who is this gift for?</b> ${spkBtn("Who is this gift for?")}</td><td class="es">¿Para quién es este regalo?</td></tr>
 <tr><td><b>What did you talk about?</b> ${spkBtn("What did you talk about?")}</td><td class="es">¿De qué hablaron?</td></tr>
 <tr><td><b>Where do you come from?</b> ${spkBtn("Where do you come from?")}</td><td class="es">¿De dónde vienes?</td></tr>
 <tr><td><b>Who was that call from?</b> ${spkBtn("Who was that call from?")}</td><td class="es">¿De quién era esa llamada?</td></tr>
 <tr><td><b>What's this made of?</b> ${spkBtn("What's this made of?")}</td><td class="es">¿De qué está hecho esto?</td></tr>
 </table></div>
 ${exWidget("q",D.wh.map(w=>w[0]),"pregunta con la palabra interrogativa")}</section>`;

function showNouns(cat,btn){
 if(btn){btn.parentElement.querySelectorAll(".chip").forEach(function(c){c.classList.toggle("active",c===btn);});}
 var def = D.nounsDefs[cat] || "";
 var examples = D.nounsExamples[cat] || [];
 var rows = "";
 for(var i=0;i<examples.length;i++){var e=examples[i]; rows+='<tr><td><b>'+e[0]+'</b><br><span class="ipa">'+e[1]+'</span></td><td class="es">'+e[2]+'</td><td>'+e[3]+'</td><td class="es">'+e[4]+'</td></tr>';}
 var html = '<div class="rule"><b>Definición:</b> '+def+'</div>';
 html += '<div class="tblwrap"><table><tr><th>Ejemplo · IPA</th><th>Español</th><th>Oración</th><th>Español</th></tr>'+rows+'</table></div>';
 if(cat==="Countable nouns (contables)" || cat==="Uncountable nouns (incontables)"){
  var rows2="";
  for(var i=0;i<D.countableUncountableTable.length;i++){var r=D.countableUncountableTable[i]; rows2+='<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td class="es">'+r[2]+'</td></tr>';}
  html+='<h3>Countable vs Uncountable</h3><div class="tblwrap"><table><tr><th>Regla</th><th>Ejemplo</th><th>Español</th></tr>'+rows2+'</table></div>';
 }
 if(cat==="Collective nouns (colectivos)"){
  var rows2="";
  for(var i=0;i<D.collectiveTable.length;i++){var r=D.collectiveTable[i]; rows2+='<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td class="es">'+r[2]+'</td></tr>';}
  html+='<h3>Colectivos</h3><div class="tblwrap"><table><tr><th>Colectivo</th><th>Uso</th><th>Ejemplo</th></tr>'+rows2+'</table></div>';
 }
 if(cat==="Compound nouns (compuestos)"){
  var rows2="";
  for(var i=0;i<D.compoundTable.length;i++){var r=D.compoundTable[i]; rows2+='<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td class="es">'+r[2]+'</td></tr>';}
  html+='<h3>Tipos de compuestos (absorbe antigua 36)</h3><div class="tblwrap"><table><tr><th>Tipo</th><th>Ejemplo</th><th>Español</th></tr>'+rows2+'</table></div>';
  var rows3="";

  html+='<h3>Compuestos idiomáticos (antigua 36)</h3><div class="tblwrap"><table><tr><th>Compuesto · IPA</th><th>Literal → Real</th><th>Español</th></tr>'+rows3+'</table></div>';
 }
 if(cat==="Possessive nouns (posesivos)"){

  html+='<h3>Reglas posesivas</h3><div class="tblwrap"><table><tr><th>Regla</th><th>Ejemplo</th><th>Español</th></tr>'+rows2+'</table></div>';
 }

/* ---- quiz de pares mínimos ---- */
let qi=null;
function newQuiz(){
 const m=D.minPairs[Math.floor(Math.random()*D.minPairs.length)];
 const target=Math.random()<.5?{w:m.a,i:m.ai}:{w:m.b,i:m.bi};
 qi={m,target};
 $("quizbox").innerHTML=`<div><b>¿Qué palabra corresponde a</b> <span class="ipa" style="font-size:18px">${target.i}</span> ?</div>
 <div class="qopts"><button onclick="answer('${m.a}')">${m.a}</button><button onclick="answer('${m.b}')">${m.b}</button></div>
 <div class="qfeed" id="qfeed"></div>
 <div style="display:flex;gap:8px;margin-top:6px"><button onclick="newQuiz()">Otro par</button><button onclick="aiQuiz(this)">↻ IA: par nuevo</button></div>`;
}
function answer(w){
 const f=$("qfeed"),ok=w===qi.target.w;
 f.className="qfeed "+(ok?"ok":"bad");
 f.innerHTML=(ok?"✓ Correcto. ":"✗ No. ")+`${qi.m.a} ${qi.m.ai} vs ${qi.m.b} ${qi.m.bi} — <span class="es">${qi.m.es}</span>`;
}
async function aiQuiz(btn){
 btn.disabled=true;btn.textContent="…";
 const p=`Genera UN par mínimo en inglés que confunda a hispanohablantes (distinto de: ${D.minPairs.map(x=>x.a+"/"+x.b).join(", ")}). ${JSONRULES} Formato: {"a":"","ai":"/IPA/","b":"","bi":"/IPA/","es":"significado A / significado B"}`;
 try{const j=parseJSON(await callClaude(p)); if(j&&j.a){D.minPairs.push(j)}}catch(e){}
 btn.disabled=false;btn.textContent="↻ IA: par nuevo";newQuiz();
}

/* ---- generador de frases reducidas (TV/canciones/películas) ---- */
async function genSlang(btn){
 btn.disabled=true; const st=$("st-slang"); st.innerHTML='<span class="loading"></span> generando…';
 const p=`Genera UNA oración corta (máximo 50 palabras) de uso común en TV, series, películas o canciones en inglés, que use habla reducida/contraída real (contracciones, flapping, yod-coalescence, h-dropping, g-dropping, etc — como 'whatcha', 'gonna', 'dunno', 'gimme', 'I'ma', 'shoulda'). Distinta de estos ejemplos ya usados: ${D.contrPractice.map(c=>c[0]).join(", ")}. ${JSONRULES} Formato: {"reduced":"forma reducida tal como se oye","full":"forma completa/formal","ipa":"/IPA de la forma reducida/","es":"traducción al español","rule":"motivo breve, referencia a qué fenómeno (ej. yod-coalescence, flapping, h-dropping) y en qué sección del diccionario se explica (sección 19 o 14)"}`;
 try{
  const j=parseJSON(await callClaude(p));
  if(j&&j.reduced){
   $("slangbox").innerHTML=`<div class="card"><h4>${esc(j.reduced)} ${spkBtn(j.reduced)}</h4><div style="font-size:13px;margin:4px 0"><b>Forma completa:</b> ${esc(j.full)}</div><span class="ipa wrap">${esc(j.ipa)}</span><br><span class="es">${esc(j.es)}</span><div class="rule" style="margin-top:8px">${esc(j.rule)}</div></div>`;
   st.textContent="✓ nueva frase";
  } else st.textContent="Respuesta no válida, intenta otra vez";
 }catch(e){st.textContent="Sin conexión con la API"}
 btn.disabled=false;
}

/* ---- noticias ---- */
async function loadNews(cat,btn){
 btn.parentElement.querySelectorAll(".chip").forEach(c=>c.classList.toggle("active",c===btn));
 const b=$("newsbody");b.innerHTML='<span class="loading"></span> <span class="es">Buscando noticias reales de hoy…</span>';
 const p=`Busca en la web 3 noticias REALES y recientes de ${cat} (internacionales). Para cada una escribe con tus propias palabras un resumen de 1-2 oraciones en inglés sencillo (B1) — no copies texto de las fuentes — más su traducción al español y un glosario de 2 palabras clave con IPA y traducción. ${JSONRULES} Formato: [{"en":"","es":"","gloss":[["word","/IPA/","traducción"]]}]`;
 try{
  const j=parseJSON(await callClaude(p,true));
  if(Array.isArray(j)&&j.length){
   b.innerHTML=j.map(n=>`<div class="newsitem"><div class="en">${esc(n.en)}</div><div class="es">${esc(n.es)}</div><div class="gloss">${(n.gloss||[]).map(g=>`<b>${esc(g[0])}</b> <span class="ipa">${esc(g[1])}</span> = ${esc(g[2])}`).join(" · ")}</div></div>`).join("");
  } else b.innerHTML='<span class="es">No se pudo interpretar la respuesta. Intenta de nuevo.</span>';
 }catch(e){b.innerHTML='<span class="es">Sin conexión con la API de noticias.</span>'}
}

/* ---- búsqueda / diccionario externo ---- */
async function lookupWord(){
 const w=$("lkin").value.trim(); if(!w)return;
 const box=$("lkbox"); $("lookup").classList.add("open");
 box.innerHTML=`<h2 style="margin-bottom:8px">${esc(w)}</h2><span class="loading"></span> <span class="es">Consultando diccionario…</span>`;
 const p=`Actúa como diccionario EN→ES completo para la palabra o frase "${w}". Indica TODAS sus funciones gramaticales (verbo, sustantivo, adjetivo, etc.) con significado en español para cada una, su IPA, y 5 ejemplos: A1/A2, B1/B2, C1/C2, uno con un verbo frasal relacionado, y uno MUY coloquial/nativo (informal, como hablaría un nativo relajado). ${JSONRULES} Formato: {"word":"","ipa":"/IPA/","pos":[{"tipo":"verbo|sustantivo|adjetivo|adverbio|frase","es":"significado"}],"nota":"observación de uso breve","ex":{"a":{"en":"","ipa":"","es":""},"b":{"en":"","ipa":"","es":""},"c":{"en":"","ipa":"","es":""},"p":{"en":"","ipa":"","es":"","note":""},"n":{"en":"","ipa":"","es":"","note":""}}}`;
 try{
  const j=parseJSON(await callClaude(p));
  if(j&&j.word){
   box.innerHTML=`<h2 style="margin-bottom:2px">${esc(j.word)} ${spkBtn(j.word)} <span class="ipa" style="font-size:16px">${esc(j.ipa)}</span></h2>
   <div style="margin:8px 0">${(j.pos||[]).map(x=>`<div style="margin:4px 0"><span class="tag ${(x.tipo||"").startsWith("v")?"v":(x.tipo||"").startsWith("s")?"n":(x.tipo||"").startsWith("adj")?"adj":"adv"}">${esc(x.tipo)}</span> ${esc(x.es)}</div>`).join("")}</div>
   ${j.nota?`<div class="rule">${esc(j.nota)}</div>`:""}
   <div class="excols" style="margin-top:10px">${exCols(j.ex)}</div>
   <button style="margin-top:12px" onclick="document.getElementById('lookup').classList.remove('open')">Cerrar</button>`;
  } else box.innerHTML+=`<div class="es">No se pudo interpretar la respuesta.</div>`;
 }catch(e){box.innerHTML=`<h2>${esc(w)}</h2><div class="es">Sin conexión con la API.</div><button onclick="document.getElementById('lookup').classList.remove('open')">Cerrar</button>`}
}
$("lkin").addEventListener("keydown",e=>{if(e.key==="Enter")lookupWord()});
