<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Léxico · Diccionario EN→ES por temas</title>
<style>
:root{
  --paper:#FAFAF7; --ink:#1A1D29; --muted:#6B6E7B; --line:#E4E2DA;
  --hl:#FFE33D; --hl-soft:#FFF6BF; --teal:#0E7C7B; --teal-soft:#E4F1F0;
  --red:#C0392B; --card:#FFFFFF;
  --sans:'IBM Plex Sans',system-ui,sans-serif; --serif:'Gentium Book Plus',Georgia,serif;
  /* pestañas de índice — una por parte temática, como el índice lateral de un diccionario físico */
  --p-sonidos:#0E7C7B; --p-piezas:#35569C; --p-oracion:#7A4A93; --p-vocab:#3F7A46; --p-registro:#B15A30; --p-aplicado:#AD7F13;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
.ipa{font-family:var(--serif);color:var(--teal);font-size:.95em;white-space:nowrap}
.ipa.wrap{white-space:normal}
.spk{border:none;background:none;padding:1px 4px;cursor:pointer;font-size:13px;vertical-align:middle;line-height:1;border-radius:4px}
.spk:hover{background:var(--hl-soft)}
.spk:active{transform:scale(.9)}
.es{color:var(--muted);font-style:italic}
mark{background:linear-gradient(104deg,transparent .5%,var(--hl) 3%,var(--hl-soft) 96%,transparent 99%);padding:0 .25em;border-radius:2px}
/* ---------- layout ---------- */
header{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:2px solid var(--ink);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;font-weight:700;letter-spacing:-.02em}
header h1 span{font-family:var(--serif);font-weight:400;color:var(--teal)}
button{font:inherit;font-weight:600;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:6px;cursor:pointer}
button:hover{background:var(--hl-soft)}
button.primary{background:var(--ink);color:#fff}
button.primary:hover{background:#000}
button:disabled{opacity:.45;cursor:wait}
button:focus-visible,.chip:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.searchwrap{position:relative;flex:1;min-width:160px;max-width:320px;margin-left:auto}
#searchbox{width:100%;padding:8px 12px;border:1.5px solid var(--ink);border-radius:99px;font:inherit;font-size:13px;background:var(--card);color:var(--ink)}
#searchResults{display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:8px;max-height:340px;overflow-y:auto;z-index:50;box-shadow:0 4px 16px rgba(0,0,0,.18)}
#searchResults.open{display:block}
.sres{padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--line);font-size:13px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.sres:last-child{border-bottom:none}
.sres:hover{background:var(--paper)}
.sres .sec{margin-left:auto;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
#parts{position:sticky;top:var(--headerH,57px);z-index:26;background:var(--ink);display:flex;gap:0;flex-wrap:wrap;padding:0 16px}
.parttab{white-space:nowrap;border:none;border-bottom:3px solid transparent;background:transparent;color:#c7c5d6;padding:9px 14px;font-size:12.5px;font-weight:600;cursor:pointer;letter-spacing:.01em}
.parttab:hover{color:#fff}
.parttab.active{color:#fff}
.parttab[data-part="sonidos"].active{border-bottom-color:var(--p-sonidos)}
.parttab[data-part="piezas"].active{border-bottom-color:var(--p-piezas)}
.parttab[data-part="oracion"].active{border-bottom-color:var(--p-oracion)}
.parttab[data-part="vocab"].active{border-bottom-color:var(--p-vocab)}
.parttab[data-part="registro"].active{border-bottom-color:var(--p-registro)}
.parttab[data-part="aplicado"].active{border-bottom-color:var(--p-aplicado)}
nav#nav{position:static;background:var(--paper);border-bottom:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;--partAccent:var(--ink)}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);padding:5px 11px;border-radius:99px;font-size:12.5px;font-weight:500;cursor:pointer}
.chip.active{background:var(--partAccent,var(--ink));color:#fff;border-color:var(--partAccent,var(--ink))}
main{max-width:1080px;margin:0 auto;padding:18px 16px 120px}
section.topic{display:none}
section.topic.visible{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
h2{font-size:22px;margin:6px 0 4px;letter-spacing:-.02em;padding-left:12px;border-left:4px solid var(--partAccent,var(--teal))}
h2 .n{font-family:var(--serif);color:var(--partAccent,var(--teal));font-weight:400;margin-right:6px}
section.topic[data-part="sonidos"]{--partAccent:var(--p-sonidos)}
section.topic[data-part="piezas"]{--partAccent:var(--p-piezas)}
section.topic[data-part="oracion"]{--partAccent:var(--p-oracion)}
section.topic[data-part="vocab"]{--partAccent:var(--p-vocab)}
section.topic[data-part="registro"]{--partAccent:var(--p-registro)}
section.topic[data-part="aplicado"]{--partAccent:var(--p-aplicado)}
h3{font-size:15px;margin:18px 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px}
/* mini clase fija */
.lesson{background:var(--teal-soft);border-left:4px solid var(--teal);border-radius:0 8px 8px 0;padding:10px 14px;margin:10px 0 16px;font-size:13.5px}
.lesson b{color:var(--teal)}
.rule{background:var(--hl-soft);border:1px dashed #d9c545;border-radius:8px;padding:8px 12px;margin:8px 0;font-size:13px}
.rule b{background:var(--hl);padding:0 4px;border-radius:3px}
.formula{font-family:var(--serif);background:var(--card);border:1.5px solid var(--ink);border-radius:6px;padding:2px 8px;display:inline-block;margin:2px 0;font-size:13.5px}
/* tablas */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--card);margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:var(--paper);text-align:left;padding:7px 10px;border-bottom:2px solid var(--ink);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
tr.freq td{background:var(--hl-soft)}
tr.freq td:first-child{box-shadow:inset 4px 0 0 var(--hl)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:1px 6px;border-radius:4px;background:var(--paper);border:1px solid var(--line);margin-right:3px}
.tag.v{background:#EAF3E6;border-color:#9CC08B}.tag.n{background:#EAF0FA;border-color:#9DB6E0}
.tag.adj{background:#FBEDE6;border-color:#E0AA8D}.tag.adv{background:#F5EAFA;border-color:#C99DE0}
.tag.prep{background:#FAF2E1;border-color:#DEC787}.tag.sep{background:var(--hl-soft);border-color:#d9c545}
/* tarjetas y grids */
.grid{display:grid;gap:10px;margin:10px 0}
.g2{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.card h4{font-size:14px;margin-bottom:4px}
/* widget de ejemplos 4 columnas */
.exwidget{background:var(--card);border:1.5px solid var(--ink);border-radius:10px;padding:12px;margin:14px 0}
.exhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.exhead select{font:inherit;padding:6px 8px;border:1.5px solid var(--ink);border-radius:6px;background:var(--paper)}
.exbody{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.exbody .excol{padding:9px 11px;background:var(--card);border-right:1px solid var(--line)}
.exbody .excol:nth-child(3n){border-right:none}
.exbody .excol:nth-child(2){background:var(--teal-soft)}
.exbody .excol:nth-child(3){background:var(--hl-soft)}
.exnote{padding:10px 12px;background:var(--card);border:1px dashed var(--line);border-radius:8px;font-size:13px;color:var(--muted)}
.excol .lvl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:5px}
.excol:last-child .lvl{color:#8a7a00}
.excol .en{font-weight:600;font-size:13.5px}
.excol .ipa{display:block;white-space:normal;margin:3px 0;font-size:12.5px}
.excol .es{display:block;font-size:12.5px}
@media(max-width:820px){.exbody{grid-template-columns:1fr 1fr}.excol{border-bottom:1px solid var(--line)}}
@media(max-width:520px){.exbody{grid-template-columns:1fr}}
.status{font-size:12px;color:var(--muted);margin-left:auto}
/* IPA chart */
.ipagrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0}
.ipacell{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;text-align:center}
.ipacell .sym{font-family:var(--serif);font-size:22px;color:var(--teal)}
.ipacell .w{font-weight:600;font-size:13px}
.ipacell .hint{font-size:11.5px;color:var(--muted)}
/* quiz */
.quiz{background:var(--card);border:1.5px solid var(--ink);border-radius:10px;padding:12px;margin:12px 0}
.qopts{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.qopts button{font-family:var(--serif);font-size:16px}
.qfeed{font-size:13px;min-height:20px}
.qfeed.ok{color:#1e7d32;font-weight:600}.qfeed.bad{color:var(--red);font-weight:600}
/* noticias */
.newscat{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.newsitem{border-left:3px solid var(--teal);padding:8px 12px;background:var(--card);border-radius:0 8px 8px 0;margin:8px 0}
.newsitem .en{font-weight:600}
.newsitem .gloss{font-size:12px;margin-top:4px}
.newsitem .gloss b{background:var(--teal-soft);padding:0 4px;border-radius:3px;color:var(--teal)}
/* ticker inferior */
#ticker{position:fixed;bottom:0;left:0;right:0;background:var(--ink);color:#fff;z-index:40;border-top:3px solid var(--hl)}
#ticker .row{display:flex;align-items:center;gap:10px;padding:8px 14px;max-width:1080px;margin:0 auto}
#ticker .label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:var(--hl);color:var(--ink);padding:2px 6px;border-radius:3px;flex-shrink:0}
#tickbody{flex:1;overflow:hidden;min-height:38px}
.tick{animation:fade .4s ease}
.tick .en{font-weight:600}
.tick .ipa{color:#7ad0cf}
.tick .es{color:#b9bcc9}
#ticker button{border-color:#555;background:transparent;color:#fff;padding:4px 9px;font-size:12px;flex-shrink:0}
#ticker button:hover{background:#333}
.loading{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
footer.note{max-width:1080px;margin:30px auto 0;padding:0 16px;font-size:11.5px;color:var(--muted)}

/* ================= RESPONSIVE ================= */
@media(max-width:780px){
  header{padding:8px 12px;gap:8px}
  header h1{font-size:16px;flex-basis:100%}
  .parttab{padding:8px 10px;font-size:11.5px}
  nav#nav{padding:8px 12px}
  main{padding:14px 12px 130px}
  h2{font-size:19px}
  .lesson,.rule{font-size:12.5px;padding:9px 11px}
  .card h4{font-size:13px}
  .ipagrid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
  .ipacell{padding:6px 8px}
  .ipacell .sym{font-size:19px}
  #ticker .row{padding:7px 10px;gap:7px}
  #ticker .label{display:none}
  .excol .en{font-size:13px}
  table{font-size:12px}
  th,td{padding:6px 8px}
}
@media(max-width:480px){
  header{position:static}
  nav{position:sticky;top:0}
  button,.chip{font-size:13px}
  button{padding:8px 11px}
  .chip{padding:7px 12px}
  h2{font-size:17px}
  h2 .n{display:block;font-size:13px;margin-bottom:2px}
  .qopts button{font-size:15px;padding:9px 14px;flex:1;min-width:100px}
  .exhead{flex-direction:column;align-items:stretch}
  .exhead select,.exhead button{width:100%}
  .status{margin-left:0}
  .grid.g2,.grid.g3{grid-template-columns:1fr}
}
/* área táctil mínima en dispositivos táctiles */
@media(hover:none){
  button,.chip{min-height:38px}
  #tickbody{min-height:44px}
}
</style>
</head>
<body>

<header>
  <h1>Léxico <span>/ˈlɛk.sɪ.koʊ/</span></h1>
  <button onclick="show('startpath')" title="Ruta sugerida si empiezas desde cero">📍 Guía de inicio</button>
  <button onclick="show('glossary')" title="Glosario general, todas las palabras del diccionario A→Z">🔤 Glosario</button>
  <div class="searchwrap">
    <input id="searchbox" type="text" placeholder="🔍 Buscar palabra…" autocomplete="off" oninput="renderSearchResults(this.value)" onkeydown="if(event.key==='Enter')jumpToSearchResult(0)" onblur="setTimeout(function(){$('searchResults').classList.remove('open')},150)">
    <div id="searchResults"></div>
  </div>
</header>

<nav id="parts" aria-label="Categorías"></nav>
<nav id="nav" aria-label="Temas"></nav>
<main id="main"></main>

<div id="ticker">
  <div class="row">
    <span class="label">Frase al azar</span>
    <div id="tickbody"><span class="es">Cargando…</span></div>
    <button onclick="nextTick()" title="Siguiente">▶</button>
  </div>
</div>

<footer class="note">Diccionario EN→ES por temas. Datos locales sin conexión. El IPA mostrado es inglés americano general.</footer>

<script>
/* ================= DATOS BASE ================= */
const D={};

D.tenses=[
 {t:"Present Simple",f:"S + V(base) / V+s",ex:"She works here.",ipa:"/ʃi wɜrks hɪr/",es:"Ella trabaja aquí.",use:"Hábitos, hechos, rutinas",freq:1,exs:[
  {en:"He goes to school by bus.",ipa:"/hi ɡoʊz tə skul baɪ bʌs/",es:"Él va a la escuela en autobús."},
  {en:"Water boils at 100 degrees.",ipa:"/ˈwɔtər bɔɪlz æt wʌn ˈhʌndrəd dɪˈɡriz/",es:"El agua hierve a 100 grados."},
  {en:"We usually have coffee in the morning.",ipa:"/wi ˈjuʒuəli hæv ˈkɔfi ɪn ðə ˈmɔrnɪŋ/",es:"Normalmente tomamos café por la mañana."},
  {en:"My sister teaches math at that school.",ipa:"/maɪ ˈsɪstər ˈtitʃəz mæθ æt ðæt skul/",es:"Mi hermana enseña matemáticas en esa escuela."},
  {en:"The sun rises in the east.",ipa:"/ðə sʌn ˈraɪzɪz ɪn ði ist/",es:"El sol sale por el este."},
  {en:"I don't drink coffee at night.",ipa:"/aɪ doʊnt drɪŋk ˈkɔfi æt naɪt/",es:"No tomo café en la noche."},
  {en:"Dogs bark when they hear strangers.",ipa:"/dɔɡz bɑrk wɛn ðeɪ hɪr ˈstreɪndʒərz/",es:"Los perros ladran cuando oyen extraños."},
  {en:"She always arrives on time.",ipa:"/ʃi ˈɔlweɪz əˈraɪvz ɑn taɪm/",es:"Ella siempre llega a tiempo."},
  {en:"Does he speak French?",ipa:"/dʌz hi spik frɛntʃ/",es:"¿Él habla francés?"}]},
 {t:"Present Continuous",f:"S + am/is/are + V-ing",ex:"I am reading now.",ipa:"/aɪ æm ˈriːdɪŋ naʊ/",es:"Estoy leyendo ahora.",use:"Acción en progreso; planes cercanos",freq:1,exs:[
  {en:"They are playing soccer right now.",ipa:"/ðeɪ ɑr ˈpleɪɪŋ ˈsɑkər raɪt naʊ/",es:"Están jugando fútbol ahora mismo."},
  {en:"She is staying at a hotel this week.",ipa:"/ʃi ɪz ˈsteɪɪŋ æt ə hoʊˈtɛl ðɪs wik/",es:"Ella se está quedando en un hotel esta semana."},
  {en:"I'm meeting my boss tomorrow morning.",ipa:"/aɪm ˈmitɪŋ maɪ bɔs təˈmɔroʊ ˈmɔrnɪŋ/",es:"Me reúno con mi jefe mañana por la mañana."},
  {en:"We are having dinner with friends tonight.",ipa:"/wi ɑr ˈhævɪŋ ˈdɪnər wɪð frɛndz təˈnaɪt/",es:"Vamos a cenar con amigos esta noche."},
  {en:"The baby is sleeping right now.",ipa:"/ðə ˈbeɪbi ɪz ˈslipɪŋ raɪt naʊ/",es:"El bebé está durmiendo ahora mismo."},
  {en:"I'm not working this weekend.",ipa:"/aɪm nɑt ˈwɜrkɪŋ ðɪs ˈwikɛnd/",es:"No estoy trabajando este fin de semana."},
  {en:"Prices are rising every month.",ipa:"/ˈpraɪsəz ɑr ˈraɪzɪŋ ˈɛvri mʌnθ/",es:"Los precios están subiendo cada mes."},
  {en:"Are you listening to me?",ipa:"/ɑr ju ˈlɪsənɪŋ tə mi/",es:"¿Me estás escuchando?"},
  {en:"He's starting a new job next Monday.",ipa:"/hiz ˈstɑrtɪŋ ə nu dʒɑb nɛkst ˈmʌndeɪ/",es:"Empieza un trabajo nuevo el próximo lunes."}]},
 {t:"Present Perfect",f:"S + have/has + V3",ex:"We have finished.",ipa:"/wi hæv ˈfɪnɪʃt/",es:"Hemos terminado.",use:"Pasado con relevancia presente",freq:1,exs:[
  {en:"I have seen that movie twice.",ipa:"/aɪ hæv sin ðæt ˈmuvi twaɪs/",es:"He visto esa película dos veces."},
  {en:"They have lived here for ten years.",ipa:"/ðeɪ hæv lɪvd hɪr fɔr tɛn jɪrz/",es:"Han vivido aquí por diez años."},
  {en:"Have you ever tried sushi?",ipa:"/hæv ju ˈɛvər traɪd ˈsuʃi/",es:"¿Has probado el sushi alguna vez?"},
  {en:"She has just finished her homework.",ipa:"/ʃi hæz dʒʌst ˈfɪnɪʃt hɜr ˈhoʊmwɜrk/",es:"Ella acaba de terminar su tarea."},
  {en:"We haven't decided yet.",ipa:"/wi ˈhævənt dɪˈsaɪdɪd jɛt/",es:"Todavía no hemos decidido."},
  {en:"I've already eaten.",ipa:"/aɪv ɔlˈrɛdi ˈitən/",es:"Ya comí."},
  {en:"Has she finished the report?",ipa:"/hæz ʃi ˈfɪnɪʃt ðə rɪˈpɔrt/",es:"¿Ella ha terminado el informe?"},
  {en:"They have never met him in person.",ipa:"/ðeɪ hæv ˈnɛvər mɛt hɪm ɪn ˈpɜrsən/",es:"Nunca lo han conocido en persona."},
  {en:"How many books have you read this year?",ipa:"/haʊ ˈmɛni bʊks hæv ju rɛd ðɪs jɪr/",es:"¿Cuántos libros has leído este año?"}]},
 {t:"Present Perfect Continuous",f:"S + have/has been + V-ing",ex:"He has been waiting.",ipa:"/hi hæz bɪn ˈweɪtɪŋ/",es:"Él ha estado esperando.",use:"Duración hasta ahora",freq:1,exs:[
  {en:"She has been working all day.",ipa:"/ʃi hæz bɪn ˈwɜrkɪŋ ɔl deɪ/",es:"Ella ha estado trabajando todo el día."},
  {en:"We have been waiting since 3 pm.",ipa:"/wi hæv bɪn ˈweɪtɪŋ sɪns θri pi ɛm/",es:"Hemos estado esperando desde las 3 pm."},
  {en:"It has been raining for two hours.",ipa:"/ɪt hæz bɪn ˈreɪnɪŋ fɔr tu ˈaʊərz/",es:"Ha estado lloviendo por dos horas."},
  {en:"I've been thinking about this all day.",ipa:"/aɪv bɪn ˈθɪŋkɪŋ əˈbaʊt ðɪs ɔl deɪ/",es:"He estado pensando en esto todo el día."},
  {en:"How long have you been studying English?",ipa:"/haʊ lɔŋ hæv ju bɪn ˈstʌdiɪŋ ˈɪŋɡlɪʃ/",es:"¿Cuánto tiempo has estado estudiando inglés?"},
  {en:"They haven't been sleeping well lately.",ipa:"/ðeɪ ˈhævənt bɪn ˈslipɪŋ wɛl ˈleɪtli/",es:"No han estado durmiendo bien últimamente."},
  {en:"My eyes are red because I've been reading for hours.",ipa:"/maɪ aɪz ɑr rɛd bɪˈkɔz aɪv bɪn ˈridɪŋ fɔr ˈaʊərz/",es:"Tengo los ojos rojos porque he estado leyendo por horas."},

 {t:"Past Continuous",f:"S + was/were + V-ing",ex:"It was raining.",ipa:"/ɪt wʌz ˈreɪnɪŋ/",es:"Estaba lloviendo.",use:"Acción en curso en el pasado",freq:1,exs:[

 {t:"Future Perfect Continuous",f:"S + will have been + V-ing",ex:"She will have been teaching 10 years.",ipa:"/ʃi wɪl hæv bɪn ˈtiːtʃɪŋ tɛn jɪrz/",es:"Habrá estado enseñando 10 años.",use:"Duración hasta un punto futuro",freq:0,exs:[

 {t:"Future: BE going to",f:"S + am/is/are + going to + V(base)",ex:"I'm going to call her.",ipa:"/aɪm ˈɡoʊɪŋ tə kɔl hɜr/",es:"Voy a llamarla.",use:"Planes ya decididos; predicciones con evidencia visible ahora",freq:1,exs:[

D.goingToNote="'Going to' NO es un verbo auxiliar por sí solo — el auxiliar real es <b>be</b> (am/is/are); 'going to' es la estructura fija que sigue. Se usa para planes ya decididos ('I'm going to study medicine') o predicciones con evidencia presente ('Look at those clouds, it's going to rain'), a diferencia de 'will', que es más para decisiones espontáneas o promesas.";

D.verbTypes=[
 {t:"Regulares",mini:"La mayoría de los verbos en inglés son regulares: forman el pasado y el participio agregando siempre <b>-ed</b> al verbo base, sin excepciones que memorizar una por una. Aprende la regla de ortografía y la pronunciación de esa -ed (ambas más abajo en esta sección) y podrás conjugar miles de verbos nuevos sin aprenderlos de memoria.",r:"Pasado y participio con <b>-ed</b>",f:"work → worked → worked",ex:"play, want, live, ask, need, help, watch, clean, cook, finish",exs:[
  {en:"I worked late last night.",ipa:"/aɪ wɜrkt leɪt læst naɪt/",es:"Trabajé hasta tarde anoche."},
  {en:"She cleaned the whole house.",ipa:"/ʃi klind ðə hoʊl haʊs/",es:"Ella limpió toda la casa."},
  {en:"We watched a film together.",ipa:"/wi wɑtʃt ə fɪlm təˈɡɛðər/",es:"Vimos una película juntos."}]},
 {t:"Irregulares",mini:"Un grupo relativamente pequeño pero de altísima frecuencia (be, have, go, get, make...) no sigue la regla -ed — cada uno cambia de forma a su manera y hay que memorizarlos. La buena noticia: son justamente los más usados en conversación real, así que se refuerzan solos con la práctica diaria.",r:"Cambian de forma; se memorizan",f:"go → went → gone",ex:"be, have, take, see, eat, go, come, make, get, give, know, think",exs:[
  {en:"I went to the store.",ipa:"/aɪ wɛnt tə ðə stɔr/",es:"Fui a la tienda."},
  {en:"She has taken the bus all year.",ipa:"/ʃi hæz ˈteɪkən ðə bʌs ɔl jɪr/",es:"Ella ha tomado el autobús todo el año."},
  {en:"They ate before coming.",ipa:"/ðeɪ eɪt bɪˈfɔr ˈkʌmɪŋ/",es:"Ellos comieron antes de venir."}]},
 {t:"Auxiliares",mini:"Be, do y have (más los modales, ver más abajo) no llevan significado propio en esta función — solo 'ayudan' al verbo principal a formar preguntas, negaciones y tiempos compuestos. Reconocer cuándo un verbo actúa como auxiliar te dice cuál se conjuga y cuál se queda en su forma base.",r:"Ayudan a formar tiempos, negación y preguntas",f:"be / do / have + verbo",ex:"Do you know? · She is coming. · Have you eaten?",exs:[
  {en:"Do you know her?",ipa:"/du ju noʊ hɜr/",es:"¿La conoces?"},
  {en:"She is working right now.",ipa:"/ʃi ɪz ˈwɜrkɪŋ raɪt naʊ/",es:"Ella está trabajando ahora."},
  {en:"Have you eaten?",ipa:"/hæv ju ˈitən/",es:"¿Has comido?"}]},
 {t:"Principales (lexical)",mini:"Todo verbo en inglés es, o un <b>auxiliar</b> (be/do/have cuando ayudan a otro verbo, y los modales) o un <b>verbo principal</b> (también llamado 'lexical'): el que realmente dice qué pasa — like, agree, want, work, believe... A diferencia del español, donde 'Trabajas' se convierte en '¿Trabajas?' solo con la entonación, un verbo principal en inglés NO puede invertirse con el sujeto por sí solo para formar preguntas o negaciones. El inglés necesita 'pedir prestado' un auxiliar vacío de significado: <b>do/does/did</b> — el mismo mecanismo ya visto en la sección de Interrogativo. Más detalle y reglas al final de esta tarjeta.",r:"Llevan el significado real de la oración — no ayudan a nada, ELLOS son la acción o el estado",f:"S + V(principal) · Q/Neg: do/does/did + S + V(base)",ex:"like, agree, want, need, work, believe, love, hate, know, think, seem",exs:[
  {en:"Do you like coffee?",ipa:"/du ju laɪk ˈkɔfi/",es:"¿Te gusta el café?"},
  {en:"She doesn't agree with the plan.",ipa:"/ʃi ˈdʌzənt əˈɡri wɪð ðə plæn/",es:"Ella no está de acuerdo con el plan."},
  {en:"I don't need your help right now.",ipa:"/aɪ doʊnt nid jɔr hɛlp raɪt naʊ/",es:"No necesito tu ayuda ahora mismo."}]},
 {t:"Modales",mini:"Los modales (can, could, must, should, will, would, might, shall, may) expresan la actitud del hablante — posibilidad, obligación, permiso, consejo — no una acción en sí. Nunca cambian de forma (✗ 'he cans', ✗ 'canned') y siempre van seguidos del verbo en su forma base, sin 'to'.",r:"Nunca cambian; van con verbo base sin <i>to</i>",f:"modal + V(base)",ex:"can, could, must, should, might, will, would, shall, may",exs:[
  {en:"You should rest.",ipa:"/ju ʃʊd rɛst/",es:"Deberías descansar."},
  {en:"Can I help you?",ipa:"/kæn aɪ hɛlp ju/",es:"¿Puedo ayudarte?"},
  {en:"We must leave now.",ipa:"/wi mʌst liv naʊ/",es:"Debemos irnos ahora."}]},
 {t:"De acción (dynamic)",mini:"Los verbos dinámicos describen algo que ocurre en el tiempo, con principio y fin — por eso, a diferencia de los stative (ver más abajo), sí aceptan el tiempo continuo sin ningún problema: 'She is running' es perfectamente natural, mientras que el equivalente con un stative ('She is knowing') no lo es.",r:"Admiten todas las formas",f:"run → running",ex:"run, build, write, cook, play, drive, sing, dance, travel",exs:[
  {en:"She is running fast.",ipa:"/ʃi ɪz ˈrʌnɪŋ fæst/",es:"Ella está corriendo rápido."},
  {en:"He writes every morning.",ipa:"/hi raɪts ˈɛvri ˈmɔrnɪŋ/",es:"Él escribe todas las mañanas."},
  {en:"They are building a house.",ipa:"/ðeɪ ɑr ˈbɪldɪŋ ə haʊs/",es:"Están construyendo una casa."}]},
 {t:"Transitivos",mini:"Un verbo transitivo necesita un objeto directo para que la oración tenga sentido completo — 'She bought' se siente incompleto hasta que agregas QUÉ compró. Muchos verbos en inglés son transitivos e intransitivos a la vez, según el contexto (compara con la categoría siguiente).",r:"Requieren objeto directo",f:"S + V + objeto",ex:"She bought <u>a car</u>. · He loves <u>her</u>. · They ate <u>the cake</u>.",exs:[
  {en:"She bought a car.",ipa:"/ʃi bɔt ə kɑr/",es:"Ella compró un carro."},
  {en:"He loves her.",ipa:"/hi lʌvz hɜr/",es:"Él la ama."},
  {en:"They ate the cake.",ipa:"/ðeɪ eɪt ðə keɪk/",es:"Ellos comieron el pastel."}]},
 {t:"Intransitivos",mini:"Un verbo intransitivo se basta a sí mismo — no necesita, ni admite, un objeto directo después. 'He sleeps' ya es una oración completa; agregarle un objeto directo ('He sleeps the bed') no tiene sentido gramatical en inglés.",r:"No llevan objeto",f:"S + V",ex:"He sleeps. · The baby cried. · She arrived. · Birds fly.",exs:[
  {en:"He sleeps eight hours.",ipa:"/hi slips eɪt ˈaʊərz/",es:"Él duerme ocho horas."},
  {en:"The baby cried.",ipa:"/ðə ˈbeɪbi kraɪd/",es:"El bebé lloró."},
  {en:"She arrived late.",ipa:"/ʃi əˈraɪvd leɪt/",es:"Ella llegó tarde."}]},
 {t:"Copulativos (linking)",mini:"Los verbos copulativos no describen una acción — conectan el sujeto con una descripción o estado (un adjetivo o sustantivo) sin que 'pase' nada. Por eso lo que sigue no es un objeto, es un atributo del propio sujeto: 'She seems tired' no dice que ella hizo algo, describe cómo está ella.",r:"Unen sujeto con atributo",f:"S + V + adjetivo/sustantivo",ex:"seem, become, feel, look, taste, smell, sound, appear, turn",exs:[
  {en:"She seems tired.",ipa:"/ʃi simz ˈtaɪərd/",es:"Ella parece cansada."},
  {en:"The food smells great.",ipa:"/ðə fud smɛlz ɡreɪt/",es:"La comida huele delicioso."},
  {en:"He became a doctor.",ipa:"/hi bɪˈkeɪm ə ˈdɑktər/",es:"Él se volvió doctor."}]},
 {t:"Stative (de estado)",mini:"Los verbos de estado (stative) casi nunca van en tiempo continuo porque describen algo constante, no una acción en progreso: ✗ 'I am knowing the answer' → ✓ 'I know the answer'. Se dividen en 4 grupos según qué tipo de estado describen — ver el desglose al final de esta tarjeta.",r:"Describen un estado constante, no una acción en progreso — casi nunca van en tiempo continuo",f:"S + V(estado) — nunca V-ing",ex:"love, know, believe, want, see, have, hate, understand",exs:[
  {en:"I know the answer.",ipa:"/aɪ noʊ ðə ˈænsər/",es:"Sé la respuesta."},
  {en:"She loves classical music.",ipa:"/ʃi lʌvz ˈklæsɪkəl ˈmjuzɪk/",es:"Ella ama la música clásica."},
  {en:"This belongs to my father.",ipa:"/ðɪs bɪˈlɔŋz tə maɪ ˈfɑðər/",es:"Esto le pertenece a mi padre."}]}
];
D.mainVerbNote="Todo verbo en inglés es, o un <b>auxiliar</b> (be/do/have cuando ayudan a otro verbo, y los modales) o un <b>verbo principal</b> (también llamado 'lexical'): el que realmente dice qué pasa — like, agree, want, work, believe... A diferencia del español, donde 'Trabajas' se convierte en '¿Trabajas?' solo con la entonación, un verbo principal en inglés NO puede invertirse con el sujeto por sí solo para formar preguntas o negaciones. El inglés necesita 'pedir prestado' un auxiliar vacío de significado: <b>do/does/did</b> — el mismo mecanismo ya visto en la sección de Interrogativo.";
D.mainVerbRules=[
 "Afirmativo: sujeto + verbo principal conjugado normalmente. <i>She agrees. · They like pizza.</i>",
 "Pregunta: DO/DOES/DID + sujeto + verbo principal en forma BASE (pierde la -s o el pasado). <i>Does she agree?</i> — no ✗ <i>Does she agrees?</i>",
 "Negación: sujeto + DON'T/DOESN'T/DIDN'T + verbo principal en forma BASE. <i>They don't like pizza.</i> — no ✗ <i>They don't likes pizza.</i>",
 "Excepción única: <b>BE</b> es el único verbo que funciona como principal Y auxiliar a la vez — nunca necesita do-support. <i>Is she tired?</i> — no ✗ <i>Does she be tired?</i>"
];
D.irregularPatternsNote="Los verbos irregulares no son tan aleatorios como parecen: se agrupan en familias reconocibles, algunas por ESTRUCTURA (cuántas de las 3 formas cambian) y otras por SONIDO (la vocal cambia siempre de la misma manera). Los grupos de sonido son subconjuntos de los de estructura — el mismo verbo puede aparecer en dos tablas, vistas desde dos ángulos distintos. Memorizar por sonido suele ser más rápido que memorizar por estructura, porque el oído reconoce el patrón sin pensar.";

 {k:"iau",title:"Sonido: i → a → u",rule:"El patrón de sonido más citado en inglés — la vocal de la base, el pasado y el participio siempre cambian en ese mismo orden (i, luego a, luego u), sin importar la palabra. Es un conjunto cerrado y pequeño: son prácticamente todos los verbos que existen con este patrón exacto — dominar estos 9 es dominar el patrón completo.",verbs:[
  {v:"sing",past:"sang",part:"sung",ipa:"/sɪŋ/",es:"cantar",ex:"She sang beautifully.",exIpa:"/ʃi sæŋ ˈbjutəfəli/",exEs:"Cantó hermosamente."},
  {v:"drink",past:"drank",part:"drunk",ipa:"/drɪŋk/",es:"beber",ex:"He drank all the water.",exIpa:"/hi dræŋk ɔl ðə ˈwɔtər/",exEs:"Se bebió toda el agua."},
  {v:"swim",past:"swam",part:"swum",ipa:"/swɪm/",es:"nadar",ex:"They swam in the lake.",exIpa:"/ðeɪ swæm ɪn ðə leɪk/",exEs:"Nadaron en el lago."},

  {v:"begin",past:"began",part:"begun",ipa:"/bɪˈɡɪn/",es:"empezar",ex:"The movie began late.",exIpa:"/ðə ˈmuvi bɪˈɡæn leɪt/",exEs:"La película empezó tarde."},
  {v:"sink",past:"sank",part:"sunk",ipa:"/sɪŋk/",es:"hundirse",ex:"The boat sank slowly.",exIpa:"/ðə boʊt sæŋk ˈsloʊli/",exEs:"El barco se hundió lentamente."},
  {v:"shrink",past:"shrank",part:"shrunk",ipa:"/ʃrɪŋk/",es:"encogerse",ex:"My sweater shrank in the wash.",exIpa:"/maɪ ˈswɛtər ʃræŋk ɪn ðə wɑʃ/",exEs:"Mi suéter se encogió en el lavado."},
  {v:"spring",past:"sprang",part:"sprung",ipa:"/sprɪŋ/",es:"saltar, brotar",ex:"He sprang out of bed.",exIpa:"/hi spræŋ aʊt ʌv bɛd/",exEs:"Saltó de la cama."},
  {v:"stink",past:"stank",part:"stunk",ipa:"/stɪŋk/",es:"apestar",ex:"The fridge stank of old fish.",exIpa:"/ðə frɪdʒ stæŋk ʌv oʊld fɪʃ/",exEs:"El refrigerador apestaba a pescado viejo."}
 ]},
 {k:"oughtaught",title:"Sonido: -ought / -aught",rule:"Subgrupo de 'pasado = participio' (arriba) unido por el mismo final de sonido /ɔt/, escrito -ought o -aught según el verbo. También es un conjunto pequeño y cerrado — estos 7 son prácticamente todos.",verbs:[

  {v:"think",past:"thought",part:"thought",ipa:"/θɪŋk/",es:"pensar",ex:"We thought it was a joke.",exIpa:"/wi θɔt ɪt wʌz ə dʒoʊk/",exEs:"Pensamos que era broma."},
  {v:"catch",past:"caught",part:"caught",ipa:"/kætʃ/",es:"atrapar, contagiarse de",ex:"He caught a cold.",exIpa:"/hi kɔt ə koʊld/",exEs:"Se resfrió."},

 ]},
 {k:"owewown",title:"Sonido: ow → ew → own",rule:"Subgrupo de 'las 3 formas distintas' (arriba): la base termina en un sonido tipo 'ow', el pasado cambia a 'ew', y el participio agrega '-own'. Conjunto pequeño y cerrado.",verbs:[

D.edSoundsIntro="\"Sordo\" y \"sonoro\" se refieren a si las cuerdas vocales vibran o no al pronunciar un sonido — no a la letra escrita, sino al <b>sonido real</b> con el que termina el verbo. Prueba tocarte la garganta: al decir /s/ (sordo) no sientes vibración; al decir /z/ (sonoro) sí sientes un zumbido. La clasificación completa de sonidos sonoros/sordos está en la sección de IPA y sonidos. La regla de -ed se reduce a comparar el ÚLTIMO SONIDO del verbo, no su última letra.";

D.vowelPairsNote="La 'e larga' que esperarías como en español en realidad se convierte en el sonido /iː/ (he, me, be) — ver el bloque de la I. Y el sonido corto que esperarías para la O (como en 'hot') es en realidad /ɒ/ — ver el bloque de la A, porque al oído hispano suena más a 'a' que a 'o'. Dos sonidos más no vienen de una vocal fija: /ɜː/ (bird, her — vocal de 'er', larga) y la <b>schwa /ə/</b> (about, sofa) — el sonido más común del inglés: toda vocal átona tiende a colapsar en schwa, sin importar qué letra esté escrita.";

D.consVoice="Sonoras (las cuerdas vocales vibran): b, d, ɡ, v, ð, z, ʒ, dʒ, m, n, ŋ, l, r, j, w — todas las nasales/líquidas/glides son sonoras. Sordas (sin vibración): p, t, k, f, θ, s, ʃ, tʃ, h. Truco para sentirlo: toca tu garganta al decir 'z' (vibra) vs 's' (no vibra) — son el mismo punto y modo, solo cambia la sonoridad.";

D.schwaPrefixNote="Regla: cuando un prefijo o primera sílaba de una palabra NO lleva el acento tónico, su vocal casi siempre se reduce a <b>schwa /ə/</b> — sin importar qué letra esté escrita. Por eso 'con-' en 'confuse' se oye como /kən/ y no como 'con' en español. Esta es la razón #1 por la que leer inglés 'como se escribe' suena forzado.";

D.saxonNote="Se usa normalmente con <b>personas, animales y tiempo</b> (Peter's house, the dog's bone, today's news). Para objetos y cosas sin vida se prefiere <b>'of'</b>: no 'the table's leg' sino <b>the leg of the table</b>. La pronunciación de la 's sigue la misma regla que el plural: /s/, /z/ o /ɪz/ según el sonido final de la palabra.";

D.subjQuestNote="Cuando la palabra interrogativa (<b>who, what, which</b>) pregunta por el <b>SUJETO</b> de la oración — no por el objeto — NO se usa do/does/did: el orden se queda igual que en una afirmación, <span class=\"formula\">Wh-word + verbo + objeto</span>, tal como Sujeto + verbo + objeto. Truco para distinguirlas: si puedes responder con 'Someone + verbo' (sujeto desconocido, sin auxiliar en la respuesta), es pregunta al sujeto; si respondes 'Sujeto conocido + verbo + something' (objeto desconocido), es pregunta al objeto, y ESA sí lleva do/does/did.";

D.contrCatNote="Clasificación: <b>sujeto+verbo</b> (I'm, he's) fusiona pronombre y auxiliar; <b>negación</b> fusiona verbo/auxiliar y 'not'; <b>dobles</b> fusionan AMBAS cosas a la vez (modal+not+have en una sola palabra hablada); <b>habladas informales</b> nunca se escriben en textos formales; <b>no estándar</b> son gramaticalmente 'incorrectas' pero universales en el habla real.";

D.contrExNote="Estas contracciones tienen más de un significado posible — el contexto es lo único que las distingue al oído. Aquí cada una en una oración real, para ver cómo se resuelve la ambigüedad en la práctica.";
D.aintNote="<b>ain't</b> es la contracción comodín no estándar: sustituye am not/is not/are not/has not/have not según el contexto. Se oye constantemente en habla cotidiana, canciones, cine y dialectos — pero se evita en exámenes, correos profesionales, textos académicos y entrevistas de trabajo. En los dialectos donde se usa (ej. sur de EE.UU., AAVE) también es común la <b>doble negación</b>: <i>I ain't got no money</i> (literalmente 'no tengo ningún dinero' — dos negativos que refuerzan uno solo, no se cancelan). En inglés estándar esa misma idea es <i>I don't have any money</i>, con un solo negativo.";

D.doubleContrNote="Así se ve la MISMA oración en sus 3 niveles de contracción — de más formal a más hablada. La doble contracción ('shouldn't've') es válida al hablar y hasta en mensajes informales, pero rara vez se usa en escritura formal.";

/* 19 · Habla conectada (Connected Speech) */
D.connected=[
 {n:"Content words vs. Function words (por qué unas palabras se reducen y otras no)",ipa:"—",r:"Esta es la regla MADRE de toda la sección: las <b>content words</b> (sustantivos, verbos principales, adjetivos, adverbios — las que cargan el significado) casi nunca se reducen ni pierden sonidos. Las <b>function words</b> (artículos, preposiciones, pronombres, auxiliares: a, the, to, of, him, have, does, is...) sí se reducen, casi siempre a schwa o desaparecen — son 'pegamento' gramatical, no información nueva. Todas las reglas de abajo (flapping, h-dropping, elisión...) le pasan casi siempre a function words, casi nunca a content words.",ex:[["I WANT the BOOK","/aɪ wɑnt ðə bʊk/","quiero el libro — 'want' y 'book' (content) suenan completas y claras; 'the' (function) se reduce a schwa apenas audible"]]},
 {n:"Flapping / Alveolar Tap (la \"flat T\" — y también la D)",ipa:"/ɾ/",r:"En inglés americano, tanto la <b>T</b> como la <b>D</b> entre una vocal y una vocal SIGUIENTE ÁTONA (sin acento) suenan igual: como una D rápida, casi como la 'r' suave del español (pero, cara). Patrón: <b>vocal + T/D + vocal átona</b>. Por eso 'did I' y 'city' usan el MISMO sonido aunque una tenga D y la otra T en la ortografía. <b>Cuándo NO se aplica</b> (la T se queda fuerte y clara): al inicio de palabra (time, take), justo antes de una sílaba ACENTUADA (attack, retain — no átona) y después de <b>S</b> (stop, student). <b>Con N delante (patrón NT)</b> la T se debilita todavía más y casi desaparece, fundiéndose con la N: twenty→'tweny', internet→'innernet', winter→casi 'winner' — técnicamente es una mezcla de flap y reducción, no un flap puro.",ex:[["water","/ˈwɔɾər/","agua (T suena como 'd/r' rápida)"],["better","/ˈbɛɾər/","mejor"],["city","/ˈsɪɾi/","ciudad"],["a lot of","/ə ˈlɑɾ əv/","mucho de"],["did I","/ˈdɪɾaɪ/","(la D de 'did' flapea igual que una T) — suena 'ríai'"],["already did it","/ɔlˈrɛɾi ˈɾɪɾ ɪt/","ya lo hice — dos flaps seguidos, suena 'ardy ríri' o 'ardy did it' según velocidad"],["writer / rider","/ˈraɪɾər/","escritor / jinete — con flap T y D suenan IGUAL: sin contexto no se distinguen al oído"],["time","/taɪm/","tiempo — T al inicio de palabra, SIN flap, se mantiene fuerte"],["attack","/əˈtæk/","atacar — T antes de sílaba acentuada, SIN flap"],["stop","/stɑp/","detener — T después de S, SIN flap, nunca"],["twenty","/ˈtweni/","veinte — patrón NT, la T casi desaparece"],["winter","/ˈwɪnər/","invierno — patrón NT, suena casi igual que 'winner' (ganador)"]]},
 {n:"Yod-coalescence (D + Y → /dʒ/)",ipa:"/dʒ/",r:"Cuando una palabra termina en <b>d</b> y la siguiente empieza con <b>you/your</b>, se fusionan en el sonido 'y' de 'llegar' fuerte, igual que el de 'jump'.",ex:[["Would you","/wʊdʒə/","¿Podrías...?"],["Did you","/dɪdʒə/","¿Hiciste...?"],["Could you","/kʊdʒə/","¿Podrías...?"]]},
 {n:"Yod-coalescence (T + Y → /tʃ/)",ipa:"/tʃ/",r:"Mismo fenómeno que arriba pero con <b>t</b>: t + you = sonido 'ch' de 'chair'.",ex:[["Don't you","/doʊntʃə/","¿No... verdad?"],["Won't you","/woʊntʃə/","¿No querrás...?"],["Can't you","/kæntʃə/","¿No puedes...?"]]},
 {n:"Affrication de TR/DR (TR≈CH, DR≈J)",ipa:"/tʃr/ /dʒr/",r:"El grupo <b>tr</b> al inicio de palabra suena parecido a 'ch' + r, y <b>dr</b> suena parecido a 'j' (inglesa) + r. Es automático, no un error.",ex:[["train","/tʃreɪn/","tren (suena 'chrein')"],["truck","/tʃrʌk/","camión"],["dragon","/dʒræɡən/","dragón (suena 'jragon')"],["drive","/dʒraɪv/","conducir"]]},
 {n:"Linking (enlace consonante+vocal)",ipa:"‿",r:"Si una palabra termina en consonante y la siguiente empieza en vocal, se pronuncian como una sola palabra.",ex:[["turn it off","/ˈtɜr nɪ ˈɾɔf/","apagarlo (fluye como una palabra)"],["an apple","/ə ˈnæpəl/","una manzana"]]},
 {n:"Elision (caída de /t/ /d/ /k/ en racimos)",ipa:"∅",r:"Cualquier consonante oclusiva (t, d, k, p...) que quede EN MEDIO de tres o más consonantes seguidas tiende a desaparecer al hablar rápido — no solo t/d, también <b>k</b>.",ex:[["next day","/ˈnɛks deɪ/","al día siguiente (la 't' de next casi no suena)"],["most people","/ˈmoʊs ˈpipəl/","la mayoría de la gente"],["asked","/æst/","preguntó/pregunté — la 'k' entre s y t desaparece: /æskt/ → /æst/"]]},
 {n:"Cadena completa: elisión + yod-coalescence juntas",ipa:"/tʃ/",r:"Las reglas de esta sección se combinan entre sí. 'Asked you' pasa por DOS pasos: primero la <b>k</b> desaparece (elision, arriba: askt→ast), y luego la t+y restante se funde en /tʃ/ (yod-coalescence, ya visto arriba). El resultado final no se parece nada a la ortografía.",ex:[["asked you","/æstʃu/","te pregunté — 'asked' /æskt/ → 'ast' /æst/ → fusión con 'you' → /æstʃu/ (informalmente 'aschu')"]]},
 {n:"TH-deletion en palabras átonas (that, them, there)",ipa:"∅",r:"Cuando 'that/them/there' NO llevan el acento de la frase (van 'de paso', no son la palabra importante), la <b>/ð/</b> inicial puede desaparecer por completo en habla muy rápida — sobre todo pegada a otra consonante.",ex:[["does that","/dʌz æt/","¿eso...? — 'that' pierde su 'th' y suena 'at'"],["how does that work","/haʊ dəz æt wɜrk/","¿cómo funciona eso? — suena como 'how dz at work'"],["get them","/ɡɛt əm/","consíguelos — 'them' se reduce a 'em', sin th"]]},
 {n:"Elisión de D antes de T (supposed to → supposta)",ipa:"∅",r:"Cuando una palabra termina en <b>-sed/-zed</b> y la siguiente empieza en <b>t</b>, la D intermedia desaparece y las dos palabras casi se funden en una.",ex:[["supposed to","/səˈpoʊstə/","se supone que debo — suena 'supposta', muy común en habla rápida"],["used to","/ˈjustə/","solía — mismo patrón (ver también sección de Palabras que se confunden, trío 'used to')"]]},
 {n:"H-dropping (caída de la H átona)",ipa:"∅",r:"Los pronombres y auxiliares átonos <b>her, him, his, have, has, had, he</b> pierden la <b>/h/</b> en habla rápida cuando van DESPUÉS de otra palabra (no al inicio de la oración). No es una contracción escrita, es solo pronunciación relajada. 'Who' es un caso aparte: NUNCA pronuncia su H, en cualquier registro — no es h-dropping casual, es regla fija (ver también sección de Letras mudas).",ex:[["let her know","/lɛt ər noʊ/","avísale (a ella) — suena 'let 'er know'"],["tell him","/tɛl ɪm/","dile (a él) — suena 'tell 'im'"],["ask her","/æsk ər/","pregúntale (a ella)"],["I should have gone","/aɪ ʃʊd əv ɡɔn/","debí haber ido — 'have' pierde la H y suena como 'of'"],["what has he done","/wʌt əz i dʌn/","qué ha hecho — 'has' y 'he' pierden la H: suena 'wədəzi dʌn'"],["what happened","/ˈwʌʔn̩t/","qué pasó — en habla muy rápida hasta 'happened' puede perder rastro de H tras la W"]]},
 {n:"G-dropping (-ing → -in', /ŋ/ → /n/)",ipa:"/n/",r:"La terminación <b>-ing</b> en habla informal cambia su sonido final de /ŋ/ (nasal velar, 'ng') a /n/ (nasal alveolar, como en español). Se escribe a veces 'waitin', doin', goin'' para representarlo. Es una de las señales más claras de habla casual/informal en inglés americano.",ex:[["waiting","/ˈweɪtɪn/","esperando — suena 'waitin''"],["doing","/ˈduɪn/","haciendo — suena 'doin''"],["snapping","/ˈsnæpɪn/","tronando — suena 'snappin''"]]},
 {n:"I'm gonna → I'ma (doble reducción)",ipa:"/aɪmə/",r:"'Gonna' (ya visto arriba) a veces se reduce TODAVÍA MÁS en habla muy casual/canciones/rap: 'I'm gonna' completo se funde en 'I'ma', perdiendo casi toda huella de 'going to'.",ex:[["I'm gonna start","/aɪmə stɑrt/","voy a empezar — 'I'm gonna' → 'I'ma', muy común en letras de canciones"]]},
 {n:"Cadena larga: varias reglas encimadas en una frase real",ipa:"—",r:"Así se ve cuando 4-5 reglas de esta sección actúan JUNTAS en una sola frase — esto es lo que hace que el inglés hablado real suene tan distinto del escrito.",ex:[["what does it have to do with...","/wə dəz ɪɾ æv tə du wɪð/","¿qué tiene que ver eso con...? — 'does' se reduce (function word), 'it' flapea con lo siguiente, 'have' pierde la H (h-dropping)"],["gives it away","/ˈɡɪvz ɪɾ əˈweɪ/","lo delata — 'it' flapea entre 'gives' y 'away' (flapping + linking)"]]},
 {n:"Glide de enlace /w/ o /j/ (entre dos vocales)",ipa:"/w/ /j/",r:"Cuando una palabra termina en vocal y la siguiente empieza en vocal, el inglés inserta un sonido de transición casi imperceptible: <b>/w/</b> si la primera vocal es redondeada (u, o), <b>/j/</b> (como 'y') si es i/e.",ex:[["go on","/ɡoʊ w ɑn/","seguir — suena 'go-w-on'"],["see it","/si j ɪt/","verlo — suena 'see-y-it'"],["I asked","/aɪ j æskt/","pregunté — suena 'I-y-asked'"]]},
 {n:"Yod-coalescence DENTRO de una palabra (DU → /dʒu/)",ipa:"/dʒu/",r:"Mismo fenómeno que 'would you' pero ya fusionado dentro de una sola palabra: la combinación <b>-du-</b> se pronuncia con el sonido de 'j' inglesa (como en jump), no como 'du' suelto.",ex:[["education","/ˌɛdʒʊˈkeɪʃən/","educación"],["individual","/ˌɪndɪˈvɪdʒuəl/","individual"],["graduate","/ˈɡrædʒueɪt/","graduarse / graduado"],["procedure","/prəˈsidʒər/","procedimiento"],["module","/ˈmɑdʒul/","módulo"]]},
 {n:"Syncope (una sílaba átona desaparece)",ipa:"∅",r:"Una sílaba completa sin acento, en medio de la palabra, se come al hablar rápido — la palabra que 'debería' tener 3 sílabas suena como 2. Se llama <b>syncope</b>. No es error del hablante nativo, es la norma.",ex:[["different","/ˈdɪfrənt/","diferente — suena 'diffrent', no 'di-fe-rent'"],["every","/ˈɛvri/","cada — suena 'evry', no 'e-ve-ry'"],["chocolate","/ˈtʃɑklət/","chocolate — suena 'choc-lit', no 'cho-co-late'"],["camera","/ˈkæmrə/","cámara — suena 'cam-ra'"],["family","/ˈfæmli/","familia — suena 'fam-ly'"],["comfortable","/ˈkʌmftərbəl/","cómodo — suena 'comf-ta-ble', no 4 sílabas"],["already","/ɔlˈrɛdi/ → /ˈɑrdi/","ya — en habla muy rápida pierde su segunda sílaba y suena 'ardy'"]]}
];

D.wishHopeNote="'Wish' y 'hope' NO son intercambiables aunque ambos se traduzcan como 'esperar/desear'. <b>Hope</b> se usa para algo que todavía es posible (igual de 'real' que el 1er condicional, sección arriba). <b>Wish</b> se usa para algo hipotético, contrario a la realidad actual o pasada (misma lógica que el 2º y 3er condicional: pasado simple = presente irreal, pasado perfecto = pasado irreal). Por eso 'wish' vive en esta sección y no en collocations o chunks.";

D.usedToRule="¿Por qué 2 de los 3 llevan gerundio y el primero no? Porque el 'to' cambia de función: en 'used to + V(base)' es parte de un verbo modal-like (no es preposición). En 'be/get used to', <b>'to' SÍ es preposición</b> — y como ya viste en la sección de Gerundios, después de preposición SIEMPRE va gerundio, nunca infinitivo. Es la misma regla de oro, aplicada aquí.";
D.suchRule="Estos 3 son intercambiables en significado ('tan') — lo único que cambia es si hay sustantivo después y si es contable singular. Regla rápida: ¿hay sustantivo? → such (a). ¿No hay sustantivo? → so. Otros 2 usos de 'such' que NO son este mismo patrón: <b>such as</b> = como, por ejemplo (<i>fruits such as apples</i> — frutas como las manzanas) y <b>no such</b> = no existe tal (<i>There is no such thing as perfect</i> — no existe tal cosa como la perfección).";
D.confusNote="Estas parejas/tríos no son homófonas (sección de Homófonas) porque casi nunca suenan exactamente igual, ni son falsos amigos (sección de Falsos amigos) porque no chocan con el español — se confunden entre sí en inglés por su parecido visual o porque comparten la misma raíz con función gramatical distinta. La categoría en inglés se llama <b>confusable words</b>.";

/* Verbos divididos — un verbo en español se separa en 2 o 3 en inglés, cada uno con su propia regla */
D.vsplitNote="El español a veces usa <b>un solo verbo</b> para varias acciones que el inglés distingue con palabras distintas, cada una con su propia regla. No es que el inglés sea más complicado: cada verbo marca algo específico (quién recibe la acción, si el movimiento es hacia ti o lejos de ti, si la percepción es pasiva o activa...) que en español el contexto resuelve solo. La clave para no confundirlos nunca es la misma: pregúntate <b>cuál es la regla que los separa</b>, no memorices una traducción 1 a 1.";

 ["Enfermarse de","I got a cold last week.","Me resfrié la semana pasada."],
 ["Comprar (informal)","Can you get some milk?","¿Puedes comprar leche?"],
 ["Contestar (teléfono/puerta)","I'll get the door.","Yo abro la puerta."],
 ["Causativo: lograr que alguien haga algo","I got him to help me.","Logré que me ayudara."],
 ["Causativo: mandar a hacer algo (get + objeto + V3)","I got my car fixed.","Mandé a arreglar mi carro."],
 ["Recibir","I got a text from her.","Recibí un mensaje de ella."]
];
D.getPhrasalRef="Además de estos usos, GET forma muchísimos verbos frasales que ya viste en la sección de Verbos frasales: <b>get along</b> (llevarse bien), <b>get on/off</b> (subir/bajar), <b>get over</b> (superar), <b>get down to</b> (ponerse manos a la obra), y en la sección de Palabras que se confunden, <b>get used to</b> (acostumbrarse). Esta sección cubre los usos de GET solo, sin partícula.";

/* SET y WOULD - datos para subsecciones dentro de Tipos de verbos */
D.setUses=[
 ["Poner / colocar (en su lugar)","Please set the vase on the shelf.","Por favor pon el jarrón en el estante."],
 ["Establecer / fijar (precio, fecha, regla, límite)","They set a new deadline for Friday.","Fijaron una nueva fecha límite para el viernes."],
 ["Configurar / ajustar (alarma, temperatura, dispositivo)","Did you set the alarm for 6 am?","¿Configuraste la alarma para las 6 am?"],
 ["Poner la mesa","Can you help me set the table?","¿Me ayudas a poner la mesa?"],
 ["Establecer récord / ejemplo / estándar","She set a new world record in 2023.","Estableció un nuevo récord mundial en 2023."],
 ["Asignar / encargar (tarea, deberes)","The teacher set a lot of homework for the weekend.","El profesor asignó mucha tarea para el fin de semana."],
 ["Ambientar (una historia) / estar situado","The novel is set in Oaxaca in the 1980s.","La novela está ambientada en Oaxaca en los 80."],
 ["Puesta de sol / ponerse (intransitivo - el sol)","The sun sets at 7:30 pm in summer.","El sol se pone a las 7:30 pm en verano."],
 ["Cuajar / endurecerse / fraguar (gelatina, cemento)","Leave the jelly in the fridge to set.","Deja la gelatina en el refri para que cuaje."],
 ["Hacer que quede en un estado (set + adj)","They set the prisoner free.","Liberaron al prisionero."],
 ["Como adjetivo: fijo / sustantivo: plató, juego, conjunto","It's a set phrase. / The film set was huge.","Es una frase hecha. / El set era enorme."]
];
D.setPhrasalRef="SET también forma phrasal verbs: <b>set up</b> (montar), <b>set off</b> (partir), <b>set out</b> (proponerse), <b>set aside</b> (reservar), <b>set back</b> (retrasar).";
D.setNote="SET es opuesto de GET: GET=obtener/cambiar, SET=fijar/colocar. Irregular: <b>set - set - set</b>. Transitivo necesita objeto. Intransitivo solo: sol y cuajar.";

D.wouldUses=[
 ["1. Condicional / Hipotético","If I won the lottery, I would travel around the world.","Si ganara la lotería, viajaría por el mundo.","If I had more time, I would learn to play the piano.","Si tuviera más tiempo, aprendería a tocar el piano."],
 ["2. Peticiones educadas","Would you mind closing the window?","¿Te importaría cerrar la ventana?","Would you help me carry these boxes?","¿Me ayudarías a cargar estas cajas?"],
 ["3. Deseo suave: would like / would rather","I would like a coffee, please.","Me gustaría un café, por favor.","I would rather walk than take the bus.","Preferiría caminar que tomar el autobús."],
 ["4. Hábitos en el pasado","When I was a kid, we would play soccer until dark.","Cuando era niño, jugábamos fútbol hasta oscurecer.","Every summer, we would visit our grandparents.","Cada verano, visitábamos a nuestros abuelos."],
 ["5. Futuro en el pasado","She said she would call later.","Ella dijo que llamaría más tarde.","He promised he would finish the project on time.","Prometió que terminaría el proyecto a tiempo."]
];
D.wouldNote="WOULD es pasado de WILL, uso principal hoy: cortesía e hipótesis. Fórmula: <b>would + verbo base</b> nunca to. Contracción I'd, you'd. Negación wouldn't. En if-clause nunca uses would.";
D.wouldExtra=[
 ["would like = me gustaría","I would like to book a table for two.","Quisiera reservar mesa para dos."],
 ["would rather = preferiría","I would rather stay than go out.","Preferiría quedarme que salir."],
 ["wouldn't = se negó / no quiso","The car wouldn't start this morning.","El carro no quiso arrancar esta mañana."],
 ["would for past predictions","They thought it would rain.","Pensaron que llovería."]
];

/* Verbos multiuso — sección propia: verbos comodín polisémicos, modales multifunción, y BE */
D.workhorseNote="Estos verbos están entre los más usados del inglés, y precisamente por eso cargan muchísimos significados que NO tienen relación lógica entre sí — no son 'el mismo significado dicho distinto', son usos genuinamente distintos que solo comparten la misma palabra. La única forma de dominarlos es verlos todos juntos, no memorizarlos uno a uno como si aparecieran sueltos.";
D.workhorseVerbs=[
 {k:"get",label:"GET",mini:"GET es probablemente el verbo más flexible del inglés cotidiano: obtener, llegar, entender, enfermarse, convertirse... casi cualquier cambio de estado puede expresarse con GET. Irregular: get - got - gotten (US) / got (UK).",uses:D.getUses,extra:D.getPhrasalRef},
 {k:"set",label:"SET",mini:D.setNote,uses:D.setUses,extra:D.setPhrasalRef},
 {k:"have",label:"HAVE",mini:"HAVE cubre desde la posesión más simple hasta la obligación (have to) y el causativo (mandar a hacer algo) — usos sin relación entre sí que comparten la misma palabra. También es auxiliar de los tiempos perfectos (sección de Tiempos verbales).",uses:[
  ["Posesión","I have a new car.","Tengo un carro nuevo."],
  ["Obligación (have to)","I have to finish this today.","Tengo que terminar esto hoy."],
  ["Comer / tomar (comida, bebida)","We had pizza for dinner.","Cenamos pizza."],
  ["Experimentar (have + sustantivo)","She had a great time at the party.","Ella la pasó muy bien en la fiesta."],
  ["Causativo: mandar a hacer algo (have + objeto + V3)","I had my car fixed.","Mandé a arreglar mi carro."],
  ["Auxiliar de tiempos perfectos","I have already eaten.","Ya comí."],
  ["Have got = posesión informal (más británico)","I've got a plan.","Tengo un plan."],
  ["Expresiones fijas: have a look/word/chat","Let's have a quick look at this.","Echemos un vistazo rápido a esto."]
 ]},
 {k:"make",label:"MAKE",mini:"MAKE es el opuesto de DO en las collocations (sección de Collocations): DO es para actividades genéricas, MAKE es para CREAR algo o PROVOCAR un resultado. También forma el causativo 'obligar a alguien a hacer algo', sin 'to'.",uses:[
  ["Crear / fabricar","She made a beautiful cake.","Ella hizo un pastel hermoso."],
  ["Causativo: obligar (make + objeto + V base, sin to)","The movie made me cry.","La película me hizo llorar."],
  ["Make + adjetivo (poner en un estado)","This news makes me happy.","Esta noticia me hace feliz."],
  ["Make it = lograr, llegar a tiempo","We made it to the airport just in time.","Llegamos al aeropuerto justo a tiempo."],
  ["Collocations: make a decision/mistake/effort","He made a big mistake.","Cometió un gran error."],
  ["Make money","She makes good money as a designer.","Ella gana buen dinero como diseñadora."],
  ["Make sense = tener sentido","This explanation makes sense.","Esta explicación tiene sentido."]
 ]},
 {k:"do",label:"DO",mini:"DO tiene un trabajo doble: es el auxiliar vacío de significado que ya viste en Interrogativo y Negación (do/does/did), Y ADEMÁS es un verbo principal con significado propio para actividades genéricas (homework, business) — dos funciones que conviene no confundir.",uses:[
  ["Auxiliar de preguntas/negaciones","Do you like tea?","¿Te gusta el té?"],
  ["Actividades genéricas (do homework/business)","I need to do my homework.","Necesito hacer mi tarea."],
  ["Do well/badly = desempeñarse","She did really well on the test.","Le fue muy bien en el examen."],
  ["Do without = pasar sin algo","We'll have to do without coffee today.","Tendremos que pasar sin café hoy."],
  ["Do someone's hair/nails = arreglar","She's doing her nails right now.","Se está arreglando las uñas ahora mismo."],
  ["That will do = ser suficiente","Okay, that will do for now.","Bien, eso será suficiente por ahora."]
 ]},
 {k:"take",label:"TAKE",mini:"TAKE es el opuesto de BRING (ver Verbos divididos): mueve algo LEJOS del hablante. Pero además forma un número enorme de collocations fijas (take a break/shower/photo) que no tienen nada que ver con 'llevar'.",uses:[
  ["Tomar / agarrar físicamente","Take this book with you.","Llévate este libro."],
  ["Llevar (lejos del hablante — ver Verbos divididos)","I'll take you to the airport.","Te llevaré al aeropuerto."],
  ["Collocations: take a break/shower/photo","Let's take a short break.","Tomemos un descanso corto."],
  ["Take time = requerir tiempo","This project will take a few weeks.","Este proyecto tomará algunas semanas."],
  ["Take after someone = parecerse a un familiar","She takes after her mother.","Ella se parece a su madre."],
  ["Take off = despegar / quitarse ropa (frasal)","The plane took off on time.","El avión despegó a tiempo."],
  ["Take care of = cuidar","Can you take care of the kids tonight?","¿Puedes cuidar a los niños esta noche?"],
  ["Take place = suceder, ocurrir","The wedding will take place in June.","La boda será en junio."]
 ]},
 {k:"put",label:"PUT",mini:"PUT (put-put-put, irregular sin cambio) empieza con el significado más simple del inglés — colocar algo — pero forma una cantidad enorme de phrasal verbs de uso diario (put up with, put off, put on) que hay que aprender como bloques fijos.",uses:[
  ["Colocar","Put the box on the table.","Pon la caja en la mesa."],
  ["Put up with = tolerar (frasal)","I can't put up with this noise anymore.","Ya no puedo tolerar este ruido."],
  ["Put off = posponer (frasal)","They put off the meeting until Friday.","Pospusieron la reunión hasta el viernes."],
  ["Put on = ponerse ropa (frasal)","Put on your coat, it's cold.","Ponte el abrigo, hace frío."],
  ["Put someone through = conectar una llamada","I'll put you through to the manager.","Te voy a comunicar con el gerente."],
  ["Put it this way = expresarlo de cierta manera","Let me put it this way: it's complicated.","Déjame decirlo así: es complicado."]
 ]},
 {k:"go",label:"GO",mini:"GO es el verbo de movimiento por excelencia, pero 'go + adjetivo' también describe un CAMBIO DE ESTADO negativo (go bad, go crazy) — un uso muy distinto de simplemente 'ir a un lugar', y muy usado en habla cotidiana.",uses:[
  ["Movimiento","I go to school by bus.","Voy a la escuela en autobús."],
  ["Go + adjetivo = volverse (cambio de estado, casi siempre negativo)","The milk went bad.","La leche se echó a perder."],
  ["Go + gerundio = actividades","We go shopping every Saturday.","Vamos de compras cada sábado."],
  ["Be going to = futuro planeado (ver Tiempos verbales)","I'm going to call her.","Voy a llamarla."],
  ["Go with = combinar, acompañar","This tie goes with your shirt.","Esta corbata combina con tu camisa."],
  ["Go for it = intentarlo, animarse","If you want the job, go for it!","¡Si quieres el trabajo, inténtalo!"],
  ["How's it going? = saludo informal","Hey, how's it going?","Oye, ¿cómo te va?"]
 ]},
 {k:"come",label:"COME",mini:"COME es el opuesto de GO: movimiento HACIA el hablante o el punto de referencia de la conversación. Forma varios phrasal verbs de altísima frecuencia (come across, come up with) con significados que no se adivinan de las palabras sueltas.",uses:[
  ["Movimiento hacia el hablante","Come here, please.","Ven aquí, por favor."],
  ["Come across = encontrarse por casualidad (frasal)","I came across an old photo.","Me encontré una foto vieja por casualidad."],
  ["Come up with = idear (frasal)","She came up with a great idea.","Se le ocurrió una gran idea."],
  ["Come true = hacerse realidad","Her dream finally came true.","Su sueño finalmente se hizo realidad."],
  ["Come from = ser originario de","Where do you come from?","¿De dónde eres?"],
  ["Come on = ¡vamos!, ánimo (interjección)","Come on, we're going to be late!","¡Vamos, vamos a llegar tarde!"]
 ]},
 {k:"keep",label:"KEEP",mini:"KEEP (irregular: keep-kept-kept) tiene la idea central de CONTINUIDAD — mantener algo como está, o seguir haciendo algo. Casi todos sus usos, incluso los idiomáticos, se pueden rastrear a esa idea de 'no dejar que algo cambie o se detenga'.",uses:[
  ["Mantener / conservar","Keep the change.","Quédate con el cambio."],
  ["Keep + gerundio = seguir haciendo","Keep working, we're almost done.","Sigue trabajando, ya casi terminamos."],
  ["Keep an eye on = vigilar","Can you keep an eye on my bag?","¿Puedes vigilar mi bolsa?"],
  ["Keep a promise/secret","He always keeps his promises.","Él siempre cumple sus promesas."],
  ["Keep up (with) = mantener el ritmo (frasal)","It's hard to keep up with the news.","Es difícil mantenerse al día con las noticias."]
 ]},
 {k:"give",label:"GIVE",mini:"GIVE (irregular: give-gave-given) parte de 'entregar algo a alguien', pero sus phrasal verbs (give up, give in, give away) cubren desde rendirse hasta revelar un secreto — todos comparten la idea de 'soltar' algo, literal o figuradamente.",uses:[
  ["Dar","She gave him a gift.","Ella le dio un regalo."],
  ["Give up = rendirse (frasal)","Don't give up on your dreams.","No te rindas con tus sueños."],
  ["Give in = ceder (frasal)","He finally gave in and apologized.","Finalmente cedió y se disculpó."],
  ["Give away = regalar / revelar (frasal)","She gave away all her old clothes.","Regaló toda su ropa vieja."],
  ["Give a hand = ayudar","Can you give me a hand with this?","¿Me ayudas con esto?"],
  ["Give it a try = intentarlo","I've never done this before, but I'll give it a try.","Nunca he hecho esto antes, pero lo intentaré."]
 ]},
 {k:"run",label:"RUN",mini:"RUN (irregular: run-ran-run) va de lo físico (correr) a lo abstracto (dirigir un negocio, ir retrasado) sin que la lógica sea obvia a simple vista — otro caso de un verbo que hay que aprender uso por uso.",uses:[
  ["Correr (físico)","He runs five miles every morning.","Él corre cinco millas cada mañana."],
  ["Dirigir un negocio","She runs a small bakery.","Ella dirige una pequeña panadería."],
  ["Run late = ir retrasado","Sorry, I'm running late.","Perdón, voy retrasado."],
  ["Run out (of) = acabarse (frasal)","We ran out of milk.","Se nos acabó la leche."],
  ["Run into = encontrarse por casualidad (frasal)","I ran into an old friend yesterday.","Me encontré con un viejo amigo ayer."],
  ["Run in the family = ser común en la familia","Musical talent runs in the family.","El talento musical es cosa de familia."]
 ]},
 {k:"hold",label:"HOLD",mini:"HOLD (irregular: hold-held-held) empieza en 'sostener físicamente' pero se extiende a 'sostener en el tiempo' (hold true, hold up) — la idea de resistencia o permanencia conecta la mayoría de sus usos, aunque no siempre es obvio.",uses:[
  ["Sostener físicamente","Hold my hand.","Tómame de la mano."],
  ["Hold on = esperar (frasal, también al teléfono)","Hold on, I'll be right back.","Espera, ya regreso."],
  ["Hold a meeting/event = organizar","They held a meeting yesterday.","Tuvieron una reunión ayer."],
  ["Hold up = retrasar / resistir (frasal)","Traffic held us up for an hour.","El tráfico nos retrasó una hora."],
  ["Hold true = seguir siendo válido","That advice still holds true today.","Ese consejo sigue siendo válido hoy."]
 ]},
 {k:"call",label:"CALL",mini:"CALL no es solo 'llamar por teléfono' — también es 'nombrar' (they call him Tom) y forma expresiones idiomáticas (a close call, call it a day) sin relación directa con el teléfono.",uses:[
  ["Llamar por teléfono","Call me later.","Llámame más tarde."],
  ["Llamar / nombrar","They call him Tom.","Le dicen Tom."],
  ["Call off = cancelar (frasal)","They called off the wedding.","Cancelaron la boda."],
  ["Call for = requerir, exigir","This calls for a celebration.","Esto amerita una celebración."],
  ["A close call = un momento peligroso evitado por poco","That accident was a close call.","Ese accidente fue por poco."],
  ["Call it a day = terminar por hoy","Let's call it a day.","Terminemos por hoy."]
 ]},
 {k:"look",label:"LOOK",mini:"LOOK es la mitad de la tríada watch/look/see (ver Verbos divididos) — dirigir la mirada deliberadamente. Pero 'look + adjetivo' (verse, parecer) es un uso completamente distinto, y sus phrasal verbs (look for, look after, look forward to) son de los más usados del idioma.",uses:[
  ["Mirar (ver también Verbos divididos: watch/look/see)","Look at this photo.","Mira esta foto."],
  ["Look + adjetivo = verse, parecer","You look tired.","Te ves cansado."],
  ["Look like = parecerse a","She looks like her sister.","Se parece a su hermana."],
  ["Look for = buscar (frasal)","I'm looking for my keys.","Estoy buscando mis llaves."],
  ["Look after = cuidar (frasal)","Can you look after the dog?","¿Puedes cuidar al perro?"],
  ["Look forward to = esperar con ganas (frasal)","I look forward to seeing you.","Espero con ganas verte."],
  ["Look out! = ¡cuidado!","Look out! There's a car coming.","¡Cuidado! Viene un carro."]
 ]},
 {k:"break",label:"BREAK",mini:"BREAK (irregular: break-broke-broken) va de romper algo físico a 'romper' una racha, una noticia o un empate financiero — la idea de 'interrupción o quiebre' conecta la mayoría de sus usos.",uses:[
  ["Romper físicamente","He broke a glass.","Rompió un vaso."],
  ["Break a record","She broke the world record.","Ella rompió el récord mundial."],
  ["Break the news = dar una noticia (usualmente mala)","I have to break the news to him.","Tengo que darle la noticia."],
  ["Break down = descomponerse / colapsar emocionalmente (frasal)","My car broke down on the highway.","Mi carro se descompuso en la autopista."],
  ["Break even = no ganar ni perder (finanzas)","The business finally broke even this year.","El negocio finalmente no ganó ni perdió este año."],
  ["Take a break = descansar (aquí 'break' es sustantivo)","Let's take a five-minute break.","Tomemos un descanso de cinco minutos."]
 ]},
 {k:"work",label:"WORK",mini:"WORK cubre tanto 'trabajar' (la actividad) como 'funcionar' (un plan, una máquina) — dos ideas que en español SÍ se distinguen ('trabajar' vs 'funcionar') pero en inglés comparten la misma palabra.",uses:[
  ["Trabajar","I work at a hospital.","Trabajo en un hospital."],
  ["Funcionar","This plan should work.","Este plan debería funcionar."],
  ["Work out = hacer ejercicio / resultar bien (frasal)","I work out every morning.","Hago ejercicio cada mañana."],
  ["Work on = trabajar en, mejorar algo","She's working on her thesis.","Está trabajando en su tesis."],
  ["Work of art = obra (aquí 'work' es sustantivo)","This painting is a true work of art.","Esta pintura es una verdadera obra de arte."]
 ]}
];
D.modalMultiNote="Cada modal cubre varias funciones que no siempre están relacionadas entre sí — el mismo 'could' puede ser pasado de 'can', posibilidad, o simplemente cortesía, y solo el contexto lo distingue. A diferencia de los verbos comodín de arriba, los modales NUNCA cambian de forma (✗ 'coulds', ✗ 'musted') y siempre van con el verbo en forma base.";
D.multiModals=[
 {k:"would",label:"WOULD",mini:D.wouldNote,uses:[
  ["Condicional / Hipotético","If I won the lottery, I would travel around the world.","Si ganara la lotería, viajaría por el mundo."],
  ["Peticiones educadas","Would you mind closing the window?","¿Te importaría cerrar la ventana?"],
  ["Deseo suave: would like / would rather","I would like a coffee, please.","Me gustaría un café, por favor."],
  ["Hábitos en el pasado","When I was a kid, we would play soccer until dark.","Cuando era niño, jugábamos fútbol hasta oscurecer."],
  ["Futuro en el pasado","She said she would call later.","Ella dijo que llamaría más tarde."]
 ]},
 {k:"could",label:"COULD",mini:"COULD es literalmente el pasado de CAN, pero hoy se usa mucho más como posibilidad y cortesía que como 'pude' — muy pocas veces se traduce como pasado real.",uses:[
  ["Habilidad pasada (pasado de can)","I could swim when I was five.","Sabía nadar cuando tenía cinco años."],
  ["Posibilidad","It could rain later.","Podría llover más tarde."],
  ["Petición cortés","Could you help me, please?","¿Podrías ayudarme, por favor?"],
  ["Sugerencia","We could go to the beach this weekend.","Podríamos ir a la playa este fin de semana."],
  ["Permiso cortés","Could I ask you something?","¿Podría preguntarte algo?"]
 ]},
 {k:"should",label:"SHOULD",mini:"SHOULD es el modal del consejo y la expectativa — dice lo que 'debería' pasar, no lo que obligatoriamente pasa. 'Should have + V3' es una de las estructuras más útiles del inglés para expresar arrepentimiento.",uses:[
  ["Consejo / recomendación","You should rest more.","Deberías descansar más."],
  ["Obligación moral suave","We should recycle more.","Deberíamos reciclar más."],
  ["Expectativa","The package should arrive today.","El paquete debería llegar hoy."],
  ["Should have + V3 = arrepentimiento","You should have called me.","Deberías haberme llamado."],
  ["Sugerencia condicional","If I were you, I should apologize.","Si fuera tú, me disculparía."]
 ]},
 {k:"must",label:"MUST",mini:"MUST es el modal de obligación MÁS FUERTE — para reglas, leyes, y deducciones casi seguras. Su negación (mustn't) no niega la obligación, prohíbe la acción por completo, algo que confunde a muchos hispanohablantes.",uses:[
  ["Obligación fuerte","You must wear a seatbelt.","Debes usar el cinturón de seguridad."],
  ["Deducción lógica","She must be tired after that trip.","Debe estar cansada después de ese viaje."],
  ["Prohibición (must not / mustn't)","You mustn't smoke here.","No debes fumar aquí."],
  ["Necesidad personal fuerte","I must finish this today.","Tengo que terminar esto hoy."]
 ]},
 {k:"can",label:"CAN",mini:"CAN es el modal más básico y frecuente — habilidad y permiso informal, ambos en presente. Para el pasado se usa COULD; para el futuro, 'will be able to' (can no tiene forma de futuro propia).",uses:[
  ["Habilidad","I can swim very well.","Sé nadar muy bien."],
  ["Permiso informal","Can I go to the bathroom?","¿Puedo ir al baño?"],
  ["Posibilidad general","It can be dangerous at night.","Puede ser peligroso de noche."],
  ["Petición informal","Can you pass the salt?","¿Me pasas la sal?"]
 ]},
 {k:"might",label:"MIGHT",mini:"MIGHT expresa una posibilidad más débil e incierta que 'may' o 'could' — es el modal para cuando de verdad no sabes qué va a pasar. 'Might have + V3' expresa una posibilidad sobre el pasado.",uses:[
  ["Posibilidad (más débil que may)","It might rain tomorrow.","Podría llover mañana."],
  ["Sugerencia muy suave","You might want to check that first.","Tal vez quieras revisar eso primero."],
  ["Permiso muy formal (raro hoy)","Might I ask a question?","¿Podría hacer una pregunta?"],
  ["Might have + V3 = posibilidad pasada","He might have forgotten.","Puede que se le haya olvidado."]
 ]},
 {k:"may",label:"MAY",mini:"MAY es el modal más formal para posibilidad y permiso — mismo significado que 'might' o 'can', pero de registro más cuidado (escrito, profesional). También aparece en fórmulas fijas de deseo ('may you...').",uses:[
  ["Posibilidad (registro formal)","It may rain later.","Podría llover más tarde."],
  ["Permiso formal","May I come in?","¿Puedo pasar?"],
  ["Fórmula fija de deseo","May you have a wonderful year.","Que tengas un año maravilloso."],
  ["May have + V3 = posibilidad pasada (formal)","She may have missed the bus.","Puede que haya perdido el autobús."]
 ]}
];
D.certaintyScaleNote="Estos modales y adverbios no son sinónimos cuando hablas de qué tan seguro estás de algo (no de habilidad ni permiso) — forman una escala de certeza, de menor a mayor. <b>Might</b> y <b>could</b> son las más débiles y casi intercambiables; <b>may</b> suena un poco más segura pero sigue siendo abierta; <b>should</b> es expectativa razonable, no garantía; <b>probably</b> y <b>likely to</b> expresan alta probabilidad sin usar modal; <b>must</b> es casi certeza con evidencia; <b>can't</b> es la certeza negativa — tan seguro como 'must', pero de que algo NO es cierto.";
D.certaintyScale=[
 ["might","~30% — posibilidad débil, poco convencido","She might be at the gym.","Puede que esté en el gimnasio (no muy seguro)."],
 ["could","~35% — posibilidad débil-media, abierta","There could be traffic on the highway.","Podría haber tráfico en la autopista."],
 ["may","~50% — posibilidad media, registro algo más formal","He may know the answer.","Puede que sepa la respuesta."],
 ["should","~70% — esperado, no garantizado","The package should arrive today.","El paquete debería llegar hoy."],
 ["probably","~80% — alta probabilidad, sin modal","She's probably still at work.","Probablemente todavía esté en el trabajo."],
 ["likely to","~80% — alta probabilidad, con adjetivo + infinitivo","The meeting is likely to be postponed.","Es probable que la reunión se posponga."],
 ["must","~95% — casi seguro, con evidencia","He must be at home; his car is outside.","Debe estar en casa; su carro está afuera."],
 ["can't","~95% negativo — casi seguro que NO","He can't be at home; his car is gone.","No puede estar en casa; su carro no está."]
];

D.beNote="BE es el verbo más irregular del inglés (8 formas: be, am, is, are, was, were, being, been) y también el más multifuncional — funciona como verbo copulativo (conecta sujeto con descripción) Y como auxiliar (continuo, pasiva) a la vez, algo que ningún otro verbo hace. Dos de sus usos son trampas clásicas para hispanohablantes: la edad y el clima, donde el español usa 'tener'/'hacer' pero el inglés siempre usa BE.";
