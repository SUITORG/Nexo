/* Artículos: a/an, the, cero */
D.articlesNote="En inglés el artículo no es decorativo: marca si el oyente YA SABE de qué sustantivo hablas (<b>the</b>), si lo mencionas por primera vez o de forma genérica/clasificatoria (<b>a/an</b>), o si simplemente no lleva artículo (<b>∅</b>, con incontables y plurales genéricos — sección de Singular vs plural). El error más común del hispanohablante es usar 'the' de más, porque el español pone artículo casi siempre; el inglés lo omite mucho más de lo que parece natural al traducir.";
D.articlesCats=["A / AN (indefinido)","THE (definido)","Artículo cero (∅)","Geografía y nombres propios"];
D.articlesData={
 "A / AN (indefinido)":{
  rule:"Se usa la PRIMERA vez que mencionas algo, o para clasificar/generalizar (profesión, categoría). La elección entre 'a' y 'an' depende del SONIDO inicial de la palabra siguiente, no de la letra: 'a' ante sonido consonántico, 'an' ante sonido vocálico.",
  ex:[
   ["I saw a dog in the park.","/aɪ sɔ ə dɔɡ ɪn ðə pɑrk/","Vi un perro en el parque."],
   ["He is an engineer.","/hi ɪz æn ˌɛndʒəˈnɪr/","Él es ingeniero."],
   ["It takes an hour to get there.","/ɪt teɪks æn ˈaʊər tə ɡɛt ðɛr/","Toma una hora llegar ahí. (la 'h' es muda → sonido vocálico)"],
   ["This is a unique opportunity.","/ðɪs ɪz ə juˈnik ˌɑpərˈtunəti/","Esta es una oportunidad única. ('u' suena /ju/, sonido consonántico → 'a', no 'an')"],
   ["She wants to be a doctor.","/ʃi wɑnts tə bi ə ˈdɑktər/","Ella quiere ser doctora."]
  ]},
 "THE (definido)":{
  rule:"Se usa cuando el oyente ya sabe (o puede deducir) exactamente cuál sustantivo — porque se mencionó antes, es único en el mundo, o el contexto lo deja claro sin ambigüedad.",
  ex:[
   ["I bought a book. The book was expensive.","/aɪ bɔt ə bʊk ðə bʊk wʌz ɪkˈspɛnsɪv/","Compré un libro. El libro era caro. (segunda mención, ya identificado)"],
   ["The sun rises in the east.","/ðə sʌn ˈraɪzɪz ɪn ðə ist/","El sol sale por el este. (único en el mundo)"],
   ["Close the door, please.","/kloʊz ðə dɔr pliz/","Cierra la puerta, por favor. (contexto claro, una sola puerta relevante)"],
   ["The Rocky Mountains are beautiful.","/ðə ˈrɑki ˈmaʊntənz ɑr ˈbjutəfəl/","Las Montañas Rocosas son hermosas. (cordilleras siempre llevan THE)"],
   ["Have you seen the news today?","/hæv ju sin ðə nuz təˈdeɪ/","¿Viste las noticias hoy?"]
  ]},
 "Artículo cero (∅)":{
  rule:"NO se usa artículo con incontables o plurales cuando hablas de forma GENERAL (no de un caso específico), ni con la mayoría de comidas/bebidas en general, materias académicas, o conceptos abstractos amplios.",
  ex:[
   ["I love music.","/aɪ lʌv ˈmjuzɪk/","Amo la música. (en general — no 'the music')"],
   ["Dogs are loyal animals.","/dɔɡz ɑr ˈlɔɪəl ˈænəməlz/","Los perros son animales leales. (plural genérico)"],
   ["She studies chemistry.","/ʃi ˈstʌdiz ˈkɛməstri/","Ella estudia química."],
   ["We had coffee this morning.","/wi hæd ˈkɔfi ðɪs ˈmɔrnɪŋ/","Tomamos café esta mañana."],
   ["Life is short.","/laɪf ɪz ʃɔrt/","La vida es corta."],
   ["The music at the party was great.","/ðə ˈmjuzɪk æt ðə ˈpɑrti wʌz ɡreɪt/","La música de la fiesta estuvo increíble. (CONTRASTE: aquí SÍ lleva THE, porque es específica — la de esa fiesta)"]
  ]},
 "Geografía y nombres propios":{
  rule:"La mayoría de países NO llevan artículo (France, Japan, Mexico). Países con nombre que suena a colectivo, o que incluyen 'Republic/Kingdom/States', SÍ llevan THE. Ríos, océanos, cordilleras y grupos de islas SIEMPRE llevan THE; montañas individuales, lagos y ciudades NO.",
  ex:[
   ["France is in Europe.","/fræns ɪz ɪn ˈjʊrəp/","Francia está en Europa. (país normal, sin artículo)"],
   ["The United States has fifty states.","/ðə juˈnaɪtɪd steɪts hæz ˈfɪfti steɪts/","Estados Unidos tiene cincuenta estados. (nombre colectivo/plural → THE)"],
   ["The Philippines is an island nation.","/ðə ˈfɪləpinz ɪz æn ˈaɪlənd ˈneɪʃən/","Filipinas es una nación insular."],
   ["The Amazon River is enormous.","/ði ˈæməzɑn ˈrɪvər ɪz ɪˈnɔrməs/","El río Amazonas es enorme. (ríos siempre llevan THE)"],
   ["Mount Everest is the tallest mountain.","/maʊnt ˈɛvərəst ɪz ðə ˈtɔlɪst ˈmaʊntən/","El monte Everest es la montaña más alta. (montañas individuales, sin artículo)"],
   ["The Bahamas are beautiful.","/ðə bəˈhɑməz ɑr ˈbjutəfəl/","Las Bahamas son hermosas. (grupos de islas → THE)"]
  ]}
};

/* Modelos mentales — cualquier palabra puede jugar distintos "roles"; en vez de memorizar una traducción fija, pregúntate qué función cumple AHORA */
D.mentalModelsNote="La mayoría de palabras en inglés no tienen UN significado fijo — tienen un conjunto de posibles FUNCIONES, y cuál usan depende de dónde aparecen en la oración. En vez de memorizar 'esta palabra significa esto', la pregunta correcta es: <b>¿qué trabajo está haciendo esta palabra en esta oración específica?</b> Estos son 10 'moldes' (modelos mentales) que puedes aplicar a CUALQUIER palabra nueva que encuentres, para adivinar su función incluso sin conocerla.";
D.mentalModels=[
 {k:"A",label:"Adjective",t:"Describe un sustantivo (adjetivo)",rule:"Va antes del sustantivo (o después de un verbo copulativo, sección de Tipos de verbos) y responde '¿cómo es?'. A diferencia del español, nunca cambia de forma por género o número.",words:"big, happy, difficult, long",exs:[
  {en:"It's a big house.",ipa:"/ɪts ə bɪɡ haʊs/",es:"Es una casa grande."},
  {en:"She's a happy child.",ipa:"/ʃiz ə ˈhæpi tʃaɪld/",es:"Es una niña feliz."},
  {en:"That was a difficult exam.",ipa:"/ðæt wʌz ə ˈdɪfɪkəlt ɪɡˈzæm/",es:"Ese fue un examen difícil."}]},
 {k:"B",label:"Verb",t:"Es el verbo principal (acción o estado)",rule:"Lleva la acción o el estado de la oración — se conjuga según el sujeto y el tiempo. Es el 'motor' de la oración (ver también sección de Tipos de verbos, verbos principales).",words:"agree, know, believe, work, speak",exs:[
  {en:"I agree.",ipa:"/aɪ əˈɡri/",es:"Estoy de acuerdo."},
  {en:"She knows.",ipa:"/ʃi noʊz/",es:"Ella sabe."},
  {en:"They work every day.",ipa:"/ðeɪ wɜrk ˈɛvri deɪ/",es:"Ellos trabajan todos los días."}]},
 {k:"C",label:"Adverb",t:"Modifica un verbo (adverbio)",rule:"Explica CÓMO ocurre la acción — muchos terminan en -ly, y suelen ir cerca del verbo que modifican.",words:"quickly, slowly, carefully, beautifully",exs:[
  {en:"He drives carefully.",ipa:"/hi draɪvz ˈkɛrfəli/",es:"Él maneja con cuidado."},
  {en:"She sings beautifully.",ipa:"/ʃi sɪŋz ˈbjutəfəli/",es:"Ella canta hermosamente."},
  {en:"They walked slowly through the museum.",ipa:"/ðeɪ wɔkt ˈsloʊli θru ðə mjuˈziəm/",es:"Caminaron lento por el museo."}]},
 {k:"D",label:"Preposition",t:"Necesita una preposición fija",rule:"Muchos verbos exigen SIEMPRE la misma preposición después — no es opcional, y casi nunca coincide con la preposición que usarías en español.",words:"agree with/on, depend on, listen to, belong to",exs:[
  {en:"I agree with you.",ipa:"/aɪ əˈɡri wɪð ju/",es:"Estoy de acuerdo contigo."},
  {en:"It depends on the weather.",ipa:"/ɪt dɪˈpɛndz ɑn ðə ˈwɛðər/",es:"Depende del clima."},
  {en:"Listen to me.",ipa:"/ˈlɪsən tə mi/",es:"Escúchame."},
  {en:"This belongs to her.",ipa:"/ðɪs bɪˈlɔŋz tə hɜr/",es:"Esto le pertenece a ella."}]},
 {k:"E",label:"+ Infinitive",t:"Va seguida de infinitivo (verbo + to + verbo)",rule:"Ciertos verbos exigen infinitivo después, nunca gerundio (ver también sección de Gerundios).",words:"want to, need to, decide to",exs:[
  {en:"I want to go home.",ipa:"/aɪ wɑnt tə ɡoʊ hoʊm/",es:"Quiero ir a casa."},
  {en:"She needs to study tonight.",ipa:"/ʃi nidz tə ˈstʌdi təˈnaɪt/",es:"Ella necesita estudiar esta noche."},
  {en:"They decided to leave early.",ipa:"/ðeɪ dɪˈsaɪdɪd tə liv ˈɜrli/",es:"Decidieron irse temprano."}]},
 {k:"F",label:"+ Gerund",t:"Va seguida de gerundio (verbo + -ing)",rule:"Ciertos verbos exigen gerundio después, nunca infinitivo — el par opuesto exacto del modelo E.",words:"enjoy, avoid, keep",exs:[
  {en:"I enjoy reading.",ipa:"/aɪ ɪnˈdʒɔɪ ˈridɪŋ/",es:"Disfruto leer."},
  {en:"Avoid making the same mistake twice.",ipa:"/əˈvɔɪd ˈmeɪkɪŋ ðə seɪm mɪˈsteɪk twaɪs/",es:"Evita cometer el mismo error dos veces."},
  {en:"Keep working, we're almost done.",ipa:"/kip ˈwɜrkɪŋ wir ˈɔlmoʊst dʌn/",es:"Sigue trabajando, ya casi terminamos."}]},
 {k:"G",label:"Opinion",t:"Introduce una opinión",rule:"Va al inicio de la oración para marcar que lo que sigue es tu punto de vista, no un hecho objetivo. 'Guess' es la versión más informal e insegura del grupo — a diferencia de 'suppose', casi siempre implica que estás adivinando, no razonando.",words:"think, believe, suppose, guess",exs:[
  {en:"I think it's a good idea.",ipa:"/aɪ θɪŋk ɪts ə ɡʊd aɪˈdiə/",es:"Creo que es una buena idea."},
  {en:"I believe she's right.",ipa:"/aɪ bɪˈliv ʃiz raɪt/",es:"Creo que ella tiene razón."},
  {en:"I suppose we could try again.",ipa:"/aɪ səˈpoʊz wi kʊd traɪ əˈɡɛn/",es:"Supongo que podríamos intentar de nuevo."},

 {k:"H",label:"Emotion",t:"Expresa emoción",rule:"Va seguido de sustantivo o gerundio, y describe cómo te hace sentir algo.",words:"love, hate, like",exs:[
  {en:"I love music.",ipa:"/aɪ lʌv ˈmjuzɪk/",es:"Amo la música."},
  {en:"She hates spiders.",ipa:"/ʃi heɪts ˈspaɪdərz/",es:"Ella odia las arañas."},
  {en:"We like coffee in the morning.",ipa:"/wi laɪk ˈkɔfi ɪn ðə ˈmɔrnɪŋ/",es:"Nos gusta el café en la mañana."}]},
 {k:"I",label:"Connector",t:"Conecta ideas (conjunción / conector)",rule:"Une dos ideas mostrando su relación lógica: contraste, causa, consecuencia (ver también sección de Conjunciones).",words:"although, however, therefore, because",exs:[
  {en:"Because I was tired, I went to bed early.",ipa:"/bɪˈkɔz aɪ wʌz ˈtaɪərd aɪ wɛnt tə bɛd ˈɜrli/",es:"Como estaba cansado, me acosté temprano."},
  {en:"However, I continued working.",ipa:"/haʊˈɛvər aɪ kənˈtɪnjud ˈwɜrkɪŋ/",es:"Sin embargo, seguí trabajando."},
  {en:"It was raining; therefore, we stayed home.",ipa:"/ɪt wʌz ˈreɪnɪŋ ˈðɛrfɔr wi steɪd hoʊm/",es:"Estaba lloviendo; por lo tanto, nos quedamos en casa."}]},
 {k:"J",label:"Collocation",t:"Forma expresiones fijas (collocations)",rule:"La palabra 'vive' con ciertos compañeros fijos — cambiar el compañero por otro de lógica parecida suena raro (ver también sección de Collocations).",words:"make (a decision, money), take (a break, a shower), heavy (rain, traffic)",exs:[
  {en:"She made a difficult decision.",ipa:"/ʃi meɪd ə ˈdɪfɪkəlt dɪˈsɪʒən/",es:"Ella tomó una decisión difícil."},
  {en:"Let's take a break.",ipa:"/lɛts teɪk ə breɪk/",es:"Tomemos un descanso."},

];

/* 9 · TIPOS DE ADJETIVOS */
D.adjNote="Un adjetivo describe o modifica a un sustantivo o pronombre. A diferencia del español, en inglés el adjetivo <b>nunca cambia</b> por género ni número (✗ 'tall boys' no se dice 'talls boys') y casi siempre va <b>antes</b> del sustantivo que describe: 'a red car', no 'a car red'. Clasificarlos por tipo te dice dónde va cada uno y con qué otros adjetivos se puede combinar (ver también orden de adjetivos, sección más adelante).";
D.adjCats=["Descriptivos (calificativos)","Cuantitativos (de cantidad)","Demostrativos","Posesivos","Interrogativos","Positivo vs Negativo (general)"];
D.adjDefs={
 "Descriptivos (calificativos)": "Describen una cualidad del sustantivo: tamaño, color, forma, textura, cómo es algo. Van antes del sustantivo, o después de un verbo copulativo como be/seem/look (sección de Tipos de verbos).",
 "Cuantitativos (de cantidad)": "Indican cantidad aproximada o exacta sin ser un número exacto: some, many, few, several, a lot of, no. Muchos exigen contable o incontable (much = incontable, many = contable — ver sección de Singular vs plural).",
 "Demostrativos": "Señalan qué sustantivo específico, según distancia y número: this/these (cerca), that/those (lejos). Concuerdan en número con el sustantivo que acompañan.",
 "Posesivos": "Indican a quién pertenece algo: my, your, his, her, its, our, their. Van SIEMPRE antes del sustantivo, nunca solos — cuando van solos son pronombres posesivos (mine, yours...), ya vistos en la sección de pronombres.",
 "Interrogativos": "Preguntan sobre el sustantivo que acompañan: which (elegir entre opciones conocidas), what (pregunta abierta), whose (de quién).",
 "Positivo vs Negativo (general)": "Adjetivos cotidianos de uso general para juzgar algo como bueno o malo, útil o inútil, fácil o difícil — distintos de los adjetivos de personalidad (sección más adelante, 'Adjetivos positivos vs negativos'), que describen el carácter de una persona."
};

 ["-er / -or","convierte verbo en sustantivo (agente/persona)","teach → teacher, act → actor","maestro, actor"],
 ["-ly","convierte adjetivo en adverbio","quick → quickly, careful → carefully","rápidamente, cuidadosamente"]
];
D.affixNote="Reconocer prefijos y sufijos multiplica tu vocabulario sin memorizar palabra por palabra: si sabes 'happy' y sabes que 'un-' niega, ya entiendes 'unhappy' sin buscarlo. Muchos sufijos también CAMBIAN la categoría gramatical de la palabra (verbo→sustantivo, adjetivo→adverbio), lo cual conecta directo con la sección de Acento: sustantivo vs verbo (cambio de acento sustantivo/verbo).";

D.spellingNote="Estas 4 reglas se aplican al agregar CUALQUIER sufijo que empiece en vocal (-ing, -ed, -er, -est, -y, -able...) — no son de un solo tema gramatical: la misma regla de duplicar consonante aplica a un verbo (stop→stopping) y a un adjetivo (big→bigger). Dominarlas evita los errores de escritura más comunes en inglés — más que aprender cientos de palabras sueltas.";
D.spellingRules=[
 {n:"1. Duplicar la consonante final (regla CVC)",r:"Se duplica la consonante final SOLO si la palabra termina en <b>1 vocal + 1 consonante</b> (patrón CVC) Y esa sílaba lleva el acento. En palabras de una sola sílaba (stop, run, big) siempre se cumple. En palabras de 2+ sílabas, solo si el acento cae en la ÚLTIMA sílaba (preFER→preferred) — si el acento cae antes, NO se duplica (OPen→opening). Tampoco se duplica si terminan en 2 consonantes seguidas (jump→jumping) o 2 vocales seguidas (need→needing). <b>Nota BrE/AmE:</b> 'travel' es la excepción más citada — el británico duplica igual (travelled) aunque el acento no esté en la última sílaba; el americano no (traveled) (ver sección de Británico vs Americano).",ex:[
  ["stop","stopping / stopped","1 sílaba, CVC → duplica"],
  ["run","running","1 sílaba, CVC → duplica"],
  ["big","bigger / biggest","adjetivo, mismo patrón"],
  ["prefer","preferred / preferring","2 sílabas, acento en la última → duplica"],
  ["begin","beginning","2 sílabas, acento en la última → duplica"],
  ["jump","jumping","2 consonantes al final (mp) → NO duplica"],
  ["need","needing","2 vocales (ee) → NO duplica"],
  ["open","opening","acento en la 1ª sílaba → NO duplica"],
  ["travel","traveled (AmE) / travelled (BrE)","excepción conocida, difiere por dialecto"]
 ]},
 {n:"2. Quitar la -e muda antes de sufijo con vocal",r:"Si la palabra termina en <b>-e muda</b>, esa e se ELIMINA antes de un sufijo que empieza en VOCAL (-ing, -ed, -able, -ous...). Se MANTIENE si el sufijo empieza en CONSONANTE (-ful, -ment, -less). Excepciones: 'dye' mantiene la e en 'dyeing' (para no confundirse con 'dying', de morir); 'notice'/'courage' mantienen la e antes de -able/-ous para conservar el sonido suave de la c/g.",ex:[
  ["make","making","-ing empieza en vocal → se quita la e"],
  ["hope","hoping / hoped","-ing/-ed empiezan en vocal → se quita la e"],
  ["hope","hopeful","-ful empieza en consonante → se mantiene la e"],
  ["care","careful","-ful empieza en consonante → se mantiene la e"],
  ["dye","dyeing","excepción: mantiene la e para no confundirse con 'dying'"],
  ["notice","noticeable","excepción: mantiene la e para conservar el sonido /s/ de la c"],
  ["courage","courageous","excepción: mantiene la e para conservar el sonido /dʒ/ de la g"]
 ]},
 {n:"3. Y → I antes de sufijo (excepto -ing)",r:"Si la palabra termina en <b>consonante + y</b>, la y cambia a i antes de un sufijo — EXCEPTO antes de -ing, que siempre mantiene la y (para no formar 'ii'). Si termina en <b>vocal + y</b>, nunca cambia. Mismo patrón que ya viste para el plural en consonante+y→ies (sección de Singular vs plural), aquí generalizado a cualquier sufijo, no solo el plural.",ex:[
  ["study","studied / studies","consonante+y → cambia a i"],
  ["study","studying","excepción -ing: mantiene la y"],
  ["happy","happier / happiest / happily","consonante+y → cambia a i"],
  ["carry","carried / carrier","consonante+y → cambia a i"],
  ["play","played / player","vocal+y → NO cambia"],
  ["enjoy","enjoyed / enjoying","vocal+y → NO cambia"]
 ]},
 {n:"4. IE vs EI",r:"Regla clásica: 'i antes de e, excepto después de c' — el detalle que casi nadie enseña bien es que SOLO aplica cuando el sonido es /iː/ (como en 'see'). Si el sonido no es ese, la regla no aplica y la palabra sigue el patrón general (ie) aunque tenga una c cerca.",ex:[
  ["believe, friend, piece","ie","sonido /iː/, sin 'c' antes → ie (regla general)"],
  ["receive, ceiling, deceive, conceit","ei","sonido /iː/, CON 'c' antes → ei (la excepción de la regla)"],
  ["science, society","ie","tiene 'c' pero el sonido NO es /iː/ → la regla no aplica, sigue ie"],
  ["weird, seize, either, neither, height, foreign, leisure","—","excepciones que no siguen ninguna regla — se memorizan sueltas"]
 ]}
];

 ["faux pas","/foʊ pɑ/","paso en falso, metida de pata"],

 ["déjà vu","/ˌdeɪʒɑ ˈvu/","déjà vu"],

D.frenchNote="No hace falta saber francés — solo reconocer la 'huella': si una palabra en inglés tiene una tilde, una 'ch' que suena raro, o una consonante final que 'desaparece' al oírla, probablemente venga del francés y siga sus propias reglas de pronunciación, no las del inglés nativo.";

/* 42 · Notas de dialecto y costumbres regionales */
D.dialectIntro="⚠️ A diferencia del resto del diccionario, esto NO son reglas fijas del inglés estándar — son observaciones de cómo distintos hablantes, regiones y niveles de formalidad cambian la pronunciación 'oficial'. Varían por persona, ciudad y hasta estado de ánimo. Útiles para ENTENDER acentos en películas/series; no para memorizar como si fueran gramática.";
/* 43 · Frameworks de discurso */
D.frameworks=[
 {cat:"Opinión",f:"The way I see it, ___",ex:"The way I see it, we should wait.",es:"Tal como yo lo veo, deberíamos esperar."},
 {cat:"Opinión",f:"If I'm being honest, ___",ex:"If I'm being honest, I don't like it.",es:"Siendo honesto, no me gusta."},
 {cat:"Introducir un punto",f:"One thing [that] ___",ex:"One thing that bothers me is the noise.",es:"Una cosa que me molesta es el ruido."},
 {cat:"Introducir un punto",f:"The thing is, ___",ex:"The thing is, I don't have time.",es:"El punto es que no tengo tiempo."},
 {cat:"Explicar / aclarar",f:"What I mean is ___",ex:"What I mean is, it's not urgent.",es:"Lo que quiero decir es que no es urgente."},
 {cat:"Explicar / aclarar",f:"To put it simply, ___",ex:"To put it simply, it costs too much.",es:"Para decirlo simple, cuesta demasiado."},
 {cat:"Resumir",f:"My point is that ___",ex:"My point is that we need more time.",es:"Mi punto es que necesitamos más tiempo."},
 {cat:"Resumir",f:"Here's the thing: ___",ex:"Here's the thing: nobody agreed.",es:"Aquí está el asunto: nadie estuvo de acuerdo."},

];
D.frameworksNote="Un <b>framework</b> es distinto de un chunk (sección de Bloques fijos): el chunk es una frase fija y cerrada; el framework es un molde ABIERTO — la parte difícil (gramática) ya viene resuelta, tú solo completas la idea detrás. Por eso funciona con vocabulario limitado: en vez de construir la oración entera, sostienes la estructura y rellenas con palabras simples.";

/* 44 · Práctica de contracciones en contexto */
D.contrPractice=[
 ["Whatcha doing?","What are you doing?","/ˈwʌtʃə ˈduɪŋ/","¿Qué haces?","yod-coalescence: t+you→ch (sección de Habla conectada)"],

 ["I shoulda known.","I should have known.","/aɪ ˈʃʊdə noʊn/","Debí haberlo sabido.","modal+have reducido a 'a' (sección de Habla conectada)"],

];
D.contrPracticeNote="Cada frase muestra la forma reducida real, su forma completa, IPA, traducción y la regla exacta (con sección) que explica por qué suena así — todo apoyado en lo que ya viste en el resto del diccionario.";

D.dialects=[
 {t:"I'll (forma débil) ≈ all",r:"En su forma acentuada, 'I'll' es /aɪl/ y 'all' es /ɔl/ — claramente distintos. Pero en habla rápida y SIN ACENTO (forma débil), 'I'll' se relaja a algo cercano a /əl/, y para algunos hablantes eso se acerca perceptiblemente a un 'all' relajado. No son la misma palabra, pero de oído casual, en una frase corrida, pueden confundirse.",ex:"I'll go = /əl ɡoʊ/ (rápido, átono) — más cercano a 'all go' de lo que sugiere la ortografía."},
 {t:"Southern drawl: /aɪ/ se aplana a /aː/",r:"En el sur de EE.UU., el diptongo /aɪ/ (como en 'time', 'right', 'my') pierde el deslizamiento hacia /ɪ/ y queda como una vocal larga y plana /aː/. 'Time' suena como 'tahm'.",ex:"I like it here → /aː laːk ɪt hir/ (sureño) vs /aɪ laɪk ɪt hɪr/ (estándar)"},
 {t:"\"Fixin' to\" (sur de EE.UU.)",r:"Expresión regional que reemplaza a 'going to' / 'about to'. No es error, es una construcción propia del inglés sureño.",ex:"I'm fixin' to leave. = I'm about to leave. (Ya me voy / estoy a punto de irme)"},
 {t:"Reducción de racimos finales más allá de lo estándar",r:"En habla informal muy rápida (varias regiones y comunidades de EE.UU.), consonantes finales como /t/ /d/ pueden desaparecer incluso más de lo que marca la regla de elisión 'oficial' de la sección de Habla conectada.",ex:"test → 'tes' · hand → 'han' · I still don't understand → 'I still don unerstan' (en frases corridas, no en palabra aislada)"},
 {t:"No-rótico regional (r muda tras vocal)",r:"En acentos tradicionales de Boston o Nueva York (y en inglés británico en general), la 'r' después de vocal no se pronuncia, a diferencia del inglés americano estándar que sí la pronuncia siempre.",ex:"park the car → 'pahk the cah' (Boston clásico) vs /pɑrk ðə kɑr/ (estándar americano)"},
 {t:"Canadian raising",r:"En varias zonas de Canadá (y algo del norte de EE.UU.), el diptongo de 'about'/'out' se pronuncia con el punto de partida más alto, lo cual a oídos estadounidenses suena como 'a boot'. La realidad es más sutil que el estereotipo.",ex:"about → /əˈbʌʊt/ (canadiense) — suena distinto a /əˈbaʊt/ (EE.UU.), pero no exactamente 'a boot'"},
 {t:"y'all — ya visto, aquí en contexto de acento",r:"No es solo una contracción (sección de Bloques fijos) — es una marca de identidad regional sureña, casi nunca usada fuera de esa región o comunidades influenciadas por ella.",ex:"Y'all come back now! = ¡Vuelvan pronto! (típico cierre sureño, coloquial)"}
];

/* Pronunciación con la voz nativa del navegador (Web Speech API) — sin API, sin key, sin conexión */
let voicesReady=[];
function loadVoices(){voicesReady=window.speechSynthesis?window.speechSynthesis.getVoices():[]}
if(window.speechSynthesis){loadVoices();window.speechSynthesis.onvoiceschanged=loadVoices;}
function speak(text){
 if(!window.speechSynthesis){alert("Tu navegador no soporta síntesis de voz.");return;}
 window.speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);
 u.lang="en-US";u.rate=0.9;
 const v=voicesReady.find(v=>v.lang==="en-US")||voicesReady.find(v=>v.lang&&v.lang.startsWith("en"));
 if(v)u.voice=v;
 window.speechSynthesis.speak(u);
}
function spkBtn(text){return `<button class="spk" data-text="${escAttr(text)}" onclick="speak(this.dataset.text)" title="Escuchar pronunciación (inglés americano)">🔊</button>`;}

const EXLVL={a:"A1 / A2",b:"B1 / B2",c:"C1 / C2",p:"+ Verbo frasal",n:"Nativo / coloquial"};

  case "contr": return D.contrExamples.map(c=>({en:c[2],ipa:"",es:c[3],note:c[0]}));
  case "conj": return [...D.conjunctions.coord,...D.conjunctions.subord,...D.conjunctions.correl].map(c=>({en:c[3],ipa:"",es:c[2],note:c[0]}));
  case "prep": return [...D.prepositions.time,...D.prepositions.place,...D.prepositions.move].map(p=>({en:p[3],ipa:"",es:p[2],note:p[0]}));
  case "cond": return D.conditionals.map(c=>({en:c.ex,ipa:c.ipa,es:c.es,note:c.t})).concat(D.wishHope.map(w=>({en:w[2],ipa:"",es:w[3],note:w[0]})));

 /* 10 PRONOMBRES */
 h+=`<section class="topic" id="pron"><h2><span class="n"></span>Tipos de pronombres</h2>
 <div class="lesson"><b>Mini-clase.</b> 5 columnas, 5 funciones: sujeto (antes del verbo), objeto (después), adjetivo posesivo (+ sustantivo: <i>my car</i>), pronombre posesivo (solo: <i>it's mine</i>), reflexivo (mismo sujeto y objeto: <i>I hurt myself</i>). Error clásico: ✗ "its'" no existe; <b>it's</b> = it is, <b>its</b> = su.</div>
 <div class="tblwrap"><table><tr><th></th>${D.pronouns.head.map(x=>`<th>${x}</th>`).join("")}</tr>
 ${D.pronouns.rows.map((r,i)=>`<tr><td><b>${["1ª sing","2ª","3ª m","3ª f","3ª n","1ª pl","3ª pl"][i]}</b></td>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>
 <div class="rule">También existen: <b>demostrativos</b> (this/that/these/those), <b>relativos</b> (who, which, that, whose) e <b>interrogativos</b> (ver sección de Interrogativo).</div>
 <h3>Pronombres indefinidos</h3>
 <div class="lesson"><b>Mini-clase.</b> Se forman combinando un prefijo (SOME-/ANY-/NO-/EVERY-) con una terminación (-one, -body, -thing, -where) — mismo patrón en las 4 filas. SOME = afirmativo ("hay alguien/algo"). ANY = preguntas y negaciones ("¿hay alguien?", "no hay nadie" se dice con NOT...ANY). NO = negación absoluta en una sola palabra (no lleva "not" adicional). EVERY = todos sin excepción. <b>-one</b> y <b>-body</b> son intercambiables (someone = somebody), solo cambia el registro (-body es un poco más informal).</div>
 ${D.indefPron.map(cat=>`<h4>${esc(cat.t)}</h4><div class="rule"><i>${esc(cat.c)}</i></div><div class="tblwrap"><table><tr><th>Palabra · IPA</th><th>Español</th><th>Ejemplo</th></tr>${cat.vs.map(v=>`<tr><td><b>${esc(v.v)}</b> ${spkBtn(v.v)}<br><span class="ipa wrap">${esc(v.ipa)}</span></td><td class="es">${esc(v.es)}</td><td>${esc(v.ex)} ${spkBtn(v.ex)}</td></tr>`).join("")}</table></div>`).join("")}
 <div class="rule"><b>Ojo con "somewhat":</b> aunque empieza igual que someone/something, NO es un pronombre indefinido — es un <b>adverbio de grado</b> ("algo, un poco, bastante"), modifica adjetivos/verbos, no reemplaza un sustantivo. <i>This is somewhat difficult.</i> (Esto es algo difícil.) · <i>She somewhat agrees.</i> (Ella está algo de acuerdo.) Otros compuestos con some-/any-/every- que existen pero no son parte de esta familia de pronombres: someday (algún día), somehow (de algún modo), anyway/anyhow (de todos modos).</div>
 <h3>Posesivo 's (genitivo sajón) — Peter's house</h3>
 <div class="rule">${D.saxonNote}</div>
 <div class="tblwrap"><table><tr><th>Regla</th><th>Ejemplo · IPA</th><th>Español</th></tr>
 ${D.saxonGen.map(s=>`<tr><td><b>${s[0]}</b></td><td>${s[1]} ${spkBtn(s[1])}<br><span class="ipa wrap">${s[2]}</span></td><td class="es">${s[3]}</td></tr>`).join("")}</table></div></section>`;

 /* 11 INTERROGATIVO */
 h+=`<section class="topic" id="quest"><h2><span class="n"></span>Inglés interrogativo</h2>
 <div class="lesson"><b>Mini-clase.</b> Fórmula de oro: <span class="formula">(Wh-) + auxiliar + sujeto + verbo base</span>. Si no hay auxiliar visible, aparece <b>do/does/did</b> y el verbo vuelve a su base: She works → <u>Does</u> she <u>work</u>? Excepción: preguntas al sujeto no llevan do: "Who called?" (no "Who did call?").</div>
 <div class="tblwrap"><table><tr><th>Wh-word</th><th>Español</th><th>Ejemplo</th></tr>
 ${D.wh.map(w=>`<tr><td><b>${w[0]}</b></td><td class="es">${w[1]}</td><td>${w[2]}</td></tr>`).join("")}</table></div>
 <h3>Do / Does / Did — ¿cuál usar?</h3>
 <div class="rule"><b>DO</b> → con I / you / we / they, y presente simple: "Do they live here?"<br><b>DOES</b> → con he / she / it, presente simple (el verbo pierde la -s: does she work?, no ✗ does she works?)<br><b>DID</b> → cualquier sujeto, pasado simple (el verbo vuelve a la base: Did you go?, no ✗ Did you went?)</div>
 <div class="rule">Estos tres son solo <b>auxiliares vacíos de significado</b>: existen porque el inglés exige un auxiliar antes del sujeto en la pregunta, y el verbo principal no puede moverse solo. Por eso "aparece de la nada" comparado con el español.</div>
 <h3>Más ejemplos: pregunta y negación con Do / Does / Did</h3>
 <div class="tblwrap"><table><tr><th>Auxiliar</th><th>Sujeto</th><th>Pregunta</th><th>Español</th><th>Negación</th><th>Español</th></tr>
 ${D.doDoesDidTable.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]} ${spkBtn(r[2])}</td><td class="es">${r[3]}</td><td>${r[4]} ${spkBtn(r[4])}</td><td class="es">${r[5]}</td></tr>`).join("")}</table></div>
 <h3>Respuestas cortas</h3>
 <div class="rule">${D.doDoesDidShortNote}</div>
 <div class="tblwrap"><table><tr><th>Pregunta</th><th>Respuesta corta</th><th>Español</th></tr>
 ${D.doDoesDidShort.map(r=>`<tr><td>${r[0]} ${spkBtn(r[0])}</td><td><b>${r[1]}</b></td><td class="es">${r[2]}</td></tr>`).join("")}</table></div>
 <h3>Preguntas al sujeto vs. al objeto — cuándo NO usar do/does/did</h3>
 <div class="rule">${D.subjQuestNote}</div>
 <div class="tblwrap"><table><tr><th>Pregunta</th><th>Explicación</th><th>Respuesta típica</th></tr>
 ${D.subjQuestTable.map(r=>`<tr><td><b>${r[0]}</b> ${spkBtn(r[0])}</td><td class="es">${r[1]}</td><td>${r[2]} ${spkBtn(r[2])}</td></tr>`).join("")}</table></div>
 <h3>Entonación según el tipo de pregunta</h3>
 <div class="rule"><b>Preguntas Sí/No</b> (con do/does/did, o be/have como auxiliar) → entonación <b>ascendente ↗</b> al final: "Do you like it?↗". Sube porque el hablante pide una confirmación abierta (sí o no), dejando la voz "en el aire".</div>
 <div class="rule"><b>Preguntas Wh-</b> (what, where, who…) → entonación <b>descendente ↘</b> al final: "Where do you live?↘". Baja porque la pregunta ya asume que existe una respuesta concreta y específica; suena más segura/cerrada.</div>
 <div class="rule"><b>Question tags</b>: si el hablante realmente no sabe la respuesta, la entonación del tag <b>sube ↗</b> (pregunta genuina); si ya sabe la respuesta y solo busca confirmación o acuerdo, el tag <b>baja ↘</b>. "You're coming, aren't you?↘" (asume que sí) vs "↗" (duda real).<br>"You're coming, <b>aren't you?</b>" · "She didn't call, <b>did she?</b>"</div>
 <div class="rule"><b>Preguntas de elección</b> (A or B): sube en la primera opción y baja en la última → "Tea↗ or coffee↘?" — la caída final marca que ahí terminan las opciones.</div>
 <h3>Preguntas que terminan en preposición — uso diario</h3>
 <div class="rule">En inglés es totalmente normal y natural que una pregunta termine en preposición — se llama <b>preposition stranding</b> (preposición "varada"). Mover la preposición al inicio suena forzado o excesivamente formal: "Who are you talking to?" (natural) vs "To whom are you talking?" (muy formal/legal). En Wh-questions con preposición, la preposición casi siempre queda al final en el habla cotidiana.</div>
 <div class="tblwrap"><table><tr><th>Pregunta natural (preposición al final)</th><th>Español</th></tr>
 <tr><td><b>Who are you talking to?</b> ${spkBtn("Who are you talking to?")}</td><td class="es">¿Con quién estás hablando?</td></tr>
 <tr><td><b>What are you looking for?</b> ${spkBtn("What are you looking for?")}</td><td class="es">¿Qué estás buscando?</td></tr>
 <tr><td><b>Where are you from?</b> ${spkBtn("Where are you from?")}</td><td class="es">¿De dónde eres?</td></tr>
 <tr><td><b>Who did you go with?</b> ${spkBtn("Who did you go with?")}</td><td class="es">¿Con quién fuiste?</td></tr>
 <tr><td><b>What is this used for?</b> ${spkBtn("What is this used for?")}</td><td class="es">¿Para qué se usa esto?</td></tr>
 <tr><td><b>Who do you work for?</b> ${spkBtn("Who do you work for?")}</td><td class="es">¿Para quién trabajas?</td></tr>
 <tr><td><b>What are you thinking about?</b> ${spkBtn("What are you thinking about?")}</td><td class="es">¿En qué estás pensando?</td></tr>
 <tr><td><b>Who is this gift for?</b> ${spkBtn("Who is this gift for?")}</td><td class="es">¿Para quién es este regalo?</td></tr>
 <tr><td><b>What did you talk about?</b> ${spkBtn("What did you talk about?")}</td><td class="es">¿De qué hablaron?</td></tr>
 <tr><td><b>Where do you come from?</b> ${spkBtn("Where do you come from?")}</td><td class="es">¿De dónde vienes?</td></tr>
 <tr><td><b>Who was that call from?</b> ${spkBtn("Who was that call from?")}</td><td class="es">¿De quién era esa llamada?</td></tr>
 <tr><td><b>What's this made of?</b> ${spkBtn("What's this made of?")}</td><td class="es">¿De qué está hecho esto?</td></tr>
 </table></div>
 ${exWidget("q",D.wh.map(w=>w[0]),"pregunta con la palabra interrogativa")}</section>`;

 /* 13 COLLOCATIONS */
 h+=`<section class="topic" id="colloc"><h2><span class="n"></span>Collocations</h2>
 <div class="lesson"><b>Mini-clase.</b> Son parejas que "van juntas" por costumbre, no por lógica: se dice <b>make</b> a decision (no ✗ take a decision, aunque en español sea "tomar"). Traducir literalmente desde el español es el error más común aquí.</div>

let SEARCH_INDEX=[];
function buildSearchIndex(){
 const idx=[];
 const add=(en,es,sectionId,chipFn,chipArg,ipa)=>{ if(en) idx.push({en:String(en),es:String(es||""),sectionId,chipFn,chipArg,ipa:ipa||""}); };
 Object.entries(D.vocab).forEach(([cat,arr])=>arr.forEach(v=>add(v[0],v[3],"vocab",showVocab,cat,v[1])));
 D.antonyms.forEach(a=>{add(a[0],a[4],"anton");add(a[2],a[4],"anton");});
 D.adjPosNeg.forEach(p=>{add(p[0],p[4],"adj",showAdj,"Positivo vs Negativo (general)");add(p[2],p[4],"adj",showAdj,"Positivo vs Negativo (general)");});
 D.posNeg.forEach(p=>{add(p[0],p[4],"posneg");add(p[2],p[4],"posneg");});
 D.synonyms.forEach(s=>add(s[0],s[2],"syn"));
 D.phrasal.forEach(p=>add(p.v,p.es,"phrasal",showPhrasalCat,p.cat));
 D.chunks.forEach(c=>add(c.c,c.es,"chunks",showChunkCat,c.cat));
 D.collocations.forEach(c=>add(c[0],c[2],"colloc"));
 D.homophones.forEach(h=>add(h[0],h[2],"homoph"));
 D.minPairs.forEach(m=>{add(m.a,m.es,"ipa",showIpaCat,8);add(m.b,m.es,"ipa",showIpaCat,8);});
 D.falseFriends.forEach(f=>add(f[0],f[2],"falsef"));
 D.vsplit.forEach((g,i)=>g.verbs.forEach(v=>add(v.v,g.es,"vsplit",showVSplit,i)));
 D.mentalModelsCase.forEach(c=>add(c.word,c.funcs.map(f=>f.fn).join(", "),"mentalmodels",showMentalModelCase));
 D.workhorseVerbs.forEach((v,i)=>add(v.label,v.uses.map(u=>u[0]).slice(0,3).join(", "),"multiuse",()=>showMultiUse("workhorse",i)));
 D.multiModals.forEach((v,i)=>add(v.label,v.uses.map(u=>u[0]).slice(0,3).join(", "),"multiuse",()=>showMultiUse("modal",i)));
 add("BE","copulativo, auxiliar, existencia, edad, clima","multiuse");
 Object.entries(D.nounsExamples).forEach(([cat,arr])=>arr.forEach(n=>add(n[0],n[2],"nouns",showNouns,cat,n[1])));
 Object.entries(D.adjExamples).forEach(([cat,arr])=>arr.forEach(e=>add(e[0],e[2],"adj",showAdj,cat,e[1])));
 SEARCH_INDEX=idx;
}
function searchWord(q){
 q=q.trim().toLowerCase();
 if(!q) return [];
 return SEARCH_INDEX.filter(e=>e.en.toLowerCase().includes(q)||e.es.toLowerCase().includes(q)).slice(0,20);
}
let LAST_SEARCH_RESULTS=[];
function renderSearchResults(q){
 const box=$("searchResults");
 if(!q.trim()){ box.classList.remove("open"); box.innerHTML=""; LAST_SEARCH_RESULTS=[]; return; }
 LAST_SEARCH_RESULTS=searchWord(q);
 box.classList.add("open");
 box.innerHTML=LAST_SEARCH_RESULTS.length
  ? LAST_SEARCH_RESULTS.map((r,i)=>{const secTitle=(SECTIONS.find(s=>s[0]===r.sectionId)||[,r.sectionId])[1];return `<div class="sres" onmousedown="jumpToSearchResult(${i})"><b>${esc(r.en)}</b><span class="es">— ${esc(r.es)}</span><span class="sec">${esc(secTitle)}</span></div>`;}).join("")
  : `<div class="sres es">Sin resultados.</div>`;
}
function jumpToSearchResult(i){
 const r=LAST_SEARCH_RESULTS[i];
 if(!r) return;
 show(r.sectionId);
 if(r.chipFn) r.chipFn(r.chipArg);
 $("searchbox").value="";
 $("searchResults").classList.remove("open");
 $("searchResults").innerHTML="";
}

let GLOSSARY_ITEMS=[];
function renderGlossary(){
 const seen={};
 GLOSSARY_ITEMS=SEARCH_INDEX.filter(e=>{
  const key=e.en.toLowerCase();
  if(seen[key]) return false;
  seen[key]=true; return true;
 }).sort((a,b)=>a.en.localeCompare(b.en));
 const byLetter={};
 GLOSSARY_ITEMS.forEach((e,i)=>{
  const letter=/[a-zA-Z]/.test(e.en[0])?e.en[0].toUpperCase():"#";
  (byLetter[letter]=byLetter[letter]||[]).push(i);
 });
 let h=`<div class="lesson"><b>${GLOSSARY_ITEMS.length} palabras únicas indexadas.</b> Se arma solo a partir de todo el vocabulario ya cargado en el diccionario — cualquier palabra nueva que se agregue en otra sección aparece aquí automáticamente, sin tocar este glosario.</div>`;
 Object.keys(byLetter).sort().forEach(letter=>{
  h+=`<h3>${letter}</h3><div class="grid g3">`;
  byLetter[letter].forEach(i=>{
   const e=GLOSSARY_ITEMS[i];
   h+=`<div class="card"><b>${esc(e.en)}</b>${e.ipa?` <span class="ipa">${esc(e.ipa)}</span>`:""}<div class="es">${esc(e.es)}</div><button onclick="jumpFromGlossary(${i})" style="margin-top:6px">ir a →</button></div>`;
  });
  h+='</div>';
 });
 $("glossarybody").innerHTML=h;
}
function jumpFromGlossary(i){

}

const AILAB_LEVEL_DESC={
 a:"nivel A1/A2 (básico: oraciones simples y cortas)",
 b:"nivel B1/B2 (intermedio)",
 c:"nivel C1/C2 (avanzado, con estructuras más complejas)",
 p:"nivel intermedio, y cada oración DEBE incluir al menos un verbo frasal (phrasal verb) natural",
 n:"tono nativo/coloquial: informal, como en una conversación casual entre amigos"
};
async function generarIA(){
 const topic=$("ailabTopic").value.trim()||"vida diaria";
 const levelDesc=AILAB_LEVEL_DESC[$("ailabLevel").value];
 const out=$("ailabResult");
 out.textContent="Generando…";
 const prompt=`Genera 5 oraciones en inglés, ${levelDesc}, sobre el tema "${topic}". `+
  `Responde SOLO con 5 líneas, una por oración, formato exacto: EN: <oración> | ES: <traducción>. Sin numerar, sin explicaciones.`;
 try{
  const r=await fetch("/api/generar",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt})});
  const data=await r.json();
  if(!r.ok) throw new Error(data.error||"Error de SuitAI");
  const lines=(data.content||"").split("\n").map(l=>l.trim()).filter(Boolean);
  const rows=lines.map(l=>{const m=l.match(/EN:\s*(.+?)\s*\|\s*ES:\s*(.+)/i);return m?{en:m[1],es:m[2]}:null;}).filter(Boolean);
  out.innerHTML=rows.length
   ? `<div class="grid g2">${rows.map(x=>`<div class="card"><span class="en">${esc(x.en)}</span> ${spkBtn(x.en)}<br><span class="es">${esc(x.es)}</span></div>`).join("")}</div><div class="es" style="margin-top:6px">Modelo: ${esc(data.model||"?")}</div>`
   : `<pre style="white-space:pre-wrap">${esc(data.content||"(sin respuesta)")}</pre>`;
 }catch(e){
  out.innerHTML=`<span class="es">⚠️ ${esc(e.message)} — revisa que SuitAI esté corriendo (puerto 3010).</span>`;
 }
}

  html+='<div id="irregularbody"></div>';
 }
 if(t.t==="Regulares"){
  html+='<h3>Pronunciación de -ed: los 3 sonidos posibles</h3>';

  html+='<div class="grid g3">'+D.edSounds.map(function(g){return '<div class="card"><h4>/'+g.sym+'/ — '+g.title+'</h4><div class="es" style="margin-bottom:6px">'+g.desc+'</div><div class="tblwrap"><table>'+g.verbs.map(function(v){return '<tr><td><b>'+v.v+' → '+v.ed+'</b> '+spkBtn(v.ed)+'</td><td><span class="ipa">'+v.ipa+'</span></td><td class="es">'+v.es+'</td></tr>';}).join("")+'</table></div></div>';}).join("")+'</div>';
 }
 if(t.t==="Principales (lexical)"){
  html+='<h3>Reglas</h3>'+D.mainVerbRules.map(function(r){return '<div class="rule">'+r+'</div>';}).join("");
  html+='<h3>BE (la excepción) vs. verbo léxico normal</h3><div class="tblwrap"><table><tr><th>Verbo</th><th>Pregunta</th><th>Español</th><th>Negación</th><th>Español</th></tr>';
  html+=D.mainVerbCompare.map(function(c){return '<tr><td><b>'+c[0]+'</b></td><td>'+c[1]+' '+spkBtn(c[1])+'</td><td class="es">'+c[2]+'</td><td>'+c[3]+' '+spkBtn(c[3])+'</td><td class="es">'+c[4]+'</td></tr>';}).join("");
  html+='</table></div>';
 }
 if(t.t==="Stative (de estado)"){
  html+='<h3>Los 4 grupos de verbos stative</h3>';
  html+='<div class="newscat">'+D.stativeSub.map(function(s,i){return '<button class="chip'+(i===0?' active':'')+'" onclick="showStative('+i+',this)">'+s.cat+'</button>';}).join("")+'</div>';
  html+='<div id="stativebody"></div>';
 }
 document.getElementById("verbtypebody").innerHTML=html;
 if(t.t==="Stative (de estado)"){ showStative(0,document.querySelector("#verbtypebody .newscat .chip")); }
 if(t.t==="Irregulares"){ showIrregularPattern(0,document.querySelector("#verbtypebody .newscat .chip")); }
}
function showIrregularPattern(idx,btn){

/* ---- quiz de pares mínimos ---- */
let qi=null;
function newQuiz(){
 if(!$("quizbox"))return;
 const m=D.minPairs[Math.floor(Math.random()*D.minPairs.length)];
 const target=Math.random()<.5?{w:m.a,i:m.ai}:{w:m.b,i:m.bi};
 qi={m,target};
 $("quizbox").innerHTML=`<div><b>¿Qué palabra corresponde a</b> <span class="ipa" style="font-size:18px">${target.i}</span> ?</div>
 <div class="qopts"><button onclick="answer('${m.a}')">${m.a}</button><button onclick="answer('${m.b}')">${m.b}</button></div>
 <div class="qfeed" id="qfeed"></div>
 <div style="display:flex;gap:8px;margin-top:6px"><button onclick="newQuiz()">Otro par</button></div>`;
}
function answer(w){
 const f=$("qfeed"),ok=w===qi.target.w;
 f.className="qfeed "+(ok?"ok":"bad");
 f.innerHTML=(ok?"✓ Correcto. ":"✗ No. ")+`${qi.m.a} ${qi.m.ai} vs ${qi.m.b} ${qi.m.bi} — <span class="es">${qi.m.es}</span>`;
}

/* ---- ticker ---- */
let ti=-1;
function nextTick(){
 ti=(ti+1)%D.ticks.length;const t=D.ticks[ti];
 $("tickbody").innerHTML=`<div class="tick"><span class="en">${esc(t.en)}</span> ${spkBtn(t.en)} <span class="ipa">${esc(t.ipa)}</span> — <span class="es">${esc(t.es)}</span></div>`;
}
setInterval(nextTick,9000);

fitHeader();window.addEventListener('resize',fitHeader);window.addEventListener('orientationchange',fitHeader);
