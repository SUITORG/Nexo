<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>RapidRescue - Welcome / Phone Registration</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed": "#002204",
                        "primary-fixed-dim": "#ffb3ac",

                        "surface-dim": "#dadada",
                        "surface-tint": "#ba1a20",
                        "on-error-container": "#93000a",
                        "on-secondary-fixed": "#001c3a",
                        "surface-container-highest": "#e2e2e2",
                        "on-primary-fixed-variant": "#930010",
                        "tertiary-container": "#298030",
                        "primary-fixed": "#ffdad6",
                        "on-tertiary-container": "#daffd1",
                        "on-surface": "#1a1c1c",
                        "secondary-fixed": "#d4e3ff",
                        "inverse-primary": "#ffb3ac",
                        "on-secondary-fixed-variant": "#004786",
                        "tertiary": "#016619",
                        "on-primary-container": "#fff2f0",
                        "secondary": "#005faf",
                        "on-tertiary-fixed-variant": "#005312",
                        "outline": "#8f6f6c",
                        "surface-container-high": "#e8e8e8",
                        "on-error": "#ffffff",
                        "surface": "#f9f9f9",
                        "primary-container": "#d32f2f",
                        "surface-variant": "#e2e2e2",
                        "on-primary-fixed": "#410003",
                        "inverse-surface": "#2f3131",
                        "background": "#f9f9f9",
                        "outline-variant": "#e4beba",
                        "on-tertiary": "#ffffff",
                        "on-secondary-container": "#003567",
                        "surface-container-lowest": "#ffffff",
                        "primary": "#af101a",
                        "surface-bright": "#f9f9f9",
                        "on-primary": "#ffffff",
                        "surface-container": "#eeeeee",
                        "inverse-on-surface": "#f1f1f1",
                        "secondary-container": "#54a0fe",
                        "tertiary-fixed": "#9df898",
                        "error": "#ba1a1a",
                        "tertiary-fixed-dim": "#82db7e"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "md": "16px",
                        "lg": "24px",
                        "base": "4px",
                        "sm": "8px",
                        "xs": "4px",
                        "xl": "32px",
                        "gutter": "16px",
                        "margin-desktop": "64px",
                        "margin-mobile": "16px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "label-bold": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "mono-data": ["Inter"],
                        "body-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-bold": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "mono-data": ["16px", { "lineHeight": "24px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],

                        "body-lg": ["18px", { "lineHeight": "26px", "fontWeight": "400" }]

                }
            }
        }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col font-sans selection:bg-primary-container selection:text-on-primary-container">
<!-- Linear/Transactional Page - Navigation Shell Suppressed as per instructions -->
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile md:px-margin-desktop py-xl relative overflow-hidden">
<!-- Ambient Background Element -->
<div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
<div class="absolute -top-[20%] -right-[10%] w-[500px] h-[500px] rounded-full bg-primary-fixed-dim/20 blur-[100px]"></div>
<div class="absolute -bottom-[20%] -left-[10%] w-[400px] h-[400px] rounded-full bg-secondary-fixed-dim/20 blur-[80px]"></div>
</div>
<div class="w-full max-w-md z-10 flex flex-col">
<!-- Logo & Header -->
<div class="text-center mb-xl">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-primary-container text-on-primary-container mb-md shadow-sm">
<span class="material-symbols-outlined text-4xl" data-icon="emergency" data-weight="fill">emergency</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary mb-sm">RapidRescue</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-xs mx-auto">
                    Tu vida es nuestra prioridad. Regístrate para estar preparado.
                </p>
</div>
<!-- Registration Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-lg flex flex-col gap-lg shadow-sm">
<!-- Input Group -->
<div class="flex flex-col gap-sm">
<label class="font-label-bold text-label-bold text-on-surface" for="phone">Phone Number</label>
<div class="relative flex items-center group">
<!-- Country Code Selector -->
<div class="absolute left-0 inset-y-0 flex items-center border-r border-outline-variant px-sm bg-surface-container-low rounded-l-lg transition-colors group-focus-within:border-secondary">
<select class="bg-transparent border-none text-on-surface font-body-md text-body-md focus:ring-0 cursor-pointer appearance-none pr-sm pl-xs">
<option>+1</option>
<option>+52</option>
<option>+34</option>
<option>+44</option>
</select>
<span class="material-symbols-outlined text-on-surface-variant text-sm pointer-events-none -ml-1">arrow_drop_down</span>
</div>
<!-- Phone Input -->
<input autocomplete="tel" class="w-full h-[56px] pl-24 pr-md py-sm bg-transparent border border-outline-variant rounded-lg font-mono-data text-mono-data text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-all" id="phone" name="phone" placeholder="(555) 000-0000" type="tel"/>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-xs mt-xs">
<span class="material-symbols-outlined text-[14px]">lock</span> We'll send a text with a verification code.
                    </p>
</div>
<!-- Action Button -->
<button class="w-full bg-primary text-on-primary font-label-bold text-label-bold py-md px-lg rounded-lg shadow-sm hover:bg-primary/90 active:scale-[0.98] transition-all flex items-center justify-center gap-sm" type="button">
                    Send Verification Code
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
<!-- Trust Badges -->
<div class="flex items-center justify-center gap-md pt-sm border-t border-outline-variant/50 mt-xs">
<div class="flex items-center gap-xs text-on-surface-variant">
<span class="material-symbols-outlined text-[16px]">verified_user</span>
<span class="font-label-sm text-label-sm">Secure</span>
</div>
<div class="w-1 h-1 rounded-full bg-outline-variant"></div>
<div class="flex items-center gap-xs text-on-surface-variant">
<span class="material-symbols-outlined text-[16px]">health_and_safety</span>
<span class="font-label-sm text-label-sm">HIPAA Compliant</span>
</div>
</div>
</div>
<!-- Footer Links -->
<div class="mt-lg text-center">
<p class="font-label-sm text-label-sm text-on-surface-variant">
                    By registering, you agree to our 
                    <a class="text-secondary hover:underline underline-offset-2" href="#">Terms of Service</a> and 
                    <a class="text-secondary hover:underline underline-offset-2" href="#">Privacy Policy</a>.
                </p>
</div>
</div>
</main>
<script>
        // Simple input formatting interaction
        const phoneInput = document.getElementById('phone');
        phoneInput.addEventListener('input', function(e) {
            let x = e.target.value.replace(/\D/g, '').match(/(\d{0,3})(\d{0,3})(\d{0,4})/);
            e.target.value = !x[2] ? x[1] : '(' + x[1] + ') ' + x[2] + (x[3] ? '-' + x[3] : '');
        });
    </script>
</body></html>
