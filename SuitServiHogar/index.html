<!doctype html>
<html lang="es" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#006C4C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <title>ServiciosHogar Reynosa • Servicios Verificados & Escrow</title>
    <meta name="description" content="Plataforma de servicios para el hogar verificados con garantía Escrow y tabulador bimonetario para Reynosa." />
    <meta property="og:title" content="ServiciosHogar Reynosa" />
    <meta property="og:description" content="Plataforma de servicios para el hogar verificados con garantía Escrow y tabulador bimonetario para Reynosa." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-surface text-on-surface antialiased font-sans">
    <div id="splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a0f1a;z-index:9999;transition:opacity .3s">
      <div style="width:64px;height:64px;border-radius:16px;background:#006C4C;display:flex;align-items:center;justify-content:center;margin-bottom:16px">
        <span style="color:#fff;font-size:28px;font-weight:800;font-family:system-ui,sans-serif">SH</span>
      </div>
      <p style="color:#94A3B8;font-size:14px;font-family:system-ui,sans-serif">ServiHogar Reynosa</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
      window.addEventListener('load', () => {
        const s = document.getElementById('splash');
        if (s) { s.style.opacity = '0'; setTimeout(() => s.remove(), 300); }
      });
    </script>
  </body>
</html>
