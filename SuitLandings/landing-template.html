<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{NOMBRE}} | {{GIRO}}</title>
    <meta name="description" content="{{DESCRIPCION}}">
    <meta name="keywords" content="{{NOMBRE}}, {{GIRO}}">
    <meta name="robots" content="noindex, nofollow">
    <meta property="og:title" content="{{NOMBRE}}">
    <meta property="og:description" content="{{DESCRIPCION}}">
    <meta property="og:url" content="{{URL}}">
    <meta property="og:image" content="{{IMAGEN_HERO}}">
    <meta name="twitter:title" content="{{NOMBRE}}">
    <meta name="twitter:description" content="{{DESCRIPCION}}">
    <style>
        :root {
            --accent: {{COLOR_TEMA}};
            --bg: #0b0f1a;
            --card: rgba(255, 255, 255, 0.04);
            --text: #f5f6fa;
            --text-dim: #aab3c5;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }
        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem 1.5rem;
            overflow: hidden;
        }
        .hero-bg {
            position: absolute;
            inset: 0;
            background-image: linear-gradient(rgba(11, 15, 26, 0.82), rgba(11, 15, 26, 0.92)), url('{{IMAGEN_HERO}}');
            background-size: cover;
            background-position: center;
            z-index: 0;
        }
        .hero-content {
            position: relative;
            z-index: 1;
            max-width: 720px;
            width: 100%;
        }
        .logo {
            width: 96px;
            height: 96px;
            object-fit: contain;
            margin-bottom: 1.5rem;
            filter: drop-shadow(0 4px 16px rgba(0,0,0,0.5));
        }
        .logo[src=""] { display: none; }
        h1 { font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 800; margin-bottom: 0.75rem; }
        .slogan { font-size: clamp(1rem, 2.4vw, 1.25rem); color: var(--text-dim); margin-bottom: 1.5rem; }
        .oferta {
            display: inline-block;
            background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 60%, white));
            padding: 0.6rem 1.6rem;
            border-radius: 999px;
            font-weight: 700;
            font-size: 1.05rem;
            margin-bottom: 2rem;
            box-shadow: 0 8px 30px color-mix(in srgb, var(--accent) 40%, transparent);
        }
        .descripcion { color: var(--text-dim); max-width: 560px; margin: 0 auto 2.25rem; font-size: 1.05rem; }
        .cta {
            display: inline-block;
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            padding: 1rem 2.75rem;
            border-radius: 999px;
            font-weight: 700;
            font-size: 1.15rem;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            box-shadow: 0 10px 40px color-mix(in srgb, var(--accent) 45%, transparent);
        }
        .cta:hover { transform: translateY(-2px); }
        .info {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            margin-top: 2.5rem;
            color: var(--text-dim);
            font-size: 0.95rem;
        }
        .info a { color: var(--text); text-decoration: none; }
        .info a:hover { text-decoration: underline; }
        .sep { margin: 0 0.5rem; opacity: 0.4; }
        @media (max-width: 480px) {
            .info { flex-direction: column; gap: 0.35rem; }
            .sep { display: none; }
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="hero-bg"></div>
        <div class="hero-content">
            <img class="logo" src="{{LOGO}}" alt="{{NOMBRE}}">
            <h1>{{NOMBRE}}</h1>
            <p class="slogan">{{SLOGAN}}</p>
            <div class="oferta">{{OFERTA}}</div>
            <p class="descripcion">{{DESCRIPCION}}</p>
            <a class="cta" href="{{CTA_HREF}}" data-cta>{{CTA_TEXTO}}</a>
            <div class="info">
                <span data-tel>{{TELEFONO}}</span>
                <span class="sep" data-tel-sep>·</span>
                <a href="mailto:{{CORREO}}" data-mail>{{CORREO}}</a>
            </div>
        </div>
    </div>
</body>
</html>
