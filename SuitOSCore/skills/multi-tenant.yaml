skill:
  name: multi-tenant
  display_name: "Multi-Tenant Isolation"
  version: 1.0.0
  type: domain
  domain: security

  description: >
    Enforces multi-tenant data isolation rules.
    All queries must filter by tenant_id. No cross-tenant data access.

  dependencies:
    - javascript

  triggers:
    - keyword: "tenant_id"
    - keyword: "tenant"
    - keyword: "multi-tenant"
    - keyword: "isolation"
    - file_pattern: "handlers/*.js"
    - file_pattern: "services/*.js"
    - file_pattern: "db/*.js"

  rules:
    - id: mt-001
      description: "All queries must filter by tenant_id"
      severity: error

    - id: mt-002
      description: "No cross-tenant data access"
      severity: error

    - id: mt-003
      description: "Soft delete only — use activo=FALSE or is_active=false, never physical DELETE"
      severity: error

    - id: mt-004
      description: "Tenant context must be extracted from auth token, not from request body"
      severity: error
      check: "tenant_id must come from authenticated session, never from client-provided payload"

  examples:
    - scenario: "Filtering all queries by tenant_id"
      correct: |
        const { data, error } = await supabase
          .from('my_table')
          .select('*')
          .eq('tenant_id', tenantId);
      incorrect: |
        const { data, error } = await supabase
          .from('my_table')
          .select('*');
    - scenario: "Soft delete instead of physical delete"
      correct: |
        const { error } = await supabase
          .from('my_table')
          .update({ activo: false })
          .eq('id', recordId);
      incorrect: |
        const { error } = await supabase
          .from('my_table')
          .delete()
          .eq('id', recordId);
